<!-- Course loading screen: keep before embedded fonts and lesson data. -->
<style id="page-loader-style">
#page-loader{display:none;position:fixed;inset:0;z-index:10000;place-content:center;justify-items:center;gap:24px;background:#fafbf8;color:#245e4f;font:500 16px/1.5 system-ui,sans-serif;letter-spacing:-.3px}
html.page-is-loading #page-loader{display:grid}
html.page-is-loading{overflow:hidden}
#page-loader .loading-mark{display:grid;grid-template-columns:26px 26px;grid-template-rows:26px 26px;gap:8px}
#page-loader .loading-tile{position:relative;border-radius:6px;background:#c4d8b0;overflow:hidden}
#page-loader .loading-tile:nth-child(3){grid-area:2/2;background:#70945b}
#page-loader .loading-tile:nth-child(4){grid-area:2/1}
#page-loader .loading-tile::after{content:"";position:absolute;inset:0;background:#245e4f;opacity:0;animation:loading-clockwise 1.2s linear infinite;will-change:opacity}
#page-loader .loading-tile:nth-child(2)::after{animation-delay:-.9s}
#page-loader .loading-tile:nth-child(3)::after{animation-delay:-.6s}
#page-loader .loading-tile:nth-child(4)::after{animation-delay:-.3s}
#page-loader p{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@keyframes loading-clockwise{0%,20%,100%{opacity:1}25%,95%{opacity:0}}
@media(prefers-reduced-motion:reduce){#page-loader .loading-tile::after{animation:none;will-change:auto}#page-loader .loading-tile:first-child::after{opacity:1}}
</style>
<script>
(() => {
  const root = document.documentElement;
  let navigationTimer;
  let navigating = false;
  const setLoading = active => {
    root.classList.toggle('page-is-loading', active);
    root.setAttribute('aria-busy', String(active));
    document.querySelectorAll('.deck,.container').forEach(el => { el.inert = active; });
  };
  const finish = () => { clearTimeout(navigationTimer); navigating = false; setLoading(false); };
  setLoading(true);
  document.addEventListener('DOMContentLoaded', async () => {
    setLoading(true);
    const assets = [...document.images].map(img => img.decode().catch(() => {}));
    if (document.fonts) assets.push(document.fonts.ready);
    let assetTimer;
    await Promise.race([Promise.allSettled(assets), new Promise(resolve => { assetTimer = setTimeout(resolve, 8000); })]);
    clearTimeout(assetTimer);
    requestAnimationFrame(() => requestAnimationFrame(() => { if (!navigating) finish(); }));
  }, {once:true});
  window.addEventListener('pageshow', event => { if (event.persisted) finish(); });
  window.addEventListener('pagehide', () => clearTimeout(navigationTimer));
  window.navigateWithCourseLoader = (destination, replace = false) => {
    navigating = true;
    setLoading(true);
    clearTimeout(navigationTimer);
    navigationTimer = setTimeout(finish, 15000);
    requestAnimationFrame(() => setTimeout(() => location[replace ? 'replace' : 'assign'](destination), 0));
  };
  document.addEventListener('click', event => {
    const link = event.target.closest('a[href]');
    if (!link || event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey || link.hasAttribute('download') || (link.target && link.target !== '_self')) return;
    const destination = new URL(link.href, location.href);
    if (destination.origin !== location.origin || !/\/(?:main|week\d+_prac)\.html$/.test(destination.pathname)) return;
    event.preventDefault();
    window.navigateWithCourseLoader(destination.href);
  });
})();
</script>

<script id="lesson-data" type="application/json">[{"id":"chal1","title":"포스터 편집 작업 되돌리기","tag":"도전문제 1","problemNumber":1,"statement":"**문제 상황**\n\n동아리 포스터를 만들면서 제목 추가, 사진 배치 같은 편집 작업을 기록합니다.\n취소 요청이 들어오면 가장 최근에 추가한 작업부터 하나씩 되돌립니다.\n현재까지 취소되지 않은 작업을 스택에 보관하는 프로그램을 작성하세요.\n실제 그림을 편집하는 대신 작업 이름만 저장합니다.\n\n**만들 클래스**\n\n스택의 맨 위는 리스트의 마지막 원소입니다.\n아래 표는 저장 방식과 별개로 각 연산이 해야 할 일을 정한 **추상자료형의 약속**입니다.\n\n| 메서드 | 역할 |\n| --- | --- |\n| `Stack()` | 빈 리스트를 `self.items`에 저장합니다. |\n| `push(item)` | 새 작업을 맨 위에 추가합니다. 반환값은 사용하지 않습니다. |\n| `pop()` | 맨 위 작업을 제거하고 반환합니다. 비어 있으면 `None`을 반환합니다. |\n| `peek()` | 맨 위 작업을 제거하지 않고 반환합니다. 비어 있으면 `None`을 반환합니다. |\n| `isEmpty()` | 비어 있으면 `True`, 아니면 `False`를 반환합니다. |\n\n**입출력 형식**\n\n- **입력:** 첫 줄에 명령 수, 다음 줄부터 명령을 한 줄씩 입력합니다.\n- `추가 작업명`: 작업을 저장합니다. 출력은 없습니다.\n- `취소`: 최근 작업을 제거하고 `취소: 작업명`을 출력합니다.\n- `확인`: 제거하지 않고 `최근 작업: 작업명`을 출력합니다.\n- 빈 스택에서 취소하거나 확인하면 `작업이 없습니다.`를 출력합니다.\n- **조건:** 명령 수는 1 이상 100 이하입니다. 명령은 위 세 형식 중 하나이며, 작업명은 공백 없는 비어 있지 않은 문자열입니다. 같은 이름도 별개의 작업입니다.\n\n**작성 안내**\n\n이론 교안의 「스택 구현」(21쪽)을 참고해 **다섯 메서드의 본문과 명령별 메서드 호출**을 작성하세요.\n클래스와 메서드 선언, 객체 생성, 입력, 명령 분기와 출력 코드는 준비되어 있습니다.\n`pass`는 아무 작업도 하지 않는 문장입니다. 각 `pass`를 지우고 안내 주석에 맞는 코드를 작성하세요.\n메서드 본문과 클래스 아래 명령 처리 부분의 `pass`를 모두 작성하세요.\n\n작업을 담는 리스트의 속성 이름은 `self.items`로 사용합니다.\n클래스 안에서는 리스트 연산으로 스택을 구현하고, 클래스 밖에서는 `stack`의 메서드를 호출합니다.\n추가할 작업명은 `parts[1]`이며, 취소와 확인의 반환값은 `item`에 저장하세요.\n메서드 안에서는 출력하지 않습니다. 빈 스택에서 반환한 `None`은 아래 출력 코드가 구분합니다.\n\n**입력 예시**\n```\n4\n추가 제목추가\n추가 사진배치\n취소\n확인\n```\n\n**출력 예시**\n```\n명령 수: 4\n명령: 추가 제목추가\n명령: 추가 사진배치\n명령: 취소\n취소: 사진배치\n명령: 확인\n최근 작업: 제목추가\n```\n","skeleton":"# To Do\n\nclass Stack:\n    def __init__(self):\n        # 이 스택에서 사용할 빈 리스트를 준비하세요.\n        pass\n\n    def push(self, item):\n        # 새 작업을 스택에 저장하세요.\n        pass\n\n    def pop(self):\n        # 최근 작업을 제거해 반환하고, 비어 있으면 None을 반환하세요.\n        pass\n\n    def peek(self):\n        # 최근 작업을 제거하지 않고 반환하고, 비어 있으면 None을 반환하세요.\n        pass\n\n    def isEmpty(self):\n        # 스택이 비어 있는지 불리언 값으로 반환하세요.\n        pass\n\n\nstack = Stack()\ncount = int(input(\"명령 수: \"))\nfor i in range(count):\n    parts = input(\"명령: \").split()\n    command = parts[0]\n    if command == \"추가\":\n        # 새 작업을 스택에 저장하세요.\n        pass\n    elif command == \"취소\":\n        # 최근 작업을 제거해 item에 저장하세요.\n        pass\n        if item is None:\n            print(\"작업이 없습니다.\")\n        else:\n            print(f\"취소: {item}\")\n    elif command == \"확인\":\n        # 최근 작업을 제거하지 않고 item에 저장하세요.\n        pass\n        if item is None:\n            print(\"작업이 없습니다.\")\n        else:\n            print(f\"최근 작업: {item}\")\n","code":"### Solution ###\n\nclass Stack:\n    def __init__(self):\n        # Sol: 이 스택의 작업을 저장할 빈 리스트를 만듭니다.\n        self.items = []\n\n    def push(self, item):\n        # Sol: 새 작업을 스택의 맨 위에 추가합니다.\n        self.items.append(item)\n\n    def pop(self):\n        # Sol: 작업이 있으면 맨 위 작업을 제거하고 반환합니다.\n        if self.isEmpty():\n            return None\n        return self.items.pop()\n\n    def peek(self):\n        # Sol: 작업을 제거하지 않고 맨 위 작업을 반환합니다.\n        if self.isEmpty():\n            return None\n        return self.items[-1]\n\n    def isEmpty(self):\n        # Sol: 저장된 작업이 없는지 반환합니다.\n        return len(self.items) == 0\n\n\nstack = Stack()\ncount = int(input(\"명령 수: \"))\nfor i in range(count):\n    parts = input(\"명령: \").split()\n    command = parts[0]\n    if command == \"추가\":\n        # Sol: 입력한 작업을 스택에 추가합니다.\n        stack.push(parts[1])\n    elif command == \"취소\":\n        # Sol: 최근 작업을 제거해 item에 저장합니다.\n        item = stack.pop()\n        if item is None:\n            print(\"작업이 없습니다.\")\n        else:\n            print(f\"취소: {item}\")\n    elif command == \"확인\":\n        # Sol: 최근 작업을 제거하지 않고 item에 저장합니다.\n        item = stack.peek()\n        if item is None:\n            print(\"작업이 없습니다.\")\n        else:\n            print(f\"최근 작업: {item}\")\n","image":"assets/illustrations/a876a8bb9c925b270da7.webp","imageAlt":"동아리 포스터를 편집하며 작업 내용을 확인하는 학생","inputSpec":"명령 수를 입력한 뒤, 명령을 한 줄씩 입력","outputSpec":"취소한 작업 또는 최근 작업. 빈 스택이면 안내 문구.","cases":[{"label":"추가 후 취소와 확인","input":["4","추가 제목추가","추가 사진배치","취소","확인"],"expected":"취소: 사진배치\n최근 작업: 제목추가","fullOutput":"명령 수: 4\n명령: 추가 제목추가\n명령: 추가 사진배치\n명령: 취소\n취소: 사진배치\n명령: 확인\n최근 작업: 제목추가","trace":[{"line":4,"kind":"call","scope":"__init__","before":{"vars":{},"frames":[],"objects":[],"output":[]},"state":{"vars":{},"frames":[{"id":1,"name":"__init__","vars":{"self":{"ref":1}}}],"objects":[{"id":1,"type":"Stack","attrs":{}}],"output":[]},"callId":1},{"line":6,"kind":"line","scope":"__init__","before":{"vars":{},"frames":[{"id":1,"name":"__init__","vars":{"self":{"ref":1}}}],"objects":[{"id":1,"type":"Stack","attrs":{}}],"output":[]},"state":{"vars":{},"frames":[{"id":1,"name":"__init__","vars":{"self":{"ref":1}}}],"objects":[{"id":1,"type":"Stack","attrs":{"items":[]}}],"output":[]}},{"line":6,"kind":"return","scope":"__init__","before":{"vars":{},"frames":[{"id":1,"name":"__init__","vars":{"self":{"ref":1}}}],"objects":[{"id":1,"type":"Stack","attrs":{"items":[]}}],"output":[]},"state":{"vars":{},"frames":[],"objects":[{"id":1,"type":"Stack","attrs":{"items":[]}}],"output":[]},"value":null,"returnId":1,"returnVars":{"self":{"ref":1}}},{"line":29,"kind":"line","scope":"<module>","before":{"vars":{},"frames":[],"objects":[{"id":1,"type":"Stack","attrs":{"items":[]}}],"output":[]},"state":{"vars":{"stack":{"ref":1}},"frames":[],"objects":[{"id":1,"type":"Stack","attrs":{"items":[]}}],"output":[]}},{"line":30,"kind":"line","scope":"<module>","before":{"vars":{"stack":{"ref":1}},"frames":[],"objects":[{"id":1,"type":"Stack","attrs":{"items":[]}}],"output":[]},"state":{"vars":{"stack":{"ref":1},"count":4},"frames":[],"objects":[{"id":1,"type":"Stack","attrs":{"items":[]}}],"output":[]}},{"line":31,"kind":"line","scope":"<module>","before":{"vars":{"stack":{"ref":1},"count":4},"frames":[],"objects":[{"id":1,"type":"Stack","attrs":{"items":[]}}],"output":[ .peek()\n        if item is None:\n            print(\"작업이 없습니다.\")\n        else:\n            print(f\"최근 작업: {item}\")"}},{"id":"chal2","title":"도서관 프린터 대기열","tag":"도전문제 2","problemNumber":2,"statement":"**문제 상황**\n\n도서관 프린터에 여러 문서의 인쇄 요청이 들어옵니다.\n접수된 문서는 대기열에 넣고, 인쇄 명령이 오면 **먼저 접수된 문서부터** 한 개씩 꺼냅니다.\n다음 문서를 확인하는 명령은 인쇄하거나 순서를 바꾸지 않습니다.\n리스트를 사용하는 `Queue` 클래스를 직접 구현하세요.\n\n**만들 클래스**\n\n이론 교안의 「큐 구현: 선형 큐」(30쪽)처럼 리스트에 문서를 저장합니다.\n리스트의 앞이 큐의 앞이며, 뒤로 접수하고 앞에서 꺼냅니다.\n\n| 메서드 | 역할 |\n| --- | --- |\n| `Queue()` | 빈 리스트를 `self.queue`에 저장합니다. |\n| `enqueue(value)` | 새 문서를 맨 뒤에 추가합니다. 반환값은 사용하지 않습니다. |\n| `dequeue()` | 맨 앞 문서를 제거하고 반환합니다. 비어 있으면 `None`을 반환합니다. |\n| `peek()` | 맨 앞 문서를 제거하지 않고 반환합니다. 비어 있으면 `None`을 반환합니다. |\n| `isEmpty()` | 비어 있으면 `True`, 아니면 `False`를 반환합니다. |\n\n교안의 큐 예시는 빈 상태에서 안내 문자열을 반환하지만, 이 문제는 1번 스택과 마찬가지로 **`None`을 반환**합니다.\n안내 문구는 클래스 밖에서 출력합니다.\n\n**입출력 형식**\n\n- **입력:** 첫 줄에 명령 수, 다음 줄부터 명령을 한 줄씩 입력합니다.\n- `접수 문서명`: 대기열에 문서를 추가합니다. 출력은 없습니다.\n- `인쇄`: 맨 앞 문서를 꺼내 `인쇄: 문서명`을 출력합니다.\n- `확인`: 맨 앞 문서를 꺼내지 않고 `다음 문서: 문서명`을 출력합니다.\n- 빈 큐에서 인쇄하거나 확인하면 `대기 문서가 없습니다.`를 출력합니다.\n- **조건:** 명령 수는 1 이상 100 이하이며 명령 형식은 항상 올바릅니다. 문서명은 공백 없는 비어 있지 않은 문자열이며, 같은 이름의 문서도 별개의 요청입니다.\n\n**작성 안내**\n\n**다섯 메서드의 본문과 명령별 메서드 호출**을 작성하세요.\n클래스와 메서드 선언, 객체 생성, 입력, 명령 분기와 출력 코드는 준비되어 있습니다.\n각 `pass`를 지우고 안내 주석에 맞는 코드를 작성하세요.\n메서드 본문과 클래스 아래 명령 처리 부분의 `pass`를 모두 작성하세요.\n문서를 담는 리스트의 속성 이름은 `self.queue`로 사용합니다.\n접수할 문서명은 `parts[1]`이며, 인쇄와 확인의 반환값은 `document`에 저장하세요.\n클래스 밖에서는 `queue`의 메서드를 호출합니다.\n\n리스트의 `append()`, `pop(0)`, 첫 원소 조회를 사용해 선형 큐를 구현하세요.\n스택의 `pop()`과 큐에서 사용할 `pop(0)`이 어느 끝의 원소를 꺼내는지 비교해 보세요.\n메서드 안에서 빈 상태를 확인하고, 클래스 밖에서는 내부 리스트를 직접 조작하지 않습니다.\n이 문제에서는 `collections.deque`나 다른 큐 라이브러리를 사용하지 않습니다.\n\n리스트의 `pop(0)`은 남은 원소들을 앞으로 이동시킵니다. 이번에는 교안의 구현을 연습하며,\n다음 문제에서는 양쪽 끝 연산을 제공하는 `collections.deque`를 사용합니다.\n\n**입력 예시**\n```\n5\n접수 보고서\n접수 신청서\n확인\n인쇄\n확인\n```\n\n**출력 예시**\n```\n명령 수: 5\n명령: 접수 보고서\n명령: 접수 신청서\n명령: 확인\n다음 문서: 보고서\n명령: 인쇄\n인쇄: 보고서\n명령: 확인\n다음 문서: 신청서\n```\n","skeleton":"# To Do\n\nclass Queue:\n    def __init__(self):\n        # 이 큐에서 사용할 빈 리스트를 준비하세요.\n        pass\n\n    def enqueue(self, value):\n        # 새 문서를 큐에 저장하세요.\n        pass\n\n    def dequeue(self):\n        # 먼저 접수한 문서를 제거해 반환하고, 비어 있으면 None을 반환하세요.\n        pass\n\n    def peek(self):\n        # 다음 문서를 제거하지 않고 반환하고, 비어 있으면 None을 반환하세요.\n        pass\n\n    def isEmpty(self):\n        # 큐가 비어 있는지 불리언 값으로 반환하세요.\n        pass\n\n\nqueue = Queue()\ncount = int(input(\"명령 수: \"))\nfor i in range(count):\n    parts = input(\"명령: \").split()\n    command = parts[0]\n    if command == \"접수\":\n        # 새 문서를 큐에 저장하세요.\n        pass\n    elif command == \"인쇄\":\n        # 먼저 접수한 문서를 제거해 document에 저장하세요.\n        pass\n        if document is None:\n            print(\"대기 문서가 없습니다.\")\n        else:\n            print(f\"인쇄: {document}\")\n    elif command == \"확인\":\n        # 다음 문서를 제거하지 않고 document에 저장하세요.\n        pass\n        if document is None:\n            print(\"대기 문서가 없습니다.\")\n        else:\n            print(f\"다음 문서: {document}\")\n","code":"### Solution ###\n\nclass Queue:\n    def __init__(self):\n        # Sol: 이 큐의 문서를 저장할 빈 리스트를 만듭니다.\n        self.queue = []\n\n    def enqueue(self, value):\n        # Sol: 새 문서는 리스트의 맨 뒤에 추가합니다.\n        self.queue.append(value)\n\n    def dequeue(self):\n        # Sol: 먼저 접수된 맨 앞 문서를 제거하고 반환합니다.\n        if self.isEmpty():\n            return None\n        return self.queue.pop(0)\n\n    def peek(self):\n        # Sol: 맨 앞 문서를 제거하지 않고 반환합니다.\n        if self.isEmpty():\n            return None\n        return self.queue[0]\n\n    def isEmpty(self):\n        # Sol: 저장된 문서가 없는지 반환합니다.\n        return len(self.queue) == 0\n\n\nqueue = Queue()\ncount = int(input(\"명령 수: \"))\nfor i in range(count):\n    parts = input(\"명령: \").split()\n    command = parts[0]\n    if command == \"접수\":\n        # Sol: 입력한 문서를 큐에 추가합니다.\n        queue.enqueue(parts[1])\n    elif command == \"인쇄\":\n        # Sol: 먼저 접수한 문서를 제거해 document에 저장합니다.\n        document = queue.dequeue()\n        if document is None:\n            print(\"대기 문서가 없습니다.\")\n        else:\n            print(f\"인쇄: {document}\")\n    elif command == \"확인\":\n        # Sol: 다음 문서를 제거하지 않고 document에 저장합니다.\n        document = queue.peek()\n        if document is None:\n            print(\"대기 문서가 없습니다.\")\n        else:\n            print(f\"다음 문서: {document}\")\n","image":"assets/illustrations/3e02efbce572a893a837.webp","imageAlt":"도서관 프린터에서 문서 인쇄를 기다리는 학생들","inputSpec":"명령 수를 입력한 뒤, 명령을 한 줄씩 입력","outputSpec":"인쇄한 문서 또는 다음 문서. 빈 큐이면 안내 문구.","cases":[{"label":"접수와 조회 및 인쇄","input":["5","접수 보고서","접수 신청서","확인","인쇄","확인"],"expected":"다음 문서: 보고서\n인쇄: 보고서\n다음 문서: 신청서","fullOutput":"명령 수: 5\n명령: 접수 보고서\n명령: 접수 신청서\n명령: 확인\n다음 문서: 보고서\n명령: 인쇄\n인쇄: 보고서\n명령: 확인\n다음 문서: 신청서","trace":[{"line":4,"kind":"call","scope":"__init__","before":{"vars":{},"frames":[],"objects":[],"output":[]},"state":{"vars":{},"frames":[{"id":1,"name":"__init__","vars":{"self":{"ref":1}}}],"objects":[{"id":1,"type":"Queue","attrs":{}}],"output":[]},"callId":1},{"line":6,"kind":"line","scope":"__init__","before":{"vars":{},"frames":[{"id":1,"name":"__init__","vars":{"self":{"ref":1}}}],"objects":[{"id":1,"type":"Queue","attrs":{}}],"output":[]},"state":{"vars":{},"frames":[{"id":1,"name":"__init__","vars":{"self":{"ref":1}}}],"objects":[{"id":1,"type":"Queue","attrs":{"queue":[]}}],"output":[]}},{"line":6,"kind":"return","scope":"__init__","before":{"vars":{},"frames":[{"id":1,"name":"__init__","vars":{"self":{"ref":1}}}],"objects":[{"id":1,"type":"Queue","attrs":{"queue":[]}}],"output":[]},"state":{"vars":{},"frames":[],"objects":[{"id":1,"type":"Queue","attrs":{"queue":[]}}],"output":[]},"value":null,"returnId":1,"returnVars":{"self":{"ref":1}}},{"line":29,"kind":"line","scope":"<module>","before":{"vars":{},"frames":[],"objects":[{"id":1,"type":"Queue","attrs":{"queue":[]}}],"output":[]},"state":{"vars":{"queue":{"ref":1}},"frames":[],"objects":[{"id" source":1,"kind":"write","context":"구현할 코드"},{"row":8,"source":5,"kind":"write","context":"구현할 코드"},{"row":9,"source":6,"kind":"write","context":"구현할 코드"},{"row":14,"source":9,"kind":"write","context":"구현할 코드"},{"row":15,"source":10,"kind":"write","context":"구현할 코드"},{"row":20,"source":13,"kind":"write","context":"구현할 코드"},{"row":21,"source":14,"kind":"write","context":"구현할 코드"},{"row":22,"source":15,"kind":"write","context":"구현할 코드"},{"row":23,"source":16,"kind":"write","context":"구현할 코드"},{"row":28,"source":19,"kind":"write","context":"구현할 코드"},{"row":29,"source":20,"kind":"write","context":"구현할 코드"},{"row":30,"source":21,"kind":"write","context":"구현할 코드"},{"row":31,"source":22,"kind":"write","context":"구현할 코드"},{"row":36,"source":25,"kind":"write","context":"구현할 코드"},{"row":37,"source":26,"kind":"write","context":"구현할 코드"},{"row":48,"source":35,"kind":"write","context":"구현할 코드"},{"row":49,"source":36,"kind":"write","context":"구현할 코드"},{"row":53,"source":38,"kind":"write","context":"구현할 코드"},{"row":54,"source":39,"kind":"write","context":"구현할 코드"},{"row":62,"source":45,"kind":"write","context":"구현할 코드"},{"row":63,"source":46,"kind":"write","context":"구현할 코드"}],"final":"### Solution ###\n\nclass Queue:\n    def __init__(self):\n        # Sol: 이 큐의 문서를 저장할 빈 리스트를 만듭니다.\n        self.queue = []\n\n    def enqueue(self, value):\n        # Sol: 새 문서는 리스트의 맨 뒤에 추가합니다.\n        self.queue.append(value)\n\n    def dequeue(self):\n        # Sol: 먼저 접수된 맨 앞 문서를 제거하고 반환합니다.\n        if self.isEmpty():\n            return None\n        return self.queue.pop(0)\n\n    def peek(self):\n        # Sol: 맨 앞 문서를 제거하지 않고 반환합니다.\n        if self.isEmpty():\n            return None\n        return self.queue[0]\n\n    def isEmpty(self):\n        # Sol: 저장된 문서가 없는지 반환합니다.\n        return len(self.queue) == 0\n\n\nqueue = Queue()\ncount = int(input(\"명령 수: \"))\nfor i in range(count):\n    parts = input(\"명령: \").split()\n    command = parts[0]\n    if command == \"접수\":\n        # Sol: 입력한 문서를 큐에 추가합니다.\n        queue.enqueue(parts[1])\n    elif command == \"인쇄\":\n        # Sol: 먼저 접수한 문서를 제거해 document에 저장합니다.\n        document = queue.dequeue()\n        if document is None:\n            print(\"대기 문서가 없습니다.\")\n        else:\n            print(f\"인쇄: {document}\")\n    elif command == \"확인\":\n        # Sol: 다음 문서를 제거하지 않고 document에 저장합니다.\n        document = queue.peek()\n        if document is None:\n            print(\"대기 문서가 없습니다.\")\n        else:\n            print(f\"다음 문서: {document}\")"}},{"id":"chal3","title":"양쪽 출입구의 물품 보관대","tag":"도전문제 3","problemNumber":3,"statement":"**문제 상황**\n\n영상 동아리의 물품 보관대에는 카메라, 삼각대, 조명 등이 일렬로 놓입니다.\n양쪽 출입구에서 물품을 넣고 꺼낼 수 있지만, 가운데 물품을 바로 꺼낼 수는 없습니다.\n입력된 명령에 따라 보관대의 상태를 관리하세요. 처음 보관대는 비어 있습니다.\n\n**사용할 연산**\n\n덱은 **양쪽 끝에서 삽입과 삭제가 모두 가능한 자료형**입니다.\n이 문제에서는 앞을 왼쪽, 뒤를 오른쪽으로 정합니다.\n`from collections import deque`로 표준 라이브러리의 `deque`를 불러옵니다.\n1번과 2번처럼 클래스를 직접 정의하지 않고, 준비된 자료구조의 연산을 사용합니다.\n\n| 코드 | 역할 |\n| --- | --- |\n| `deque()` | 빈 덱을 만듭니다. |\n| `shelf.appendleft(item)` | 왼쪽 끝에 넣습니다. |\n| `shelf.append(item)` | 오른쪽 끝에 넣습니다. |\n| `shelf.popleft()` | 왼쪽 끝 물품을 제거하고 반환합니다. |\n| `shelf.pop()` | 오른쪽 끝 물품을 제거하고 반환합니다. |\n| `if shelf:` | 물품이 있을 때만 아래 코드를 실행합니다. |\n| `shelf[0]` | 왼쪽 끝 물품을 제거하지 않고 읽습니다. 빈 덱에서는 사용할 수 없습니다. |\n\n**입출력 형식**\n\n- **입력:** 첫 줄에 명령 수, 다음 줄부터 명령을 한 줄씩 입력합니다.\n- `왼쪽추가 물품명`, `오른쪽추가 물품명`: 지정한 끝에 물품을 넣습니다. 출력은 없습니다.\n- `왼쪽꺼내기`, `오른쪽꺼내기`: 지정한 끝에서 꺼내 `꺼낸 물품: 물품명`을 출력합니다.\n- 빈 보관대에서 꺼내기를 요청하면 `보관대가 비어 있습니다.`를 출력하고 다음 명령을 계속 처리합니다.\n- **조건:** 명령 수는 1 이상 100 이하이며 명령 형식은 항상 올바릅니다. 물품명은 공백 없는 비어 있지 않은 문자열입니다. 같은 이름의 물품도 각각 보관하고 꺼냅니다.\n\n**작성 안내**\n\nimport, 입력, 반복문과 명령 분기가 제공됩니다.\n**`shelf` 생성과 네 분기의 처리 및 출력**을 작성하세요. 꺼낸 물품은 `item`에 저장합니다.\n`deque`의 네 연산을 사용하고, 꺼내기 전에 빈 상태를 확인하세요.\n정렬하거나 가운데 원소를 삭제하지 않습니다.\n\n**입력 예시**\n```\n5\n왼쪽추가 카메라\n오른쪽추가 삼각대\n왼쪽추가 조명\n오른쪽꺼내기\n왼쪽꺼내기\n```\n\n**출력 예시**\n```\n명령 수: 5\n명령: 왼쪽추가 카메라\n명령: 오른쪽추가 삼각대\n명령: 왼쪽추가 조명\n명령: 오른쪽꺼내기\n꺼낸 물품: 삼각대\n명령: 왼쪽꺼내기\n꺼낸 물품: 조명\n```\n","skeleton":"# To Do\nfrom collections import deque\n\n# 빈 보관대 shelf를 만드세요.\n\n\ncount = int(input(\"명령 수: \"))\nfor i in range(count):\n    parts = input(\"명령: \").split()\n    command = parts[0]\n    if command == \"왼쪽추가\":\n        # 왼쪽 끝에 물품을 넣으세요.\n        pass\n    elif command == \"오른쪽추가\":\n        # 오른쪽 끝에 물품을 넣으세요.\n        pass\n    elif command == \"왼쪽꺼내기\":\n        # 왼쪽 끝에서 물품을 꺼내거나 빈 상태를 안내하세요.\n        pass\n    elif command == \"오른쪽꺼내기\":\n        # 오른쪽 끝에서 물품을 꺼내거나 빈 상태를 안내하세요.\n        pass\n","code":"### Solution ###\nfrom collections import deque\n\n# Sol: 양쪽 끝을 사용할 빈 보관대를 만듭니다.\nshelf = deque()\n\ncount = int(input(\"명령 수: \"))\nfor i in range(count):\n    parts = input(\"명령: \").split()\n    command = parts[0]\n    if command == \"왼쪽추가\":\n        # Sol: 새 물품을 왼쪽 끝에 추가합니다.\n        shelf.appendleft(parts[1])\n    elif command == \"오른쪽추가\":\n        # Sol: 새 물품을 오른쪽 끝에 추가합니다.\n        shelf.append(parts[1])\n    elif command == \"왼쪽꺼내기\":\n        # Sol: 왼쪽 끝 물품을 꺼내고 빈 상태는 따로 안내합니다.\n        if shelf:\n            item = shelf.popleft()\n            print(f\"꺼낸 물품: {item}\")\n        else:\n            print(\"보관대가 비어 있습니다.\")\n    elif command == \"오른쪽꺼내기\":\n        # Sol: 오른쪽 끝 물품을 꺼내고 빈 상태는 따로 안내합니다.\n        if shelf:\n            item = shelf.pop()\n            print(f\"꺼낸 물품: {item}\")\n        else:\n            print(\"보관대가 비어 있습니다.\")\n","image":"assets/illustrations/9728a2435a299bef3a62.webp","imageAlt":"보관대 양쪽에서 촬영 물품을 넣고 꺼내는 학생들","inputSpec":"명령 수를 입력한 뒤, 명령을 한 줄씩 입력","outputSpec":"꺼낸 물품. 빈 보관대이면 안내 문구.","cases":[{"label":"양쪽 끝 사용","input":["5","왼쪽추가 카메라","오른쪽추가 삼각대","왼쪽추가 조명","오른쪽꺼내기","왼쪽꺼내기"],"expected":"꺼낸 물품: 삼각대\n꺼낸 물품: 조명","fullOutput":"명령 수: 5\n명령: 왼쪽추가 카메라\n명령: 오른쪽추가 삼각대\n명령: 왼쪽추가 조명\n명령: 오른쪽꺼내기\n꺼낸 물품: 삼각대\n명령: 왼쪽꺼내기\n꺼낸 물품: 조명","trace":[{"line":5,"kind":"line","scope":"<module>","before":{"vars":{},"frames":[],"objects":[],"output":[]},"state":{"vars":{"shelf":[]},"frames":[],"objects":[],"output":[]}},{"line":7,"kind":"line","scope elf를 만드세요.","show":0,"until":2},{"id":6,"text":"","show":0,"until":2},{"id":7,"text":"# Sol: 양쪽 끝을 사용할 빈 보관대를 만듭니다.","show":2,"source":4},{"id":8,"text":"shelf = deque()","show":3,"source":5},{"id":9,"text":"","show":0,"source":6},{"id":10,"text":"count = int(input(\"명령 수: \"))","show":0,"source":7},{"id":11,"text":"for i in range(count):","show":0,"source":8},{"id":12,"text":"    parts = input(\"명령: \").split()","show":0,"source":9},{"id":13,"text":"    command = parts[0]","show":0,"source":10},{"id":14,"text":"    if command == \"왼쪽추가\":","show":0,"source":11},{"id":15,"text":"        # 왼쪽 끝에 물품을 넣으세요.","show":0,"until":4},{"id":16,"text":"        pass","show":0,"until":4},{"id":17,"text":"        # Sol: 새 물품을 왼쪽 끝에 추가합니다.","show":4,"source":12},{"id":18,"text":"        shelf.appendleft(parts[1])","show":5,"source":13},{"id":19,"text":"    elif command == \"오른쪽추가\":","show":0,"source":14},{"id":20,"text":"        # 오른쪽 끝에 물품을 넣으세요.","show":0,"until":6},{"id":21,"text":"        pass","show":0,"until":6},{"id":22,"text":"        # Sol: 새 물품을 오른쪽 끝에 추가합니다.","show":6,"source":15},{"id":23,"text":"        shelf.append(parts[1])","show":7,"source":16},{"id":24,"text":"    elif command == \"왼쪽꺼내기\":","show":0,"source":17},{"id":25,"text":"        # 왼쪽 끝에서 물품을 꺼내거나 빈 상태를 안내하세요.","show":0,"until":8},{"id":26,"text":"        pass","show":0,"until":8},{"id":27,"text":"        # Sol: 왼쪽 끝 물품을 꺼내고 빈 상태는 따로 안내합니다.","show":8,"source":18},{"id":28,"text":"        if shelf:","show":9,"source":19},{"id":29,"text":"            item = shelf.popleft()","show":10,"source":20},{"id":30,"text":"            print(f\"꺼낸 물품: {item}\")","show":11,"source":21},{"id":31,"text":"        else:","show":12,"source":22},{"id":32,"text":"            print(\"보관대가 비어 있습니다.\")","show":13,"source":23},{"id":33,"text":"    elif command == \"오른쪽꺼내기\":","show":0,"source":24},{"id":34,"text":"        # 오른쪽 끝에서 물품을 꺼내거나 빈 상태를 안내하세요.","show":0,"until":14},{"id":35,"text":"        pass","show":0,"until":14},{"id":36,"text":"        # Sol: 오른쪽 끝 물품을 꺼내고 빈 상태는 따로 안내합니다.","show":14,"source":25},{"id":37,"text":"        if shelf:","show":15,"source":26},{"id":38,"text":"            item = shelf.pop()","show":16,"source":27},{"id":39,"text":"            print(f\"꺼낸 물품: {item}\")","show":17,"source":28},{"id":40,"text":"        else:","show":18,"source":29},{"id":41,"text":"            print(\"보관대가 비어 있습니다.\")","show":19,"source":30}],"steps":[{"row":2,"source":1,"kind":"write","context":"구현할 코드"},{"row":7,"source":4,"kind":"write","context":"구현할 코드"},{"row":8,"source":5,"kind":"write","context":"구현할 코드"},{"row":17,"source":12,"kind":"write","context":"구현할 코드"},{"row":18,"source":13,"kind":"write","context":"구현할 코드"},{"row":22,"source":15,"kind":"write","context":"구현할 코드"},{"row":23,"source":16,"kind":"write","context":"구현할 코드"},{"row":27,"source":18,"kind":"write","context":"구현할 코드"},{"row":28,"source":19,"kind":"write","context":"구현할 코드"},{"row":29,"source":20,"kind":"write","context":"구현할 코드"},{"row":30,"source":21,"kind":"write","context":"구현할 코드"},{"row":31,"source":22,"kind":"write","context":"구현할 코드"},{"row":32,"source":23,"kind":"write","context":"구현할 코드"},{"row":36,"source":25,"kind":"write","context":"구현할 코드"},{"row":37,"source":26,"kind":"write","context":"구현할 코드"},{"row":38,"source":27,"kind":"write","context":"구현할 코드"},{"row":39,"source":28,"kind":"write","context":"구현할 코드"},{"row":40,"source":29,"kind":"write","context":"구현할 코드"},{"row":41,"source":30,"kind":"write","context":"구현할 코드"}],"final":"### Solution ###\nfrom collections import deque\n\n# Sol: 양쪽 끝을 사용할 빈 보관대를 만듭니다.\nshelf = deque()\n\ncount = int(input(\"명령 수: \"))\nfor i in range(count):\n    parts = input(\"명령: \").split()\n    command = parts[0]\n    if command == \"왼쪽추가\":\n        # Sol: 새 물품을 왼쪽 끝에 추가합니다.\n        shelf.appendleft(parts[1])\n    elif command == \"오른쪽추가\":\n        # Sol: 새 물품을 오른쪽 끝에 추가합니다.\n        shelf.append(parts[1])\n    elif command == \"왼쪽꺼내기\":\n        # Sol: 왼쪽 끝 물품을 꺼내고 빈 상태는 따로 안내합니다.\n        if shelf:\n            item = shelf.popleft()\n            print(f\"꺼낸 물품: {item}\")\n        else:\n            print(\"보관대가 비어 있습니다.\")\n    elif command == \"오른쪽꺼내기\":\n        # Sol: 오른쪽 끝 물품을 꺼내고 빈 상태는 따로 안내합니다.\n        if shelf:\n            item = shelf.pop()\n            print(f\"꺼낸 물품: {item}\")\n        else:\n            print(\"보관대가 비어 있습니다.\")"}},{"id":"chal4","title":"캠퍼스 안내 경로에 방문지 추가하기","tag":"도전문제 4","problemNumber":4,"statement":"**문제 상황**\n\n캠퍼스 안내 경로는 방문지 노드들이 다음 방문지를 가리키는 형태로 연결되어 있습니다.\n기존 방문지 하나의 **바로 뒤에 새 방문지를 추가**하고, 변경된 경로를 처음부터 출력하세요.\n기존 방문지들은 원래의 상대적인 순서를 유지해야 합니다.\n\n**제공되는 구조와 만들 함수**\n\n| 항목 | 역할 |\n| --- | --- |\n| `Node(data)` | 방문지 이름을 `data`에 저장하고 `next`를 `None`으로 초기화합니다. 제공됩니다. |\n| `node.next` | 다음 노드를 가리킵니다. 마지막 노드의 `next`는 `None`입니다. |\n| `head` | 첫 번째 노드를 가리킵니다. 빈 경로이면 `None`입니다. |\n| `make_route(names)` | 입력 목록으로 초기 경로를 만들어 첫 노드를 반환합니다. 제공됩니다. |\n| `insert_after(head, target, name)` | 기준 방문지 `target` 바로 뒤에 `name`을 가진 새 노드를 연결하고 `True`를 반환합니다. 기준 방문지가 없으면 경로를 바꾸지 않고 `False`를 반환합니다. |\n| `route_names(head)` | 노드를 따라 방문지 이름을 순서대로 모은 리스트를 반환합니다. 빈 경로이면 빈 리스트를 반환합니다. |\n\n`current = current.next`는 노드 자체를 옮기는 것이 아니라 현재 확인하는 대상을 다음 노드로 바꿉니다.\n`while current is not None:`은 확인할 노드가 있는 동안 반복한다는 뜻입니다.\n반면 `current.next`에 새 노드를 대입하면 실제 연결 관계가 바뀝니다.\n\n**입출력 형식**\n\n- **입력:** 초기 방문지들을 공백으로 구분한 한 줄, 기준 방문지, 새 방문지를 한 줄씩 입력합니다. 총 3줄입니다.\n- 초기 경로가 비어 있으면 첫 줄에 빈 줄을 입력합니다.\n- **출력:** 최종 경로를 `정문 -> 도서관 -> 학생회관`처럼 출력합니다. 빈 경로이면 `경로가 비어 있습니다.`를 출력합니다.\n- 기준 방문지를 찾지 못하면 먼저 `삽입할 위치가 없습니다.`를 출력한 다음, 바뀌지 않은 경로를 출력합니다.\n- **조건:** 초기 방문지는 0개 이상 30개 이하이며 이름이 중복되지 않습니다. 이름은 공백 없는 비어 있지 않은 문자열입니다. 새 방문지 이름은 기존 이름과 다릅니다. 기준 방문지는 초기 경로에 없을 수도 있습니다.\n\n**작성 안내**\n\n**`insert_after()`와 `route_names()`의 본문만 작성**하세요. 입력과 출력 코드는 제공됩니다.\n현재 노드는 `current`, 새 노드는 `new_node`, 모은 이름은 `result`에 저장합니다.\n함수 안에서는 출력하지 않습니다.\n\n기준 방문지를 찾으면 그 뒤에 원래 어떤 노드가 있었는지 잃어버리지 않도록 연결을 바꾸세요.\n탐색과 삽입은 반드시 `next`를 따라 수행합니다. 경로를 리스트로 변환해 `insert()`로 수정하지 않습니다.\n`route_names()`가 출력용 이름을 리스트에 모으는 것은 허용합니다.\n제공된 `\" -> \".join(result)`는 이름 사이에 화살표 문자열을 넣어 한 줄로 만듭니다.\n\n**입력 예시**\n```\n정문 도서관 학생회관\n도서관\n카페\n```\n\n**출력 예시**\n```\n초기 방문지(공백 구분): 정문 도서관 학생회관\n기준 방문지: 도서관\n새 방문지: 카페\n정문 -> 도서관 -> 카페 -> 학생회관\n```\n","skeleton":"# To Do\n\n# 방문지 하나와 다음 방문지의 참조를 저장합니다.\nclass Node:\n    def __init__(self, data):\n        self.data = data\n        self.next = None\n\n\n# 입력 목록으로 초기 경로를 만듭니다.\ndef make_route(names):\n    head = None\n    tail = None\n    for name in names:\n        node = Node(name)\n        if head is None:\n            head = node\n        else:\n            tail.next = node\n        tail = node\n    return head\n\n\ndef insert_after(head, target, name):\n    # 기준 방문지를 찾아 바로 뒤에 새 노드를 연결하고 성공 여부를 반환하세요.\n    pass\n\n\ndef route_names(head):\n    # 첫 노드부터 방문지 이름을 순서대로 모아 반환하세요.\n    pass\n\n\nnames = input(\"초기 방문지(공백 구분): \").split()\ntarget = input(\"기준 방문지: \")\nname = input(\"새 방문지: \")\nhead = make_route(names)\n\n# 두 함수의 반환값으로 결과를 출력합니다.\ninserted = insert_after(head, target, name)\nif not inserted:\n    print(\"삽입할 위치가 없습니다.\")\nresult = route_names(head)\nif result:\n    print(\" -> \".join(result))\nelse:\n    print(\"경로가 비어 있습니다.\")\n","code":"### Solution ###\n\n# 방문지 하나와 다음 방문지의 참조를 저장합니다.\nclass Node:\n    def __init__(self, data):\n        self.data = data\n        self.next = None\n\n\n# 입력 목록으로 초기 경로를 만듭니다.\ndef make_route(names):\n    head = None\n    tail = None\n    for name in names:\n        node = Node(name)\n        if head is None:\n            head = node\n        else:\n            tail.next = node\n        tail = node\n    return head\n\n\ndef insert_after(head, target, name):\n    # Sol: 다음 노드를 따라 기준 방문지를 찾습니다.\n    current = head\n    while current is not None:\n        if current.data == target:\n            # Sol: 기존 다음 노드를 보존한 뒤 새 노드를 연결합니다.\n            new_node = Node(name)\n            new_node.next = current.next\n            current.next = new_node\n            return True\n        current = current.next\n    return False\n\n\ndef route_names(head):\n    # Sol: None에 도달할 때까지 노드를 따라 이름을 모읍니다.\n    result = []\n    current = head\n    while current is not None:\n        result.append(current.data)\n        current = current.next\n    return result\n\n\nnames = input(\"초기 방문지(공백 구분): \").split()\ntarget = input(\"기준 방문지: \")\nname = input(\"새 방문지: \")\nhead = make_route(names)\n\n# 두 함수의 반환값으로 결과를 출력합니다.\ninserted = insert_after(head, target, name)\nif not inserted:\n    print(\"삽입할 위치가 없습니다.\")\nresult = route_names(head)\nif result:\n    print(\" -> \".join(result))\nelse:\n    print(\"경로가 비어 있습니다.\")\n","image":"assets/illustrations/660793b40813b0273f55.webp","imageAlt":"캠퍼스 지도와 방문할 건물들을 확인하는 안내자","inputSpec":"초기 방문지 목록, 기준 방문지, 새 방문지의 3줄","outputSpec":"삽입 후 경로. 실패 시 안내 문구와 기존 경로.","cases":[{"label":"중간 노드 뒤 삽입","input":["정문 도서관 학생회관","도서관","카페"],"expected":"정문 -> 도서관 -> 카페 -> 학생회관","fullOutput":"초기 방문지(공백 구분): 정문 도서관 학생회관\n기준 방문지: 도서관\n새 방문지: 카페\n정문 -> 도서관 -> 카페 -> 학생회관","trace":[{"line":48,"kind":"line","scope":"<module>","before":{"vars":{},"frames":[],"objects":[],"output":[]},"state":{"vars":{"names":["정문","도서관","학생회관"]},"frames":[],"objects":[],"output":[]}},{"line":49,"kind":"line","scope":"<module>","before":{"vars":{"names":["정문","도서관","학생회관"]},"frames":[],"objects":[],"output":[]},"state":{"vars":{"names":["정문","도서관","학생회관"],"target":"도서관"},"frames":[],"objects":[],"output":[]}},{"line":50,"kind":"line","scope":"<module>","before":{"vars":{"names":["정문","도서관","학생회관"],"target":"도서관"},"frames":[],"objects":[],"output":[]},"state":{"vars":{"names":["정문","도서관","학생회관"],"target":"도서관","name":"카페"},"frames":[],"objects":[],"output":[]}},{"line":11,"kind":"call","scope":"make_route","before":{"vars":{"names":["정문","도서관","학생회관"],"target":"도서관","name":"카페"},"frames":[],"objects":[],"output":[]},"state":{"vars":{"names":["정문","도서관","학생회관"],"target":"도서관","name":"카페"},"frames":[{"id":1,"name":"make_route","vars":{"names":["정문","도서관","학생회관"]}} ","show":0,"source":5},{"id":7,"text":"        self.data = data","show":0,"source":6},{"id":8,"text":"        self.next = None","show":0,"source":7},{"id":9,"text":"","show":0,"source":8},{"id":10,"text":"","show":0,"source":9},{"id":11,"text":"# 입력 목록으로 초기 경로를 만듭니다.","show":0,"source":10},{"id":12,"text":"def make_route(names):","show":0,"source":11},{"id":13,"text":"    head = None","show":0,"source":12},{"id":14,"text":"    tail = None","show":0,"source":13},{"id":15,"text":"    for name in names:","show":0,"source":14},{"id":16,"text":"        node = Node(name)","show":0,"source":15},{"id":17,"text":"        if head is None:","show":0,"source":16},{"id":18,"text":"            head = node","show":0,"source":17},{"id":19,"text":"        else:","show":0,"source":18},{"id":20,"text":"            tail.next = node","show":0,"source":19},{"id":21,"text":"        tail = node","show":0,"source":20},{"id":22,"text":"    return head","show":0,"source":21},{"id":23,"text":"","show":0,"source":22},{"id":24,"text":"","show":0,"source":23},{"id":25,"text":"def insert_after(head, target, name):","show":0,"source":24},{"id":26,"text":"    # 기준 방문지를 찾아 바로 뒤에 새 노드를 연결하고 성공 여부를 반환하세요.","show":0,"until":2},{"id":27,"text":"    pass","show":0,"until":2},{"id":28,"text":"    # Sol: 다음 노드를 따라 기준 방문지를 찾습니다.","show":2,"source":25},{"id":29,"text":"    current = head","show":3,"source":26},{"id":30,"text":"    while current is not None:","show":4,"source":27},{"id":31,"text":"        if current.data == target:","show":5,"source":28},{"id":32,"text":"            # Sol: 기존 다음 노드를 보존한 뒤 새 노드를 연결합니다.","show":6,"source":29},{"id":33,"text":"            new_node = Node(name)","show":7,"source":30},{"id":34,"text":"            new_node.next = current.next","show":8,"source":31},{"id":35,"text":"            current.next = new_node","show":9,"source":32},{"id":36,"text":"            return True","show":10,"source":33},{"id":37,"text":"        current = current.next","show":11,"source":34},{"id":38,"text":"    return False","show":12,"source":35},{"id":39,"text":"","show":0,"source":36},{"id":40,"text":"","show":0,"source":37},{"id":41,"text":"def route_names(head):","show":0,"source":38},{"id":42,"text":"    # 첫 노드부터 방문지 이름을 순서대로 모아 반환하세요.","show":0,"until":13},{"id":43,"text":"    pass","show":0,"until":13},{"id":44,"text":"    # Sol: None에 도달할 때까지 노드를 따라 이름을 모읍니다.","show":13,"source":39},{"id":45,"text":"    result = []","show":14,"source":40},{"id":46,"text":"    current = head","show":15,"source":41},{"id":47,"text":"    while current is not None:","show":16,"source":42},{"id":48,"text":"        result.append(current.data)","show":17,"source":43},{"id":49,"text":"        current = current.next","show":18,"source":44},{"id":50,"text":"    return result","show":19,"source":45},{"id":51,"text":"","show":0,"source":46},{"id":52,"text":"","show":0,"source":47},{"id":53,"text":"names = input(\"초기 방문지(공백 구분): \").split()","show":0,"source":48},{"id":54,"text":"target = input(\"기준 방문지: \")","show":0,"source":49},{"id":55,"text":"name = input(\"새 방문지: \")","show":0,"source":50},{"id":56,"text":"head = make_route(names)","show":0,"source":51},{"id":57,"text":"","show":0,"source":52},{"id":58,"text":"# 두 함수의 반환값으로 결과를 출력합니다.","show":0,"source":53},{"id":59,"text":"inserted = insert_after(head, target, name)","show":0,"source":54},{"id":60,"text":"if not inserted:","show":0,"source":55},{"id":61,"text":"    print(\"삽입할 위치가 없습니다.\")","show":0,"source":56},{"id":62,"text":"result = route_names(head)","show":0,"source":57},{"id":63,"text":"if result:","show":0,"source":58},{"id":64,"text":"    print(\" -> \".join(result))","show":0,"source":59},{"id":65,"text":"else:","show":0,"source":60},{"id":66,"text":"    print(\"경로가 비어 있습니다.\")","show":0,"source":61}],"steps":[{"row":2,"source":1,"kind":"write","context":"구현할 코드"},{"row":28,"source":25,"kind":"write","context":"구현할 코드"},{"row":29,"source":26,"kind":"write","context":"구현할 코드"},{"row":30,"source":27,"kind":"write","context":"구현할 코드"},{"row":31,"source":28,"kind":"write","context":"구현할 코드"},{"row":32,"source":29,"kind":"write","context":"구현할 코드"},{"row":33,"source":30,"kind":"write","context":"구현할 코드"},{"row":34,"source":31,"kind":"write","context":"구현할 코드"},{"row":35,"source":32,"kind":"write","context":"구현할 코드"},{"row":36,"source":33,"kind":"write","context":"구현할 코드"},{"row":37,"source":34,"kind":"write","context":"구현할 코드"},{"row":38,"source":35,"kind":"write","context":"구현할 코드"},{"row":44,"source":39,"kind":"write","context":"구현할 코드"},{"row":45,"source":40,"kind":"write","context":"구현할 코드"},{"row":46,"source":41,"kind":"write","context":"구현할 코드"},{"row":47,"source":42,"kind":"write","context":"구현할 코드"},{"row":48,"source":43,"kind":"write","context":"구현할 코드"},{"row":49,"source":44,"kind":"write","context":"구현할 코드"},{"row":50,"source":45,"kind":"write","context":"구현할 코드"}],"final":"### Solution ###\n\n# 방문지 하나와 다음 방문지의 참조를 저장합니다.\nclass Node:\n    def __init__(self, data):\n        self.data = data\n        self.next = None\n\n\n# 입력 목록으로 초기 경로를 만듭니다.\ndef make_route(names):\n    head = None\n    tail = None\n    for name in names:\n        node = Node(name)\n        if head is None:\n            head = node\n        else:\n            tail.next = node\n        tail = node\n    return head\n\n\ndef insert_after(head, target, name):\n    # Sol: 다음 노드를 따라 기준 방문지를 찾습니다.\n    current = head\n    while current is not None:\n        if current.data == target:\n            # Sol: 기존 다음 노드를 보존한 뒤 새 노드를 연결합니다.\n            new_node = Node(name)\n            new_node.next = current.next\n            current.next = new_node\n            return True\n        current = current.next\n    return False\n\n\ndef route_names(head):\n    # Sol: None에 도달할 때까지 노드를 따라 이름을 모읍니다.\n    result = []\n    current = head\n    while current is not None:\n        result.append(current.data)\n        current = current.next\n    return result\n\n\nnames = input(\"초기 방문지(공백 구분): \").split()\ntarget = input(\"기준 방문지: \")\nname = input(\"새 방문지: \")\nhead = make_route(names)\n\n# 두 함수의 반환값으로 결과를 출력합니다.\ninserted = insert_after(head, target, name)\nif not inserted:\n    print(\"삽입할 위치가 없습니다.\")\nresult = route_names(head)\nif result:\n    print(\" -> \".join(result))\nelse:\n    print(\"경로가 비어 있습니다.\")"}},{"id":"extra1","title":"인쇄 처리 되돌리기","tag":"추가문제 1","problemNumber":5,"statement":"**문제 상황**\n\n도서관 인쇄 관리 프로그램에 처리 되돌리기 기능을 추가합니다.\n문서는 접수 순서대로 처리하지만, 되돌릴 때는 **가장 최근에 처리한 문서부터** 복구합니다.\n이 문제의 되돌리기는 이미 나온 종이를 회수하는 작업이 아니라, 문서를 다시 처리할 대상으로 등록하는 동작입니다.\n\n**처리 규칙**\n\n- 대기열과 처리 이력은 처음에 모두 비어 있습니다.\n- 접수한 문서는 대기열 맨 뒤에 넣습니다.\n- 처리할 때는 대기열 맨 앞 문서를 꺼내 처리 이력에 기록합니다.\n- 되돌릴 때는 처리 이력의 마지막 문서를 제거해 대기열 맨 앞에 넣습니다.\n- 연속으로 되돌리면 최근 처리의 역순으로 복구됩니다. 복구한 문서를 다시 처리하면 새 처리 이력이 됩니다.\n- 빈 대기열의 처리와 빈 이력의 되돌리기는 실패이며, 대기열과 이력을 모두 그대로 유지합니다.\n\n**입출력 형식**\n\n- **입력:** 첫 줄에 명령 수, 다음 줄부터 명령을 한 줄씩 입력합니다.\n- `접수 문서명`: 접수만 하고 출력하지 않습니다.\n- `처리`: 성공하면 `처리: 문서명`, 대기열이 비어 있으면 `대기 문서가 없습니다.`를 출력합니다.\n- `되돌리기`: 성공하면 `복구: 문서명`, 처리 이력이 비어 있으면 `되돌릴 문서가 없습니다.`를 출력합니다.\n- `확인`: 대기열 맨 앞을 제거하지 않고 `다음 문서: 문서명`을 출력합니다. 비어 있으면 `대기 문서가 없습니다.`를 출력합니다.\n- **조건:** 명령 수는 1 이상 100 이하이며 명령 형식은 항상 올바릅니다. 문서명은 공백 없는 비어 있지 않은 문자열입니다. 같은 이름도 별개의 문서로 처리합니다.\n\n**작성 안내**\n\n**대기열 `queue`, 처리 이력 `history` 생성과 각 분기의 처리 및 출력**을 작성하세요.\n`queue`는 `deque`, `history`는 리스트로 만들고, 이동하는 문서는 `document`에 저장합니다.\n도전문제 1의 리스트 기반 스택 연산, 도전문제 2의 선입선출 규칙, 도전문제 3의 `deque` 연산을 조합합니다.\n스택과 큐 클래스를 다시 만들 필요는 없습니다. 다른 문제 셀의 변수나 클래스에 의존하지 않습니다.\n\n**입력 예시**\n```\n6\n접수 보고서\n접수 신청서\n처리\n되돌리기\n확인\n처리\n```\n\n**출력 예시**\n```\n명령 수: 6\n명령: 접수 보고서\n명령: 접수 신청서\n명령: 처리\n처리: 보고서\n명령: 되돌리기\n복구: 보고서\n명령: 확인\n다음 문서: 보고서\n명령: 처리\n처리: 보고서\n```\n","skeleton":"# To Do\nfrom collections import deque\n\n# 빈 대기열 queue와 빈 처리 이력 history를 만드세요.\n\n\ncount = int(input(\"명령 수: \"))\nfor i in range(count):\n    parts = input(\"명령: \").split()\n    command = parts[0]\n    if command == \"접수\":\n        # 새 문서를 대기열에 추가하세요.\n        pass\n    elif command == \"처리\":\n        # 대기 문서를 처리하고 성공한 문서만 이력에 기록하세요.\n        pass\n    elif command == \"되돌리기\":\n        # 가장 최근 처리 문서를 대기열로 복구하거나 빈 이력을 안내하세요.\n        pass\n    elif command == \"확인\":\n        # 다음 처리 문서를 제거하지 않고 확인하세요.\n        pass\n","code":"### Solution ###\nfrom collections import deque\n\n# Sol: 대기열은 큐로, 처리 이력은 스택으로 관리합니다.\nqueue = deque()\nhistory = []\n\ncount = int(input(\"명령 수: \"))\nfor i in range(count):\n    parts = input(\"명령: \").split()\n    command = parts[0]\n    if command == \"접수\":\n        # Sol: 새 문서를 대기열의 맨 뒤에 넣습니다.\n        queue.append(parts[1])\n    elif command == \"처리\":\n        # Sol: 먼저 접수된 문서를 꺼내 처리 이력에 쌓습니다.\n        if queue:\n            document = queue.popleft()\n            history.append(document)\n            print(f\"처리: {document}\")\n        else:\n            print(\"대기 문서가 없습니다.\")\n    elif command == \"되돌리기\":\n        # Sol: 가장 최근 처리 문서를 이력에서 꺼내 대기열 맨 앞에 복구합니다.\n        if history:\n            document = history.pop()\n            queue.appendleft(document)\n            print(f\"복구: {document}\")\n        else:\n            print(\"되돌릴 문서가 없습니다.\")\n    elif command == \"확인\":\n        # Sol: 대기열을 바꾸지 않고 다음 문서를 보여 줍니다.\n        if queue:\n            print(f\"다음 문서: {queue[0]}\")\n        else:\n            print(\"대기 문서가 없습니다.\")\n","image":"assets/illustrations/a02f8b69efbb719bbc6d.webp","imageAlt":"대기 문서와 처리된 문서를 확인하는 인쇄 담당자","inputSpec":"명령 수를 입력한 뒤, 명령을 한 줄씩 입력","outputSpec":"처리, 복구, 조회 결과. 실패 시 해당 안내 문구.","cases":[{"label":"처리 후 복구","input":["6","접수 보고서","접수 신청서","처리","되돌리기","확인","처리"],"expected":"처리: 보고서\n복구: 보고서\n다음 문서: 보고서\n처리: 보고서","fullOutput":"명령 수: 6\n명령: 접수 보고서\n명령: 접수 신청서\n명령: 처리\n처리: 보고서\n명령: 되돌리기\n복구: 보고서\n명령: 확인\n다음 문서: 보고서\n명령: 처리\n처리: 보고서","trace":[{"line":5,"kind":"line","scope":"<module>","before":{"vars":{},"frames":[],"objects":[],"output":[]},"state":{"vars":{"queue":[]},"frames":[],"objects":[],"output":[]}},{"line":6,"kind":"line","scope":"<module>","before":{"vars":{"queue":[]},"frames":[],"objects":[],"output": ry = []\n\ncount = int(input(\"명령 수: \"))\nfor i in range(count):\n    parts = input(\"명령: \").split()\n    command = parts[0]\n    if command == \"접수\":\n        # Sol: 새 문서를 대기열의 맨 뒤에 넣습니다.\n        queue.append(parts[1])\n    elif command == \"처리\":\n        # Sol: 먼저 접수된 문서를 꺼내 처리 이력에 쌓습니다.\n        if queue:\n            document = queue.popleft()\n            history.append(document)\n            print(f\"처리: {document}\")\n        else:\n            print(\"대기 문서가 없습니다.\")\n    elif command == \"되돌리기\":\n        # Sol: 가장 최근 처리 문서를 이력에서 꺼내 대기열 맨 앞에 복구합니다.\n        if history:\n            document = history.pop()\n            queue.appendleft(document)\n            print(f\"복구: {document}\")\n        else:\n            print(\"되돌릴 문서가 없습니다.\")\n    elif command == \"확인\":\n        # Sol: 대기열을 바꾸지 않고 다음 문서를 보여 줍니다.\n        if queue:\n            print(f\"다음 문서: {queue[0]}\")\n        else:\n            print(\"대기 문서가 없습니다.\")"}}]</script>
<script>
'use strict';
const lessons = JSON.parse(document.getElementById('lesson-data').textContent);
const $ = id => document.getElementById(id);
const escapeHTML = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
let typing = null;
const ui = {lesson:0,phase:'problem',buildIndex:0,traceIndex:-1,caseIndex:0,toastTimer:null,modalFocus:null};
const lesson = () => lessons[ui.lesson];
const testCase = () => lesson().cases[ui.caseIndex];
const buildStep = () => lesson().build.steps[ui.buildIndex-1] || null;
const traceStep = () => testCase().trace[ui.traceIndex] || null;
const emptyState = () => ({objects:[],frames:[],vars:{},output:[]});
const same = (a,b) => JSON.stringify(a) === JSON.stringify(b);
const pyValue = value => value && typeof value==='object' && 'ref' in value ? `객체 #${Number(value.ref)}` : value===true ? 'True' : value===false ? 'False' : value===null ? 'None' : typeof value==='string' ? `"${value}"` : Array.isArray(value) ? `[${value.map(pyValue).join(', ')}]` : String(value);
const currentRows = () => {
 const index = ui.phase==='run' ? lesson().build.steps.length : ui.buildIndex;
 return lesson().build.rows.filter(row=>row.show<=index && (row.until===undefined || index<row.until));
};
const currentCode = () => currentRows().map(row=>row.text).join('\n');

function highlight(code){
 const token=/(#[^\n]*|f?"(?:\\.|[^"\\])*"|f?'(?:\\.|[^'\\])*'|\b(?:class|def|return|if|elif|else|for|while|in|is|and|or|not|from|import|True|False|None|pass)\b|\bself\b|\b(?:print|input|int|list|map|len|range|deque)\b|\b\d+\b)/g;
 let html='',last=0;
 for(const match of code.matchAll(token)){
  html+=escapeHTML(code.slice(last,match.index));const value=match[0];
  const type=value.startsWith('#')?'comment':/^(f?["'])/.test(value)?'str':/^\d/.test(value)?'num':value==='self'?'self':/^(print|input|int|list|map|len|range|deque)$/.test(value)?'fn':'kw';
  html+=`<span class="${type}">${escapeHTML(value)}</span>`;last=match.index+value.length;
 }
 return html+escapeHTML(code.slice(last));
}


function introPicture(){return "";}

function renderLesson(){
 const l=lesson();
 $('lesson-title').textContent=l.title;
 $('lesson-badge').textContent=ui.lesson===4?'추가':String(ui.lesson+1).padStart(2,'0');

function revealExplanation(lineNumber){
 const code=lesson().code.split('\n')[lineNumber-1].trim();
 if(!code)return ['코드 구역을 구분합니다','빈 줄로 역할이 다른 구역을 나눕니다.'];
 if(code.startsWith('# Sol:'))return ['이 구역에서 구현할 역할',code.replace('# Sol:','').trim()];
 if(code.startsWith('#'))return ['코드의 역할을 확인합니다',code.replace(/^#+/,'').trim()];
 if(code.startsWith('from '))return ['deque를 불러옵니다','표준 라이브러리 collections에서 양쪽 끝 연산을 지원하는 deque를 가져옵니다.'];
 if(code.startsWith('class '))return ['클래스의 구조를 정의합니다','객체마다 데이터를 저장하고, 정해진 메서드로 그 데이터를 다룹니다.'];
 if(code.startsWith('def '))return ['함수 또는 메서드를 정의합니다','본문은 호출할 때 실행됩니다. 입력과 반환값의 약속을 확인하세요.'];
 if(code.includes('input('))return ['입력을 읽습니다',code.includes('int(')?'명령 수를 정수로 바꿉니다.':code.includes('split()')?'입력 문자열을 공백으로 나눠 각 항목을 저장합니다.':'방문지 이름을 문자열로 저장합니다.'];
 if(code==='stack.push(parts[1])')return ['스택에 작업을 추가합니다','push()를 호출해 parts[1]의 작업을 저장합니다. 추가 명령은 결과를 출력하지 않습니다.'];
 if(code==='item = stack.pop()')return ['최근 작업을 꺼냅니다','pop()을 호출해 최근 작업을 제거하고 반환값을 item에 저장합니다. 빈 스택이면 None을 반환하며, 아래 출력 코드가 이 경우를 구분합니다.'];
 if(code==='item = stack.peek()')return ['최근 작업을 확인합니다','peek()을 호출해 최근 작업을 제거하지 않고 item에 저장합니다. 빈 스택이면 None을 반환합니다.'];
 if(code==='queue.enqueue(parts[1])')return ['큐에 문서를 접수합니다','enqueue()를 호출해 parts[1]의 문서를 대기열 맨 뒤에 저장합니다. 접수 명령은 결과를 출력하지 않습니다.'];
 if(code==='document = queue.dequeue()')return ['먼저 접수한 문서를 꺼냅니다','dequeue()를 호출해 맨 앞 문서를 제거하고 반환값을 document에 저장합니다. 빈 큐이면 None을 반환하며, 아래 출력 코드가 이 경우를 구분합니다.'];
 if(code==='document = queue.peek()')return ['다음 문서를 확인합니다','peek()을 호출해 맨 앞 문서를 제거하지 않고 document에 저장합니다. 빈 큐이면 None을 반환합니다.'];
 if(code==='new_node.next = current.next')return ['원래 다음 노드를 보존합니다','새 노드의 next가 기존 다음 노드를 가리키게 합니다. 아직 기준 노드의 연결은 바꾸지 않았습니다.'];
 if(code==='current.next = new_node')return ['기준 노드 뒤에 연결합니다','기준 노드가 새 노드를 가리킵니다. 새 노드를 거쳐 기존 다음 노드로 이어집니다.'];
 if(code==='current = current.next')return ['다음 노드로 이동합니다','current가 가리키는 대상을 바꿉니다. 노드들의 연결 자체는 유지됩니다.'];
 if(code.includes('appendleft('))return ['왼쪽 끝에 추가합니다','새 원소가 맨 앞이 됩니다. 이미 있던 원소들의 상대적인 순서는 유지됩니다.'];
 if(code.includes('popleft('))return ['왼쪽 끝에서 꺼냅니다','맨 앞 원소를 제거하고 반환합니다. 큐에서는 가장 먼저 들어온 문서입니다.'];
 if(code.includes('.append('))return ['오른쪽 끝에 추가합니다','리스트 또는 덱의 마지막에 원소를 넣습니다. 스택에서는 이 위치가 맨 위입니다.'];
 if(code.includes('.pop(0)'))return ['맨 앞 항목을 꺼냅니다','리스트의 인덱스 0에 있는 문서를 제거하고 반환합니다. 남은 원소들이 앞으로 이동하며 접수 순서를 유지합니다.'];
 if(code.includes('.pop('))return ['오른쪽 끝 항목을 꺼냅니다','리스트나 덱의 오른쪽 끝 원소를 제거하고 반환합니다. 스택에서는 가장 최근 항목이지만, 양쪽으로 추가하는 덱에서는 추가 시점과 다를 수 있습니다.'];
 if(code.includes('[-1]'))return ['맨 위를 조회합니다','마지막 원소를 읽기만 합니다. 자료구조 안의 원소 수는 바뀌지 않습니다.'];
 if(code.startsWith('return '))return ['호출한 곳으로 값을 반환합니다','함수의 결과를 전달합니다. return은 결과를 화면에 출력하지 않습니다.'];
 if(code.startsWith('while '))return ['확인할 노드가 남아 있는지 판단합니다','None이면 끝입니다. 노드가 있으면 그 노드의 데이터를 확인합니다.'];
 if(code.startsWith('for '))return ['입력된 순서대로 반복합니다','명령 또는 방문지를 하나씩 처리하고, 같은 자료구조의 상태를 이어 갑니다.'];
 if(code.startsWith('if ')||code.startsWith('elif '))return ['조건에 따라 실행할 부분을 고릅니다','명령 종류 또는 자료구조의 빈 상태에 따라 이어지는 코드가 달라집니다.'];
 if(code==='else:')return ['앞 조건을 만족하지 않은 경우입니다','빈 상태나 다른 경우의 동작을 확인합니다.'];
 if(code.includes('queue[0]'))return ['맨 앞 문서를 조회합니다','원소를 제거하지 않으므로 여러 번 조회해도 같은 문서가 나옵니다.'];
 if(code.startsWith('print('))return ['결과를 출력합니다','문제에서 정한 문구와 공백을 그대로 사용합니다.'];
 if(code.includes('= deque()')||code==='history = []'||code==='self.items = []'||code==='self.queue = []')return ['빈 저장 공간을 준비합니다','명령을 처리하는 동안 이 자료구조의 상태를 계속 유지합니다.'];
 return ['값과 참조를 저장합니다','현재 줄을 실행한 뒤 변수와 자료구조가 어떻게 바뀌는지 확인하세요.'];
}
function buildExplanation(){
 const step=buildStep();
 if(!step&&['chal1','chal2'].includes(lesson().id))return ['메서드 본문과 호출을 작성합니다','클래스와 메서드 선언, 입력과 출력 코드는 준비되어 있습니다. 메서드 본문과 명령별 메서드 호출을 pass 자리에 작성합니다.'];
 return step?revealExplanation(step.source):['학생용 코드에서 시작합니다','제공된 코드와 주석에서 시작해 구현할 부분을 한 줄씩 채웁니다. 이 작성 순서와 다음 화면의 실제 실행 순서를 구분하세요.'];
}
function traceExplanation(step){
 if(step.kind==='call')return ['함수 또는 메서드를 호출합니다',`${step.scope}()에 인수가 전달되었습니다. 현재 호출의 매개변수와 객체 참조를 확인하세요.`];
 if(step.kind==='return')return ['호출한 곳으로 돌아갑니다',`반환값은 ${pyValue(step.value)}입니다. 다음 단계에서 호출부의 대입이나 출력을 이어갑니다.`];
 if(step.state.output.length>step.before.output.length)return ['결과가 출력되었습니다',step.state.output.at(-1)];
 const code=lesson().code.split('\n')[step.line-1].trim();
 if(/^(if|elif|while) /.test(code))return ['조건을 확인합니다','다음 실행에서 실제 선택된 분기를 따라갑니다. 빈 상태에서는 꺼내거나 조회하지 않습니다.'];
 return revealExplanation(step.line);
}

function keepCodeLineVisible(line){
 const container=$('code-scroll');
 if(!line?.isConnected||!container.contains(line))return;
 const top=line.offsetTop,bottom=top+line.offsetHeight;
 if(top<container.scrollTop+16||bottom>container.scrollTop+container.clientHeight-16)container.scrollTop=Math.max(0,top-Math.min(container.clientHeight*.27,70));
}

function finishTyping(){
 if(!typing)return;
 const animation=typing;typing=null;
 cancelAnimationFrame(animation.frame);
 animation.text.innerHTML=highlight(animation.fullText);
 animation.text.classList.remove('typing');
 animation.text.style.minHeight='';
 $('code-scroll').setAttribute('aria-busy','false');
 keepCodeLineVisible(animation.line);
}

function typeCodeLine(line,fullText){
 if(!line||window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const text=line.querySelector('.line-text');
 const indent=fullText.match(/^\s*/)[0],characters=Array.from(fullText.slice(indent.length));
 if(!characters.length)return;
 // Reserve the wrapped line's height so following code stays in place.
 text.style.minHeight=text.getBoundingClientRect().height+'px';
 text.innerHTML=highlight(indent);text.classList.add('typing');
 $('code-scroll').setAttribute('aria-busy','true');
 const animation={line,text,fullText,frame:0,count:0,started:performance.now()};
 typing=animation;
 const duration=Math.min(1100,Math.max(250,characters.length*18));
 function tick(now){
  if(typing!==animation)return;
  const count=Math.min(characters.length,Math.floor((now-animation.started)/duration*characters.length)+1);
  if(count!==animation.count){
   animation.count=count;text.innerHTML=highlight(indent+characters.slice(0,count).join(''));
   keepCodeLineVisible(line);
  }
  if(count===characters.length)finishTyping();
  else animation.frame=requestAnimationFrame(tick);
 }
 animation.frame=requestAnimationFrame(tick);
}

function renderCode(resetScroll=false,animateLine=false){
 const rows=currentRows(),running=ui.phase==='run';
 const step=running?traceStep():buildStep();
 const target=running?rows.find(row=>row.source===step?.line)?.id:step?.row;
 $('code-scroll').innerHTML=rows.map(row=>`<div class="code-line ${!row.text.trim()?'blank':''} ${row.id===target?'active':''}" id="code-row-${row.id}" data-source="${row.source||''}" ${row.id===target?'aria-current="step"':''}><span class="line-text">${highlight(row.text)}</span></div>`).join('');
 $('code-context').textContent=running?step?.state.frames.at(-1)?.name?step.state.frames.at(-1).name+'()':'완성 코드':step?.context||'Python';
 const explanation=running?(step?traceExplanation(step):['완성한 코드가 움직이는 순서','함수 정의가 준비되어 있습니다. 다음 버튼으로 입력부터 자료구조의 상태 변화를 따라갑니다.']):buildExplanation();
 $('explanation').hidden=!explanation;
 $('explanation-title').textContent=explanation?.[0]||'';$('explanation-body').textContent=explanation?.[1]||'';
 formatSentences($('explanation'));
 if(resetScroll||!target)$('code-scroll').scrollTop=0;
 if(target){
  const line=$('code-row-'+target);
  if(animateLine&&!running&&step?.kind==='write'&&rows.find(row=>row.id===target).text.trim())typeCodeLine(line,rows.find(row=>row.id===target).text);
  requestAnimationFrame(()=>keepCodeLineVisible(line));
 }
}

function render(resetScroll=false,animateLine=false){
 finishTyping();
 const problem=ui.phase==='problem',running=ui.phase==='run';
 $('problem-screen').hidden=!problem;$('work-screen').hidden=problem;
 $('io-panel').hidden=running;$('runtime').hidden=!running;

function objectMarkup(){return '';}
function calculationMarkup(){return '';}
function renderRuntime(resetScroll=false){
 const step=traceStep(),state=step?.state||emptyState(),before=step?.before||emptyState(),scroll=$('memory').scrollTop;
 const variableRows=(values,previous={})=>Object.entries(values).map(([key,value])=>`<div class="variable ${!same(value,previous[key])?'changed':''}"><span>${escapeHTML(key)}</span><span class="variable-value">${key in previous&&!same(value,previous[key])?`<span class="previous-value">${escapeHTML(pyValue(previous[key]))}</span> → `:''}${escapeHTML(pyValue(value))}</span></div>`).join('');
 const objectList=state.objects||[],oldObjects=before.objects||[];
 let content='';
 const strip=(name,items,oldItems,left,right)=>{
  if(!Array.isArray(items))return '';
  const changed=oldItems!==undefined&&!same(items,oldItems);
  return `<section class="structure ${changed?'changed':''}"><h3>${escapeHTML(name)}</h3><p>${left}　｜　${right}</p><div class="structure-items">${items.length?items.map((item,index)=>`<span class="structure-item">${escapeHTML(pyValue(item))}<small>인덱스 ${index}</small></span>`).join('<span class="structure-arrow">—</span>'):'<span class="structure-item">비어 있음</span>'}</div>${changed?`<div class="structure-prior">이전 ${escapeHTML(pyValue(oldItems))} → 현재 ${escapeHTML(pyValue(items))}</div>`:''}</section>`;
 };
 if(!step)content='<div class="empty-state"><div class="empty-mark">[ ]</div><p>아직 실행 전입니다.<br>명령에 따른 자료구조의 변화를 확인해 봅시다.</p></div>';
 else{
  for(const object of objectList.filter(o=>o.type==='Stack')){
   content+=strip(`스택 #${object.id}`,object.attrs.items,oldObjects.find(o=>o.id===object.id)?.attrs.items,'왼쪽: 바닥','오른쪽: 맨 위 (top)');
  }
  for(const object of objectList.filter(o=>o.type==='Queue')){
   content+=strip(`인쇄 대기열 / Queue #${object.id}`,object.attrs.queue,oldObjects.find(o=>o.id===object.id)?.attrs.queue,'왼쪽: 앞 (dequeue)','오른쪽: 뒤 (enqueue)');
  }
  content+=strip('인쇄 대기열',state.vars.queue,before.vars.queue,'왼쪽: 앞 (꺼내기)','오른쪽: 뒤 (접수)');
  content+=strip('양쪽 물품 보관대',state.vars.shelf,before.vars.shelf,'왼쪽 끝','오른쪽 끝');
  content+=strip('처리 이력 스택',state.vars.history,before.vars.history,'왼쪽: 오래된 처리','오른쪽: 최근 처리 (top)');
  if(lesson().id==='chal4'){
   const frame=state.frames.at(-1),head=frame&&'head' in frame.vars?frame.vars.head:state.vars.head;
   content+=`<section class="structure"><h3>노드와 next 연결</h3><p>현재 head: ${head===undefined?'아직 없음':escapeHTML(pyValue(head))}. 객체 번호는 같은 노드를 구분하기 위한 교육용 표기입니다.</p><div class="structure-items">`;
   content+=objectList.filter(o=>o.type==='Node').map(node=>{
    const old=oldObjects.find(o=>o.id===node.id),changed=!same(node.attrs,old?.attrs);
    return `<span class="structure-item node-card ${changed?'changed':''}"><b>#${node.id} ${escapeHTML(node.attrs.data??'초기화 중')}</b><small>next → ${'next' in node.attrs?escapeHTML(pyValue(node.attrs.next)):'초기화 중'}</small>${old&&!same(node.attrs.next,old.attrs.next)?`<small>이전 next: ${escapeHTML(pyValue(old.attrs.next))}</small>`:''}</span>`;
   }).join('');
   content+='</div><p>각 카드의 next가 실제 연결 대상입니다. 카드의 배치 순서는 객체 생성 순서입니다.</p></section>';
  }
  if(step.kind==='return')content+=`<div class="return-message">${escapeHTML(step.scope)}() 반환<strong>${escapeHTML(pyValue(step.value))}</strong></div>`;
  content+='<div class="recursive-frames">'+state.frames.map((frame,index)=>{
   const active=index===state.frames.length-1,old=before.frames.find(f=>f.id===frame.id);
   return `<section class="recursive-frame ${active?'active':''}" data-call-id="${frame.id}"><div class="frame-heading"><strong>#${frame.id} ${escapeHTML(frame.name)}()</strong><span>${active?'현재 호출':'복귀 대기'}</span></div><div class="variables">${variableRows(frame.vars,old?.vars)}</div></section>`;
  }).join('')+'</div>';
  if(Object.keys(state.vars).length)content+=`<section class="global-variables"><h3>함수 밖의 변수</h3><div class="variables">${variableRows(state.vars,before.vars)}</div></section>`;
 }
 $('memory').innerHTML=content;$('memory').scrollTop=resetScroll?0:scroll;
 $('output-lines').innerHTML=state.output.length?state.output.map((line,index)=>`<div class="output-line ${index>=before.output.length?'new-output':''}">${escapeHTML(line)}</div>`).join(''):'<p class="output-placeholder">아직 출력이 없습니다.</p>';
 $('finished-label').hidden=ui.traceIndex!==testCase().trace.length-1;
 if(state.output.length>before.output.length)$('output-lines').scrollTop=$('output-lines').scrollHeight;
}

 let animateLine=false;
 if(ui.phase==='problem'){ui.phase='build';render(true);return}
 if(ui.phase==='build'){
  if(ui.buildIndex<lesson().build.steps.length){ui.buildIndex++;animateLine=true}
  else{ui.phase='run';ui.traceIndex=-1}
 }else if(ui.traceIndex<testCase().trace.length-1)ui.traceIndex++;
 else if(ui.lesson<lessons.length-1){changeLesson(ui.lesson+1);return}
 else{showWrapUp();return}
 render(false,animateLine);
}

function previous(){
 if(ui.phase==='problem'){if(ui.lesson>0)changeLesson(ui.lesson-1);return}
 if(ui.phase==='build'){
  if(ui.buildIndex>0)ui.buildIndex--;else ui.phase='problem';
 }else if(ui.traceIndex>=0)ui.traceIndex--;
 else{ui.phase='build';ui.buildIndex=lesson().build.steps.length}
 render();
}

function toast(text){
 clearTimeout(ui.toastTimer);$('toast').textContent=text;$('toast').hidden=false;
 ui.toastTimer=setTimeout(()=>$('toast').hidden=true,2300);
}

function openModal(title,html,imageMode=false){
 finishTyping();
 $('modal').classList.toggle('image-modal',imageMode);
 document.body.classList.toggle('image-popup-open',imageMode);
 if($('modal-backdrop').hidden)ui.modalFocus=document.activeElement;$('modal-title').textContent=title;$('modal-content').innerHTML=html;formatSentences($('modal-content'));
 $('modal-backdrop').hidden=false;$('close-modal').focus();
}
function closeModal(){
 if($('modal-backdrop').hidden)return;
 $('modal-backdrop').hidden=true;document.body.classList.remove('image-popup-open');ui.modalFocus?.focus();
}

function showPicture(){
 const l=lesson();
 if(!l.image)return;
 openModal(l.title,`<img class="expanded-image" src="${l.image}" alt="${escapeHTML(l.imageAlt)}">`,true);
 ui.modalFocus=$('scene').querySelector('.scene-trigger');
}

function showMenu(){
 openModal('5주차 실습: 선형 자료구조',`<div class="lesson-grid">${lessons.map((l,index)=>`<button class="lesson-choice ${index===ui.lesson?'active':''}" data-lesson="${index}"><span>${index===4?'추가':String(index+1).padStart(2,'0')}</span>${escapeHTML(l.title)}</button>`).join('')}</div><div class="menu-actions"><button id="reset-lesson">현재 문제 처음부터</button><button id="help-button">사용법과 단축키</button></div>`);
}

function showHelp(){
 openModal('수업 화면 사용법',`<p>문제 설명 → 코드 구현 → 코드 확인 순서로 진행합니다. 도입 복습 없이 도전문제 1부터 시작합니다.</p><p>코드 확인은 각 테스트 입력으로 실제 Python을 실행해 얻은 기록의 재생입니다. 브라우저에서 새 코드를 실행하는 기능은 아닙니다. 강조된 줄과 변수, 스택과 큐의 양 끝, 노드의 next 연결을 함께 보세요.</p><p>조건 줄 다음에는 실제로 선택된 분기로 이동합니다. 객체 #번호는 같은 객체를 구분하는 교육용 표기이며 메모리 주소가 아닙니다. 연결리스트 카드의 배치는 생성 순서이고, 실제 연결 대상은 각 카드의 next로 표시합니다.</p><p>기본 예제에는 입력 안내 문구와 입력값을 포함합니다. 코드 확인의 출력 영역에서는 input()의 안내 문구와 입력값을 생략합니다. 예제를 바꾸면 실행 기록이 처음으로 돌아가며 기본 예제 표시는 유지됩니다.</p><div class="shortcut"><span>다음 줄 / 다음 실행</span><span><kbd>→</kbd> 또는 <kbd>Space</kbd></span></div><div class="shortcut"><span>이전 단계</span><kbd>←</kbd></div><div class="shortcut"><span>이전 / 다음 문제</span><span><kbd>Page Up</kbd> / <kbd>Page Down</kbd></span></div><div class="shortcut"><span>문제로 바로 이동</span><span><kbd>1</kbd> ~ <kbd>5</kbd></span></div><div class="shortcut"><span>전체 화면 / 도움말 / 닫기</span><span><kbd>F</kbd> / <kbd>?</kbd> / <kbd>Esc</kbd></span></div><p>코드 복사 옆의 되돌리기 버튼은 현재 단계만 다시 시작합니다. 목차의 ‘현재 문제 처음부터’는 문제 설명과 기본 예제로 돌아갑니다.</p><p>현재 공개된 코드와 주석을 복사하며, 코드 확인에서는 완성 코드를 복사합니다. 그림과 글꼴은 HTML 안에 포함되어 인터넷 연결 없이 사용할 수 있습니다.</p>`);
}
function showWrapUp(){
 openModal('선형 자료구조를 설명할 수 있나요?',`<div class="recap"><div><h3>스택</h3><p>한쪽 끝에서 넣고 꺼냅니다. 최근 작업을 먼저 되돌립니다.</p></div><div><h3>큐</h3><p>뒤로 넣고 앞으로 꺼냅니다. 먼저 접수한 문서를 먼저 처리합니다.</p></div><div><h3>덱</h3><p>양쪽 끝에서 모두 넣고 꺼낼 수 있습니다.</p></div><div><h3>연결리스트</h3><p>노드는 다음 노드를 참조합니다. 삽입할 때 기존 연결을 보존합니다.</p></div></div><h3>함께 설명해 봅시다</h3><ul><li>확인 명령을 여러 번 실행해도 자료구조가 바뀌지 않는 이유는 무엇일까요?</li><li>연결리스트에 새 노드를 넣을 때 원래 다음 노드를 먼저 보존해야 하는 이유는 무엇일까요?</li><li>처리 이력은 스택, 인쇄 대기열은 큐로 관리하는 이유는 무엇일까요?</li></ul>`);
}

function formatSentences(root){
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
 const nodes=[];
 while(walker.nextNode()){
  const node=walker.currentNode,parent=node.parentElement;
  if(parent.closest('p,li,td,th')&&!parent.closest('pre,code,svg'))nodes.push(node);
 }
 for(const node of nodes){
  const lines=node.textContent.replace(/([.!?。！？]["'’”)\]]*)[ \t\r\n]+/g,'$1\n').split('\n');
  if(lines.length<2)continue;
  const fragment=document.createDocumentFragment();
  lines.forEach((line,index)=>{if(index)fragment.append(document.createElement('br'));fragment.append(document.createTextNode(line))});
  node.replaceWith(fragment);
 }
}

function markdown(source){
 const inline=value=>escapeHTML(value).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>');
 const lines=source.split('\n');
 let html='',paragraph=[];
 const flush=()=>{if(paragraph.length){html+=`<p>${inline(paragraph.join(' '))}</p>`;paragraph=[]}};
 for(let index=0;index<lines.length;index++){
  const line=lines[index].trim();
  if(!line){flush();continue}
  if(line.startsWith('```')){
   flush();const code=[];
   while(++index<lines.length&&!lines[index].startsWith('```'))code.push(lines[index]);
   html+=`<pre>${escapeHTML(code.join('\n'))}</pre>`;continue;
  }
  if(line.startsWith('|')){
   flush();const rows=[];
   while(index<lines.length&&lines[index].trim().startsWith('|')){
    const row=lines[index++].trim();
    if(!/^\|[\s:|\-]+\|$/.test(row))rows.push(row.split('|').slice(1,-1));
   }
   index--;
   html+='<table><thead><tr>'+rows[0].map(cell=>`<th scope="col">${inline(cell.trim())}</th>`).join('')+'</tr></thead><tbody>';
   html+=rows.slice(1).map(row=>'<tr>'+row.map(cell=>`<td>${inline(cell.trim())}</td>`).join('')+'</tr>').join('')+'</tbody></table>';continue;
  }
  if(/^\d+\. /.test(line)){
   flush();html+='<ol>';
   while(index<lines.length&&/^\d+\. /.test(lines[index].trim()))html+=`<li>${inline(lines[index++].trim().replace(/^\d+\. /,''))}</li>`;
   index--;html+='</ol>';continue;
  }
  if(line.startsWith('- ')){
   flush();html+='<ul>';
   while(index<lines.length&&lines[index].trim().startsWith('- '))html+=`<li>${inline(lines[index++].trim().slice(2))}</li>`;
   index--;html+='</ul>';continue;
  }
  if(/^#{1,3} /.test(line)||/^\*\*.+\*\*$/.test(line)){
   flush();html+=`<h3>${inline(line.replace(/^#+ /,''))}</h3>`;continue;
  }
  paragraph.push(line);
 }
 flush();return html;
}

async function copyCode(){
 finishTyping();
 const source=currentCode();let copied=false;
 if(navigator.clipboard?.writeText){try{await navigator.clipboard.writeText(source);copied=true}catch(error){/* A file URL may require the local fallback. */}}
 if(!copied){
  const area=document.createElement('textarea'),focused=document.activeElement;
  area.value=source;area.setAttribute('readonly','');area.style.cssText='position:fixed;left:-10000px;top:0';
  document.body.append(area);area.select();
  try{copied=document.execCommand('copy')}catch(error){copied=false}
  area.remove();focused?.focus();
 }
 if(copied)toast('화면의 코드와 주석을 복사했습니다.');
 else openModal('코드 직접 복사',`<p>코드를 선택한 뒤 Ctrl+C 또는 ⌘C를 눌러 주세요.</p><textarea aria-label="복사할 코드" readonly>${escapeHTML(source)}</textarea>`);
}

async function toggleFullscreen(){
 try{
  if(document.fullscreenElement){await document.exitFullscreen();return}
  if(document.documentElement.requestFullscreen){await document.documentElement.requestFullscreen();return}
 }catch(error){/* Fall back to a larger presentation area when fullscreen is unavailable. */}
 document.body.classList.toggle('focus-screen');
 toast(document.body.classList.contains('focus-screen')?'F 또는 Esc를 누르면 원래 화면으로 돌아갑니다.':'원래 화면으로 돌아왔습니다.');
}

$('next-button').addEventListener('click',next);
$('previous-button').addEventListener('click',previous);
$('copy-button').addEventListener('click',copyCode);
$('restart-button').addEventListener('click',restartPhase);
$('menu-button').addEventListener('click',showMenu);
$('scene').addEventListener('click',event=>{if(event.target.closest('.scene-trigger'))showPicture()});
$('fullscreen-button').addEventListener('click',toggleFullscreen);
$('close-modal').addEventListener('click',closeModal);
$('modal-backdrop').addEventListener('click',event=>{if(event.target===$('modal-backdrop'))closeModal()});
document.querySelectorAll('[data-phase]').forEach(button=>button.addEventListener('click',()=>setPhase(button.dataset.phase)));
$('case-select').addEventListener('change',event=>{ui.caseIndex=Number(event.target.value);ui.traceIndex=-1;renderIO();render(true)});
$('modal-content').addEventListener('click',event=>{
 const choice=event.target.closest('[data-lesson]');
 if(choice){closeModal();changeLesson(Number(choice.dataset.lesson))}
 if(event.target.closest('#reset-lesson')){closeModal();changeLesson(ui.lesson)}
 if(event.target.closest('#help-button'))showHelp();
});
document.addEventListener('fullscreenchange',()=>$('fullscreen-button').setAttribute('aria-label',document.fullscreenElement?'전체 화면 종료':'전체 화면'));
document.addEventListener('keydown',event=>{
 if(event.key==='Escape'){closeModal();document.body.classList.remove('focus-screen');return}
 if(!$('modal-backdrop').hidden){
  if(event.key==='Tab'){
   const focusable=[...$('modal').querySelectorAll('button,textarea,select,a[href],[tabindex="0"]')].filter(element=>!element.disabled&&!element.hidden);
   const first=focusable[0],last=focusable.at(-1);
   if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus()}
   else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus()}
  }
  return;
 }
 if(event.altKey||event.ctrlKey||event.metaKey||event.isComposing||event.repeat)return;
 if(event.target.closest('select,input,textarea,[contenteditable="true"]'))return;
 if(event.target.closest('button,a[href]')&&[' ','Enter'].includes(event.key))return;
 if(['ArrowRight',' '].includes(event.key)){event.preventDefault();next()}
 else if(event.key==='ArrowLeft'){event.preventDefault();previous()}
 else if(event.key==='PageDown'){event.preventDefault();changeLesson(ui.lesson+1)}
 else if(event.key==='PageUp'){event.preventDefault();changeLesson(ui.lesson-1)}
 else if(/^[1-5]$/.test(event.key)){event.preventDefault();changeLesson(Number(event.key)-1)}
 else if(event.key.toLowerCase()==='f'){event.preventDefault();toggleFullscreen()}
 else if(event.key==='?'){event.preventDefault();showHelp()}
});
renderLesson();

</script>
