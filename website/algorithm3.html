<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>크루스칼 케이블 시각화</title>
<style>
:root {
  color-scheme: light;
  --ink: #1b2634; --body: #3a4653; --muted: #68727d; --line: #dfe4e9; --soft: #f5f7f9;
  --accent: #d34816; --accent-soft: #fdf1ea; --cable: #3a546c; --check: #1f5fd1; --check-soft: #eaf1fd;
  --fade: #a0b4c4; --ok: #15803d;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: #fff; color: var(--ink); line-height: 1.5;
  font-family: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1720px; margin: 0 auto; padding: 16px 24px 24px; }
header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
header h1 { margin: 0; font-size: 26px; letter-spacing: -0.01em; }
.home { display: flex; padding: 5px; border-radius: 6px; }
.home:hover { background: #edf3ef; }
.home svg { width: 24px; height: 24px; }
.home:focus-visible { outline: 3px solid var(--check); outline-offset: 2px; }
.layout { display: grid; grid-template-columns: minmax(0, 1.75fr) minmax(360px, 1fr); gap: 20px; align-items: start; }
@media (max-width: 1040px) { .layout { grid-template-columns: minmax(0, 1fr); } }

/* map */
.map { margin: 0; border: 2px solid var(--ink); line-height: 0; background: #e6eef2; }
.map svg { display: block; width: 100%; height: auto; font-family: inherit; }
.under { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; margin: 10px 0 0; }
.pill { border: 1px solid var(--line); border-radius: 999px; padding: 4px 13px; font-size: 15px; color: var(--body); background: #fff; white-space: nowrap; }
.pill b { color: var(--ink); font-size: 17px; font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 0 0 0 auto; padding: 0; list-style: none; font-size: 14px; color: var(--muted); }
.legend li { display: flex; align-items: center; gap: 7px; white-space: nowrap; }
.legend svg { width: 34px; height: 12px; flex: none; }
.hint { margin: 8px 0 0; font-size: 14px; color: var(--muted); }
.linkbtn { border: 0; background: none; padding: 0; margin-left: 6px; font: inherit; color: var(--check); text-decoration: underline; cursor: pointer; }

/* what is happening now */
.now { margin-top: 12px; border: 1px solid var(--line); border-left: 6px solid var(--cable); border-radius: 10px; padding: 13px 18px 15px; min-height: 112px; }
.now[data-type="check"] { border-left-color: var(--check); }
.now[data-type="install"], .now[data-type="plants"] { border-left-color: var(--accent); }
.now[data-type="skip"] { border-left-color: var(--fade); }
.now[data-type="done"] { border-left-color: var(--ok); }
.badge { display: inline-block; font-size: 13px; font-weight: 700; letter-spacing: 0.04em; color: #fff; background: var(--cable); border-radius: 5px; padding: 2px 9px; }
.now[data-type="check"] .badge { background: var(--check); }
.now[data-type="install"] .badge, .now[data-type="plants"] .badge { background: var(--accent); }
.now[data-type="skip"] .badge { background: #7e8b97; }
.now[data-type="done"] .badge { background: var(--ok); }
.now h2 { margin: 8px 0 3px; font-size: 23px; }
.now p { margin: 0; font-size: 19px; color: var(--body); }

/* side panel */
.side { display: grid; gap: 12px; }
.card { border: 1px solid var(--line); border-radius: 10px; padding: 11px 16px 12px; }
.card h3 { margin: 0 0 7px; font-size: 15px; color: var(--muted); font-weight: 700; letter-spacing: 0.02em; }
.card h3 small { font-weight: 500; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button.ctl { font: inherit; font-size: 16px; font-weight: 600; color: var(--ink); background: #fff; border: 1.5px solid #c5ced6; border-radius: 8px; padding: 7px 15px; cursor: pointer; }
button.ctl:hover:not(:disabled) { border-color: var(--ink); }
button.ctl:disabled { color: #b3bcc5; border-color: var(--line); cursor: default; }
button.ctl.primary { background: var(--ink); border-color: var(--ink); color: #fff; min-width: 86px; }
button.ctl:focus-visible, .linkbtn:focus-visible, select:focus-visible, input:focus-visible, .island:focus-visible { outline: 3px solid var(--check); outline-offset: 2px; }
.controls label { margin-left: auto; font-size: 14px; color: var(--muted); }
select { font: inherit; font-size: 15px; padding: 5px 6px; border: 1.5px solid #c5ced6; border-radius: 8px; background: #fff; color: var(--ink); }
.scrub { display: flex; gap: 12px; align-items: center; margin-top: 11px; }
.scrub input { flex: 1; accent-color: var(--ink); }
.scrub span { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.keys { margin: 6px 0 0; font-size: 13px; color: var(--muted); }

.proc, .proc ol { margin: 0; padding-left: 22px; }
.proc li { font-size: 17px; color: var(--body); padding: 2px 6px; border-radius: 6px; }
.proc ol { list-style: none; padding-left: 4px; margin-top: 2px; }
.proc ol li::before { content: "- "; color: var(--muted); }
.proc li.on > span { background: #fff3c4; box-shadow: 0 0 0 4px #fff3c4; border-radius: 3px; color: var(--ink); font-weight: 700; }

.cable-list { list-style: none; margin: 0; padding: 0; columns: 2; column-gap: 12px; }
.cable-list li { display: flex; align-items: center; gap: 9px; padding: 2px 8px; margin-bottom: 3px; border-radius: 7px; font-size: 16px; break-inside: avoid; border: 1.5px solid transparent; font-variant-numeric: tabular-nums; }
.cable-list .cost { width: 30px; text-align: center; font-weight: 700; border: 1.5px solid #b0bdc9; border-radius: 6px; background: #fff; }
.cable-list .pair { font-weight: 600; }
.cable-list .st { margin-left: auto; font-size: 14px; color: var(--muted); }
.cable-list li[data-state="check"] { background: var(--check-soft); border-color: var(--check); }
.cable-list li[data-state="check"] .st { color: var(--check); font-weight: 700; }
.cable-list li[data-state="installed"] .cost { border-color: var(--accent); }
.cable-list li[data-state="installed"] .st { color: var(--accent); font-weight: 700; }
.cable-list li[data-state="skipped"] { color: #8b96a1; }
.cable-list li[data-state="skipped"] .pair { text-decoration: line-through; }
.cable-list li[data-state="skipped"] .cost { border-color: var(--line); color: #8b96a1; }

table.uf { border-collapse: separate; border-spacing: 4px; margin: 0 -4px; font-variant-numeric: tabular-nums; }
table.uf th { font-size: 14px; color: var(--muted); font-weight: 600; text-align: left; padding-right: 8px; white-space: nowrap; }
table.uf td { width: 38px; height: 34px; text-align: center; font-size: 17px; border-radius: 6px; border: 1.5px solid transparent; transition: background-color .4s; }
table.uf tr.idx td { height: 22px; font-size: 14px; color: var(--muted); }
table.uf td.root { font-weight: 800; text-decoration: underline; text-underline-offset: 3px; }
table.uf td.focus { border-color: var(--ink); }
table.uf td.changed { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.groups { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 15px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 11px 2px 8px; }
.chip i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
.chip em { font-style: normal; font-size: 13px; color: var(--accent); font-weight: 700; }
.uf-note { margin: 9px 0 0; font-size: 15px; color: var(--body); min-height: 22px; font-variant-numeric: tabular-nums; }

/* svg pieces */
.cable .casing { stroke: #fff; stroke-width: 11; opacity: 0; transition: opacity .3s; }
.cable .wire { stroke: var(--cable); stroke-width: 3; stroke-dasharray: 13 9; transition: stroke .45s, stroke-width .3s; }
.cable .dot { fill: var(--cable); transition: fill .45s; }
.cable .tag rect { fill: #fff; stroke: #b0bdc9; stroke-width: 1.5; transition: stroke .3s, fill .3s; }
.cable .tag text { fill: var(--ink); font-weight: 700; font-size: 26px; text-anchor: middle; dominant-baseline: central; transition: fill .3s; }
.cable[data-state="check"] .casing { opacity: .95; }
.cable[data-state="check"] .wire { stroke: var(--check); stroke-width: 5; animation: march .7s linear infinite; }
.cable[data-state="check"] .dot { fill: var(--check); }
.cable[data-state="check"] .tag rect { stroke: var(--check); stroke-width: 3.5; }
.cable[data-state="installed"] .casing { opacity: 1; }
.cable[data-state="installed"] .wire { stroke: var(--gc); stroke-width: 5.5; stroke-dasharray: none; }
.cable[data-state="installed"] .dot { fill: var(--gc); }
.cable[data-state="installed"] .tag rect { stroke: var(--gc); stroke-width: 2.8; }
.cable[data-state="skipped"] .wire { stroke: var(--fade); stroke-width: 2.5; }
.cable[data-state="skipped"] .dot { fill: var(--fade); }
.cable[data-state="skipped"] .tag rect { fill: #f3f6f8; stroke: #ced8e0; }
.cable[data-state="skipped"] .tag text { fill: #7e8b97; }
@keyframes march { to { stroke-dashoffset: -22; } }

.island { cursor: pointer; }
.island .ring { fill: #fff; }
.island .disc { transition: fill .5s; }
.island .num { fill: #fff; font-weight: 800; font-size: 30px; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.island .halo { fill: none; stroke: var(--ink); stroke-width: 3.5; opacity: 0; }
.island.focus .halo { opacity: 1; animation: pulse 1.1s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes pulse { 50% { transform: scale(1.14); opacity: .45; } }
.island .plant, .island .power { opacity: 0; transition: opacity .4s; pointer-events: none; }
.island.is-plant .plant, .island.is-powered .power { opacity: 1; }
.island .plant text { fill: var(--accent); font-weight: 800; font-size: 23px; stroke: #f6f0de; stroke-width: 7; paint-order: stroke; stroke-linejoin: round; dominant-baseline: central; }
.island .plant polygon { fill: var(--accent); stroke: #f6f0de; stroke-width: 3; paint-order: stroke; }
.island .power circle { fill: #f59e0b; stroke: #fff; stroke-width: 3; }
.island .power polygon { fill: #fff; }
@media (prefers-reduced-motion: reduce) {
  .cable[data-state="check"] .wire, .island.focus .halo { animation: none; }
  * { transition: none !important; }
}
</style>
</head>

<script>
"use strict";
const DATA = {"view":[36,184,1728,1000],"pos":{"0":[190.0,628.2],"1":[798.0,300.0],"2":[786.8,1020.0],"3":[1620.0,744.7],"4":[696.7,596.5],"5":[1079.5,797.6],"6":[910.6,522.3]},"edges":[[0,1,9],[0,2,10],[1,3,10],[1,4,5],[1,6,3],[2,3,9],[2,4,7],[2,5,2],[3,5,4],[3,6,8],[4,6,1],[5,6,6]],"seg":{"0-1":[[268.0,586.1],[726.1,338.8]],"0-2":[[259.6,673.9],[712.2,971.0]],"1-3":[[873.4,340.8],[1547.4,705.4]],"1-4":[[770.2,381.5],[722.7,520.4]],"1-6":[[832.0,367.1],[882.1,466.0]],"2-3":[[852.1,998.4],[1528.4,775.0]],"2-4":[[766.8,926.1],[712.6,671.3]],"2-5":[[848.7,972.9],[1011.2,849.5]],"3-5":[[1529.0,753.6],[1171.4,788.6]],"3-6":[[1542.0,720.2],[974.5,542.4]],"4-6":[[764.4,573.0],[850.0,543.3]],"5-6":[[1037.0,728.4],[946.4,580.6]]},"tag":{"0-1":[497.1,462.5],"0-2":[485.9,822.5],"1-3":[1210.4,523.1],"1-4":[746.4,450.9],"1-6":[857.1,416.5],"2-3":[1190.2,886.7],"2-4":[739.7,798.7],"2-5":[930.0,911.2],"3-5":[1350.2,771.1],"3-6":[1258.2,631.3],"4-6":[807.2,558.2],"5-6":[991.7,654.5]},"plants":[0,3]};
const N = Object.keys(DATA.pos).length;
const E = DATA.edges.length;
const PALETTE = ["#c2410c", "#1d4ed8", "#15803d", "#be185d", "#7e22ce", "#0e7490", "#a16207"];
const key = (u, v) => u + "-" + v;

/* ---------- algorithm: the same steps as the Solution code ---------- */
function buildRun(plants) {
  const parent = Array.from({ length: N }, (_, i) => i);
  const find = (u) => { if (parent[u] !== u) parent[u] = find(parent[u]); return parent[u]; };
  const status = {};
  DATA.edges.forEach(([u, v]) => { status[key(u, v)] = "wait"; });
  const installed = [];
  let total = 0;
  const steps = [];
  const snap = (extra) => steps.push(Object.assign({
    parent: parent.slice(), status: Object.assign({}, status), installed: installed.slice(),
    total: total, sorted: true, changed: [], focus: [], cells: [],
  }, extra));
  // sorted() in Python is stable, and so is Array.prototype.sort
  const sorted = DATA.edges.slice().sort((a, b) => a[2] - b[2]);

  snap({ type: "init", sorted: false });
  snap({ type: "sort" });

  const merged = [];
  for (const p of plants.slice(1)) {
    const ru = find(plants[0]), rv = find(p);
    if (ru !== rv) { parent[rv] = ru; merged.push(rv); }
  }
  snap({ type: "plants", changed: merged, focus: plants.slice(), cells: plants.slice() });

  sorted.forEach(([u, v, w], i) => {
    const k = key(u, v);
    const before = parent.slice();
    const ru = find(u), rv = find(v);
    const compressed = [];
    before.forEach((b, j) => { if (b !== parent[j]) compressed.push(j); });
    status[k] = "check";
    snap({ type: "check", cur: k, order: i + 1, u: u, v: v, w: w, ru: ru, rv: rv, before: before, changed: compressed, focus: [u, v], cells: [u, v] });
    if (ru !== rv) {
      const prev = total;
      parent[rv] = ru;
      installed.push(k);
      total += w;
      status[k] = "installed";
      snap({ type: "install", cur: k, order: i + 1, u: u, v: v, w: w, ru: ru, rv: rv, prev: prev, changed: [rv], focus: [u, v], cells: [u, v] });
    } else {
      status[k] = "skipped";
      snap({ type: "skip", cur: k, order: i + 1, u: u, v: v, w: w, ru: ru, rv: rv, focus: [u, v], cells: [u, v] });
    }
  });
  snap({ type: "done" });
  return { steps: steps, sorted: sorted, plants: plants.slice() };
}
const rootOf = (parent, i) => { while (parent[i] !== i) i = parent[i]; return i; };

function describe(s, run) {
  const names = run.plants.map((p) => p + "번").join(", ");
  const of = s.order + "/" + E;
  const name = "케이블 " + s.u + "-" + s.v;
  switch (s.type) {
    case "init":
      return ["시작", "섬마다 그룹이 하나씩", "점선은 케이블 후보, 숫자는 비용입니다."];
    case "sort":
      return ["1단계", "케이블을 비용순으로 정렬", "비용이 작은 케이블부터 확인합니다."];
    case "plants":
      return ["2단계", "발전소 섬을 한 그룹으로", run.plants.length > 1
        ? names + " 섬을 한 그룹으로 묶습니다. 케이블은 설치하지 않습니다."
        : "발전소가 하나뿐이라 묶을 섬이 없습니다."];
    case "check":
      return ["확인 " + of, name + " (비용 " + s.w + ")",
        s.u + "번 섬의 루트는 " + s.ru + ", " + s.v + "번 섬의 루트는 " + s.rv + ". 같은 그룹일까요?"];
    case "install":
      return ["설치 " + of, name + " 설치",
        "루트가 다릅니다. 설치하고 두 그룹을 합칩니다. 총 비용 " + s.prev + " + " + s.w + " = " + s.total];
    case "skip":
      return ["건너뜀 " + of, name + " 건너뜀", "루트가 같습니다. 설치하면 사이클이 생깁니다."];
    default:
      return ["완료", "설치 " + s.installed.length + "개, 총 비용 " + s.total, "모든 섬에 전기가 들어옵니다."];
  }
}

function noteFor(s) {
  if (s.type === "plants" && s.changed.length) return s.changed.map((i) => "parent[" + i + "] = " + s.parent[i]).join(", ");
  if (s.type === "check" && s.changed.length) {
    return "경로 압축: " + s.changed.map((i) => "parent[" + i + "] " + s.before[i] + " → " + s.parent[i]).join(", ");
  }
  if (s.type === "install") return "parent[" + s.rv + "] = " + s.ru;
  return "";
}

if (typeof document === "undefined") {
  module.exports = { buildRun: buildRun, rootOf: rootOf, describe: describe, noteFor: noteFor, DATA: DATA };
} else {
  /* ---------- drawing ---------- */
  const NS = "http://www.w3.org/2000/svg";
  const el = (name, attrs, parent) => {
    const node = document.createElementNS(NS, name);
    for (const a in attrs) node.setAttribute(a, attrs[a]);
    if (parent) parent.appendChild(node);
    return node;
  };
  const $ = (id) => document.getElementById(id);
  const BOLT = [[0.18, -1], [-0.58, 0.14], [-0.06, 0.14], [-0.2, 1], [0.58, -0.2], [0.06, -0.2]];
  const bolt = (cx, cy, s) => BOLT.map(([x, y]) => (cx + x * s).toFixed(1) + "," + (cy + y * s).toFixed(1)).join(" ");
  const tint = (hex, a) => {
    const c = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16));
    return "rgb(" + c.map((v) => Math.round(v * a + 255 * (1 - a))).join(",") + ")";
  };

  const svg = $("map");
  const [vx, vy, vw, vh] = DATA.view;
  svg.setAttribute("viewBox", [vx, vy, vw, vh].join(" "));
  const base = $("base");
  base.setAttribute("x", vx); base.setAttribute("y", vy); base.setAttribute("width", vw); base.setAttribute("height", vh);

  const cableNodes = {};
  DATA.edges.forEach(([u, v, w]) => {
    const k = key(u, v), [a, b] = DATA.seg[k], [tx, ty] = DATA.tag[k];
    const g = el("g", { class: "cable", "data-state": "wait" }, $("cables"));
    const line = { x1: a[0], y1: a[1], x2: b[0], y2: b[1] };
    el("line", Object.assign({ class: "casing" }, line), g);
    el("line", Object.assign({ class: "wire" }, line), g);
    el("circle", { class: "dot", cx: a[0], cy: a[1], r: 5 }, g);
    el("circle", { class: "dot", cx: b[0], cy: b[1], r: 5 }, g);
    const tag = el("g", { class: "tag" }, g);
    const hw = w < 10 ? 20 : 27;
    el("rect", { x: tx - hw, y: ty - 19, width: hw * 2, height: 38, rx: 7 }, tag);
    el("text", { x: tx, y: ty }, tag).textContent = w;
    cableNodes[k] = g;
  });

  const islandNodes = [];
  for (let i = 0; i < N; i++) {
    const [x, y] = DATA.pos[i];
    const g = el("g", { class: "island", tabindex: 0, role: "button" }, $("islands"));
    el("circle", { class: "halo", cx: x, cy: y, r: 39 }, g);
    el("circle", { class: "ring", cx: x, cy: y, r: 31 }, g);
    el("circle", { class: "disc", cx: x, cy: y, r: 27 }, g);
    el("text", { class: "num", x: x, y: y }, g).textContent = i;
    const power = el("g", { class: "power" }, g);
    el("circle", { cx: x + 26, cy: y - 26, r: 14.5 }, power);
    el("polygon", { points: bolt(x + 26, y - 26, 10) }, power);
    const plant = el("g", { class: "plant" }, g);
    el("polygon", { points: bolt(x - 37, y + 52, 13.5) }, plant);
    el("text", { x: x - 24, y: y + 52 }, plant).textContent = "발전소";
    g.addEventListener("click", () => togglePlant(i));
    g.addEventListener("keydown", (ev) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); ev.stopPropagation(); togglePlant(i); } });
    islandNodes.push(g);
  }

  /* ---------- state ---------- */
  const params = new URLSearchParams(location.search);
  const parsePlants = (text) => {
    const list = (text || "").split(",").filter((t) => /^\d+$/.test(t.trim())).map(Number).filter((p, i, arr) => p < N && arr.indexOf(p) === i);
    return list.length ? list.sort((a, b) => a - b) : DATA.plants.slice();
  };
  let run = buildRun(parsePlants(params.get("plants")));
  let step = Math.min(Math.max(parseInt(params.get("step") || "0", 10) || 0, 0), run.steps.length - 1);
  let timer = null;

  function render() {
    const s = run.steps[step];
    const root = s.parent.map((_, i) => rootOf(s.parent, i));
    const powered = new Set(run.plants.map((p) => root[p]));

    // cables: waiting and skipped below, installed above, the one being checked on top
    const rank = { wait: 0, skipped: 0, installed: 1, check: 2 };
    DATA.edges.map(([u, v]) => key(u, v)).sort((a, b) => rank[s.status[a]] - rank[s.status[b]]).forEach((k) => {
      const g = cableNodes[k];
      g.setAttribute("data-state", s.status[k]);
      g.style.setProperty("--gc", PALETTE[root[Number(k.split("-")[0])]]);
      $("cables").appendChild(g);
    });

    islandNodes.forEach((g, i) => {
      g.querySelector(".disc").setAttribute("fill", PALETTE[root[i]]);
      g.classList.toggle("focus", s.focus.includes(i));
      g.classList.toggle("is-plant", run.plants.includes(i));
      g.classList.toggle("is-powered", powered.has(root[i]) && !run.plants.includes(i));
      g.setAttribute("aria-pressed", run.plants.includes(i));
      g.setAttribute("aria-label", i + "번 섬" + (run.plants.includes(i) ? ", 발전소 있음" : ", 발전소 없음") + ". 누르면 발전소를 바꿉니다.");
    });

    $("st-count").textContent = s.installed.length;
    $("st-total").textContent = s.total;
    $("st-groups").textContent = new Set(root).size;

    const [badge, title, body] = describe(s, run);
    $("now").setAttribute("data-type", s.type);
    $("now-badge").textContent = badge;
    $("now-title").textContent = title;
    $("now-text").textContent = body;

    const active = s.type === "init" ? [] : ["check", "install", "skip"].includes(s.type) ? ["loop", s.type] : [s.type];
    document.querySelectorAll("#proc li").forEach((li) => li.classList.toggle("on", active.includes(li.dataset.p)));

    const order = s.sorted ? run.sorted : DATA.edges;
    $("list-order").textContent = s.sorted ? "(비용순)" : "(입력순)";
    const labels = { wait: "", check: "확인 중", installed: "설치", skipped: "건너뜀" };
    const list = $("cable-list");
    list.textContent = "";
    order.forEach(([u, v, w]) => {
      const li = document.createElement("li");
      li.setAttribute("data-state", s.status[key(u, v)]);
      li.innerHTML = '<span class="cost"></span><span class="pair"></span><span class="st"></span>';
      li.children[0].textContent = w;
      li.children[1].textContent = u + " - " + v;
      li.children[2].textContent = labels[s.status[key(u, v)]];
      list.appendChild(li);
    });

    const table = $("uf");
    table.textContent = "";
    const r1 = table.insertRow(); r1.className = "idx";
    const r2 = table.insertRow();
    r1.appendChild(document.createElement("th")).textContent = "섬";
    r2.appendChild(document.createElement("th")).textContent = "parent";
    s.parent.forEach((p, i) => {
      r1.insertCell().textContent = i;
      const td = r2.insertCell();
      td.textContent = p;
      td.style.backgroundColor = tint(PALETTE[root[i]], 0.2);
      if (p === i) td.classList.add("root");
      if (s.cells.includes(i)) td.classList.add("focus");
      if (s.changed.includes(i)) td.classList.add("changed");
    });
    const groups = $("groups");
    groups.textContent = "";
    [...new Set(root)].sort((a, b) => a - b).forEach((r) => {
      const chip = document.createElement("span");
      chip.className = "chip";
      const dot = document.createElement("i");
      dot.style.background = PALETTE[r];
      chip.appendChild(dot);
      chip.appendChild(document.createTextNode(root.map((x, i) => (x === r ? i : -1)).filter((i) => i >= 0).join(", ")));
      if (powered.has(r)) chip.appendChild(document.createElement("em")).textContent = "전기 공급";
      groups.appendChild(chip);
    });
    $("uf-note").textContent = noteFor(s);

    $("scrub").max = run.steps.length - 1;
    $("scrub").value = step;
    $("counter").textContent = (step + 1) + " / " + run.steps.length;
    $("b-first").disabled = $("b-prev").disabled = step === 0;
    $("b-next").disabled = step === run.steps.length - 1;
    $("b-play").textContent = timer ? "멈춤" : step === run.steps.length - 1 ? "다시 재생" : "재생";
  }

  function go(n) { step = Math.min(Math.max(n, 0), run.steps.length - 1); render(); }
  function stop() { if (timer) { clearInterval(timer); timer = null; } }
  function play() {
    if (timer) { stop(); render(); return; }
    if (step === run.steps.length - 1) step = 0;
    timer = setInterval(() => {
      if (step >= run.steps.length - 1) { stop(); render(); return; }
      go(step + 1);
    }, Number($("speed").value));
    render();
  }
  function togglePlant(i) {
    let plants = run.plants.slice();
    if (plants.includes(i)) {
      if (plants.length === 1) return;              // at least one power plant is required
      plants = plants.filter((p) => p !== i);
    } else {
      plants.push(i);
      plants.sort((a, b) => a - b);
    }
    stop();
    run = buildRun(plants);
    go(0);
  }

  $("b-first").addEventListener("click", () => { stop(); go(0); });
  $("b-prev").addEventListener("click", () => { stop(); go(step - 1); });
  $("b-next").addEventListener("click", () => { stop(); go(step + 1); });
  $("b-play").addEventListener("click", play);
  $("b-default").addEventListener("click", () => { stop(); run = buildRun(DATA.plants.slice()); go(0); });
  $("scrub").addEventListener("input", (ev) => { stop(); go(Number(ev.target.value)); });
  $("speed").addEventListener("change", () => { if (timer) { stop(); play(); } });
  document.addEventListener("keydown", (ev) => {
    if (["INPUT", "SELECT", "BUTTON"].includes(ev.target.tagName)) return;
    if (ev.key === "ArrowRight") { stop(); go(step + 1); }
    else if (ev.key === "ArrowLeft") { stop(); go(step - 1); }
    else if (ev.key === "Home") { stop(); go(0); }
    else if (ev.key === " ") { ev.preventDefault(); play(); }
  });
  render();
}
</script>
</body>
</html>
