<!-- Course loading screen: keep before embedded fonts and lesson data. -->
<style id="page-loader-style">
#page-loader{display:none;position:fixed;inset:0;z-index:10000;place-content:center;justify-items:center;gap:24px;background:#fafbf8;color:#245e4f;font:500 16px/1.5 system-ui,sans-serif;letter-spacing:-.3px}
html.page-is-loading #page-loader{display:grid}
html.page-is-loading{overflow:hidden}
#page-loader .loading-mark{display:grid;grid-template-columns:26px 26px;grid-template-rows:26px 26px;gap:8px}
#page-loader .loading-tile{position:relative;border-radius:6px;background:#c4d8b0;overflow:hidden}
#page-loader .loading-tile:nth-child(3){grid-area:2/2;background:#70945b}
#page-loader .loading-tile:nth-child(4){grid-area:2/1}
#page-loader .loading-tile::after{content:"";position:absolute;inset:0;background:#245e4f;opacity:0;animation:loading-clockwise 1.2s linear infinite;will-change:opacity}
#page-loader .loading-tile:nth-child(2)::after{animation-delay:-.9s}
#page-loader .loading-tile:nth-child(3)::after{animation-delay:-.6s}
#page-loader .loading-tile:nth-child(4)::after{animation-delay:-.3s}
#page-loader p{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@keyframes loading-clockwise{0%,20%,100%{opacity:1}25%,95%{opacity:0}}
@media(prefers-reduced-motion:reduce){#page-loader .loading-tile::after{animation:none;will-change:auto}#page-loader .loading-tile:first-child::after{opacity:1}}
</style>
<script>
(() => {
  const root = document.documentElement;
  let navigationTimer;
  let navigating = false;
  const setLoading = active => {
    root.classList.toggle('page-is-loading', active);
    root.setAttribute('aria-busy', String(active));
    document.querySelectorAll('.deck,.container').forEach(el => { el.inert = active; });
  };
  const finish = () => { clearTimeout(navigationTimer); navigating = false; setLoading(false); };
  setLoading(true);
  document.addEventListener('DOMContentLoaded', async () => {
    setLoading(true);
    const assets = [...document.images].map(img => img.decode().catch(() => {}));
    if (document.fonts) assets.push(document.fonts.ready);
    let assetTimer;
    await Promise.race([Promise.allSettled(assets), new Promise(resolve => { assetTimer = setTimeout(resolve, 8000); })]);
    clearTimeout(assetTimer);
    requestAnimationFrame(() => requestAnimationFrame(() => { if (!navigating) finish(); }));
  }, {once:true});
  window.addEventListener('pageshow', event => { if (event.persisted) finish(); });
  window.addEventListener('pagehide', () => clearTimeout(navigationTimer));
  window.navigateWithCourseLoader = (destination, replace = false) => {
    navigating = true;
    setLoading(true);
    clearTimeout(navigationTimer);
    navigationTimer = setTimeout(finish, 15000);
    requestAnimationFrame(() => setTimeout(() => location[replace ? 'replace' : 'assign'](destination), 0));
  };
  document.addEventListener('click', event => {
    const link = event.target.closest('a[href]');
    if (!link || event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey || link.hasAttribute('download') || (link.target && link.target !== '_self')) return;
    const destination = new URL(link.href, location.href);
    if (destination.origin !== location.origin || !/\/(?:main|week\d+_prac)\.html$/.test(destination.pathname)) return;
    event.preventDefault();
    window.navigateWithCourseLoader(destination.href);
  });
})();
</script>

<script id="lesson-data" type="application/json">[{"id":"chal1","title":"택배 상자 무게 정리","tag":"도전문제 1","problemNumber":1,"statement":"**문제 상황**\n\n교내 택배실에 무게가 서로 다른 상자들이 도착했습니다.\n가벼운 상자부터 확인할 수 있도록 상자의 무게를 **오름차순**으로 정렬하세요.\n인접한 두 원소를 비교하고 순서가 잘못되어 있으면 교환하는 **버블 정렬**을 직접 구현합니다.\n\n**만들 함수**\n\n| 함수 | 역할 |\n| --- | --- |\n| `bubble_sort(weights)` | 무게 리스트 자체를 오름차순으로 바꿉니다. 반환값은 사용하지 않습니다. |\n\n**입출력 형식**\n\n- **입력:** 상자 무게를 공백으로 구분한 한 줄입니다. 단위는 kg이며 정수만 사용합니다.\n- **출력:** `정렬된 무게: ` 뒤에 정렬한 파이썬 리스트를 출력합니다.\n\n**조건과 작성 안내**\n\n- 상자는 1개 이상 8개 이하이며, 무게는 1 이상 100 이하입니다. 같은 무게가 여러 번 나올 수 있습니다.\n- 비교는 왼쪽부터 오른쪽으로 진행합니다. 한 차례가 끝나면 오른쪽 끝의 가장 무거운 상자는 다음 비교에서 제외합니다.\n- 이번 문제는 조기 종료 없이 바깥 반복을 `n - 1`번 수행합니다. 조기 종료는 도전문제 4에서 추가합니다.\n- `sort()`와 `sorted()`를 사용하지 않습니다.\n- 입력과 출력 코드는 제공됩니다. 함수 본문을 작성하세요. `pass`는 아무 일도 하지 않는 임시 코드이므로 구현한 코드로 교체합니다.\n\n**입출력 예시**\n\n입력\n```\n5 2 4 2 1\n```\n\n출력\n```\n상자 무게(공백 구분): 5 2 4 2 1\n정렬된 무게: [1, 2, 2, 4, 5]\n```\n\n**왜 이 정렬을 사용할까요?**\n\n이 문제에서는 이웃한 두 상자의 무게를 비교하는 작은 판단을 반복해 전체 순서를 만드는 과정을 연습하기 위해 버블 정렬을 사용합니다.\n코드를 작성하기 전에 다음 질문을 생각해 보세요.\n\n- 이웃한 상자끼리만 비교하고 교환해도 가장 무거운 상자를 오른쪽 끝으로 보낼 수 있을까요? 예시의 상자들이 한 차례 비교를 거치며 어떻게 움직이는지 떠올려 보세요.\n- 한 차례를 마친 뒤 자리가 확정된 상자가 있다면, 다음 차례에도 그 상자를 다시 비교해야 할까요? 버블 정렬의 비교 범위가 줄어드는 이유를 설명해 보세요.\n","skeleton":"def bubble_sort(weights):\n    # To Do: 버블 정렬로 weights를 오름차순으로 정렬하세요.\n    pass\n\n\nweights = list(map(int, input(\"상자 무게(공백 구분): \").split()))\nbubble_sort(weights)\nprint(f\"정렬된 무게: {weights}\")\n","code":"### Solution ###\n\ndef bubble_sort(weights):\n    n = len(weights)    # Sol: 상자 수를 저장\n    for end in range(n - 1, 0, -1):    # Sol: 확정된 오른쪽 부분을 비교에서 제외\n        for j in range(end):    # Sol: 인접한 두 무게를 차례로 확인\n            if weights[j] > weights[j + 1]:    # Sol: 왼쪽 무게가 클 때만 교환\n                weights[j], weights[j + 1] = weights[j + 1], weights[j]    # Sol: 큰 무게를 오른쪽으로 이동\n\n\nweights = list(map(int, input(\"상자 무게(공백 구분): \").split()))\nbubble_sort(weights)\nprint(f\"정렬된 무게: {weights}\")\n","imageAlt":"교내 택 정렬하지 않은 부분에서 가장 큰 값을 골라 앞쪽에 놓는 **선택 정렬**을 직접 구현합니다.\n이번 문제는 부스 이름 없이 점수만 다룹니다.\n\n**만들 함수**\n\n| 함수 | 역할 |\n| --- | --- |\n| `selection_sort(scores)` | 점수 리스트 자체를 내림차순으로 바꿉니다. 반환값은 사용하지 않습니다. |\n\n**입출력 형식**\n\n- **입력:** 부스 점수를 공백으로 구분한 한 줄입니다.\n- **출력:** `정렬된 점수: ` 뒤에 정렬한 파이썬 리스트를 출력합니다.\n\n**조건과 작성 안내**\n\n- 점수는 1개 이상 8개 이하이며, 각 점수는 0 이상 100 이하의 정수입니다. 중복 점수도 모두 유지합니다.\n- 앞쪽부터 자리를 확정합니다. 각 자리마다 남은 부분의 최댓값 위치를 찾고 현재 자리와 교환합니다.\n- 최댓값이 이미 현재 자리에 있으면 교환하지 않습니다.\n- `sort()`, `sorted()`, `max()`를 사용하지 않고 비교문으로 최댓값 위치를 찾습니다.\n- 제공된 함수 안에서 최댓값 위치 탐색과 교환 부분을 작성하세요.\n\n**입출력 예시**\n\n입력\n```\n70 90 80 90 60\n```\n\n출력\n```\n부스 점수(공백 구분): 70 90 80 90 60\n정렬된 점수: [90, 90, 80, 70, 60]\n```\n\n**왜 이 정렬을 사용할까요?**\n\n높은 점수부터 검토하려면 남은 점수 중 가장 큰 값을 골라 다음 자리를 확정할 수 있습니다.\n이 문제에서는 이러한 선택을 반복하는 방식을 익히기 위해 선택 정렬을 사용합니다.\n\n- 가장 높은 점수를 맨 앞에 놓았다면, 두 번째로 높은 점수를 찾을 때는 어느 범위를 살펴보면 될까요? 이미 확정한 앞부분을 다시 살펴볼 필요가 있는지 생각해 보세요.\n- 버블 정렬처럼 순서가 잘못된 이웃을 발견할 때마다 교환하는 방식과 비교하면, 선택 정렬은 한 자리를 확정할 때 최대 몇 번 교환할까요? 항목을 서로 바꾸는 작업에 비용이 많이 드는 상황이라면 어떤 장점이 있을까요?\n","skeleton":"def selection_sort(scores):\n    # To Do: 선택 정렬로 scores를 내림차순으로 정렬하세요.\n    pass\n\n\nscores = list(map(int, input(\"부스 점수(공백 구분): \").split()))\nselection_sort(scores)\nprint(f\"정렬된 점수: {scores}\")\n","code":"### Solution ###\n\ndef selection_sort(scores):\n    n = len(scores)    # Sol: 점수 개수를 저장\n    for i in range(n - 1):    # Sol: 앞자리부터 높은 점수를 확정\n        max_index = i    # Sol: 미정렬 영역의 첫 위치를 후보로 선택\n        for j in range(i + 1, n):    # Sol: 남은 점수에서 최댓값 탐색\n            if scores[j] > scores[max_index]:    # Sol: 현재 후보보다 높은 점수인지 비교\n                max_index = j    # Sol: 최댓값 후보 위치를 갱신\n        if max_index != i:    # Sol: 이미 제자리에 있으면 교환 생략\n            scores[i], scores[max_index] = scores[max_index], scores[i]    # Sol: 선택한 최댓값을 현재 자리로 이동\n\n\nscores = list(map(int, input(\"부스 점수(공백 구분): \").split()))\nselection_sort(scores)\nprint(f\"정렬된 점수: {scores}\")\n","imageAlt":"축제 부스의 점수 카드를 살펴보는 운영진","image":"assets/illustrations/dde5ff667775aa04de59.webp","inputSpec":"부스 점수 1~8개를 공백으로 구분","outputSpec":"내림차순으로 정렬된 점수 리스트","cases":[{"label":"중복 최고 점수","input":["70 90 80 90 60"],"expected":"정렬된 점수: [90, 90, 80, 70, 60]","fullOutput":"부스 점수(공백 구분): 70 90 80 90 60\n정렬된 점수: [90, 90, 80, 70, 60]","trace":[{"line":14,"kind":"line","scope":"<module>","before":{"vars":{},"frames":[],"objects":[],"output":[]},"state":{"vars":{"scores":[70,90,80,90,60]},"frames":[],"objects":[],"output":[]},"input":{"prompt":"부스 점수(공백 구분): ","value":"70 90 80 90 60"}},{"line":3,"kind":"call","scope":"selection_sort","before":{"vars":{"scores":[70,90,80,90,60]},"frames":[],"objects":[],"output":[]},"state":{"vars":{"scores":[70,90,80,90,60]},"frames":[{"id":2,"name":"selection_sort","vars":{"scores":[70,90,80,90,60]}}],"objects":[],"output":[]},"callId":2},{"line":4,"kind":"line","scope":"selection_sort","before":{"vars":{"scores":[70,90,80,90,60]},"frames":[{"id":2,"name":"selection_sort","vars":{"scores":[70,90,80,90,60]}}],"objects":[],"output":[]},"state":{"vars":{"scores":[70,90,80,90,60]},"frames":[{"id":2,"name":"selection_sort","vars":{"scores":[70,90,80,90,60],"n":5}}],"objects":[],"output":[]}},{"line":5,"kind":"line","scope":"selection_sort","before":{"vars":{"scores":[70,90,80,90,60]},"frames":[{"id":2,"name":"selection_sort","vars":{"scores":[70,90,80,90,60],"n":5}}],"objects":[],"output":[]},"state":{"vars":{"scores":[70,90,80,90,60]},"frames":[{"id":2,"name":"selection_sort","vars":{"scores":[70,90,80,90,60],"n":5,"i":0}}],"objects":[],"output":[]}},{"line":6,"kind":"line","scope":"selection_sort","before":{"vars":{"scores":[70,90,80,90,60]},"frames":[{"id":2,"name":"selection_sort","vars":{"scores":[70,90,80,90,60],"n":5,"i":0}}],"objects":[],"output":[]},"state":{"vars":{"scores":[70,90,80,90,60]},"frames":[{"id":2,"name":"selection_sort","vars":{"scores":[70,90,80,90,60],"n":5,"i":0,"max_index":0}}],"objects":[],"output":[]}},{"line":7,"kind":"line","scope":"selection_sort","before":{"vars":{"scores":[70,90,80, ,"text":"            if scores[j] > scores[max_index]:    # Sol: 현재 후보보다 높은 점수인지 비교","show":6,"source":8},{"id":11,"text":"                max_index = j    # Sol: 최댓값 후보 위치를 갱신","show":7,"source":9},{"id":12,"text":"        if max_index != i:    # Sol: 이미 제자리에 있으면 교환 생략","show":8,"source":10},{"id":13,"text":"            scores[i], scores[max_index] = scores[max_index], scores[i]    # Sol: 선택한 최댓값을 현재 자리로 이동","show":9,"source":11},{"id":14,"text":"","show":0,"source":12},{"id":15,"text":"","show":0,"source":13},{"id":16,"text":"scores = list(map(int, input(\"부스 점수(공백 구분): \").split()))","show":0,"source":14},{"id":17,"text":"selection_sort(scores)","show":0,"source":15},{"id":18,"text":"print(f\"정렬된 점수: {scores}\")","show":0,"source":16}],"steps":[{"row":1,"source":1,"kind":"write","context":"Python / 작성 중"},{"row":6,"source":4,"kind":"write","context":"Python / 작성 중"},{"row":7,"source":5,"kind":"write","context":"Python / 작성 중"},{"row":8,"source":6,"kind":"write","context":"Python / 작성 중"},{"row":9,"source":7,"kind":"write","context":"Python / 작성 중"},{"row":10,"source":8,"kind":"write","context":"Python / 작성 중"},{"row":11,"source":9,"kind":"write","context":"Python / 작성 중"},{"row":12,"source":10,"kind":"write","context":"Python / 작성 중"},{"row":13,"source":11,"kind":"write","context":"Python / 작성 중"}],"final":"### Solution ###\n\ndef selection_sort(scores):\n    n = len(scores)    # Sol: 점수 개수를 저장\n    for i in range(n - 1):    # Sol: 앞자리부터 높은 점수를 확정\n        max_index = i    # Sol: 미정렬 영역의 첫 위치를 후보로 선택\n        for j in range(i + 1, n):    # Sol: 남은 점수에서 최댓값 탐색\n            if scores[j] > scores[max_index]:    # Sol: 현재 후보보다 높은 점수인지 비교\n                max_index = j    # Sol: 최댓값 후보 위치를 갱신\n        if max_index != i:    # Sol: 이미 제자리에 있으면 교환 생략\n            scores[i], scores[max_index] = scores[max_index], scores[i]    # Sol: 선택한 최댓값을 현재 자리로 이동\n\n\nscores = list(map(int, input(\"부스 점수(공백 구분): \").split()))\nselection_sort(scores)\nprint(f\"정렬된 점수: {scores}\")"}},{"id":"chal3","title":"달리기 기록표 정리","tag":"도전문제 3","problemNumber":3,"statement":"**문제 상황**\n\n러닝 동아리에서 참가자의 이름과 달리기 기록을 접수된 순서대로 저장했습니다.\n기록이 짧은 참가자부터 보이도록 기록표를 **삽입 정렬**로 정리하세요.\n기록이 같으면 먼저 접수한 참가자가 앞에 있어야 합니다.\n동일한 정렬 키를 가진 항목의 기존 순서를 유지하는 성질을 **안정성**이라고 합니다.\n\n**만들 함수와 자료**\n\n| 항목 | 역할 |\n| --- | --- |\n| `records` | `(이름, 기록)` 튜플의 리스트입니다. `[0]`은 이름, `[1]`은 기록입니다. |\n| `insertion_sort(records)` | 기록을 기준으로 리스트 자체를 오름차순 정렬합니다. 반환값은 사용하지 않습니다. |\n| `key` | 이번에 정렬된 앞부분에 삽입할 참가자 튜플입니다. 이름과 기록을 함께 보관합니다. |\n\n**입출력 형식**\n\n- **입력:** 첫 줄에 참가자 수, 다음 줄부터 `이름 기록`을 한 줄씩 입력합니다. 기록의 단위는 초입니다.\n- **출력:** 정렬된 순서대로 `이름 기록`을 한 줄씩 출력합니다.\n\n**조건과 작성 안내**\n\n- 참가자는 1명 이상 8명 이하이며 기록은 1 이상 1000 이하의 정수입니다. 이름은 서로 다르고 공백이 없습니다.\n- 이름을 정렬 기준으로 사용하지 않습니다. 같은 기록은 접수 순서를 유지합니다.\n- 두 번째 항목부터 하나씩 정렬된 앞부분에 삽입합니다. 필요한 항목을 오른쪽으로 한 칸씩 이동시키고 빈 자리에 `key`를 놓습니다.\n- 이동 중에는 리스트에 같은 항목이 잠시 두 번 나타날 수 있습니다. 삽입할 항목은 `key`에 보관되어 있습니다.\n- `sort()`, `sorted()`, `insert()`를 사용하지 않습니다. 인덱스 대입으로 삽입 정렬을 구현하세요.\n\n**입출력 예시**\n\n입력\n```\n4\n민수 15\n지우 12\n서연 15\n하늘 11\n```\n\n출력\n```\n참가자 수: 4\n이름과 기록: 민수 15\n이름과 기록: 지우 12\n이름과 기록: 서연 15\n이름과 기록: 하늘 11\n하늘 11\n지우 12\n민수 15\n서연 15\n```\n\n**왜 이 정렬을 사용할까요?**\n\n이 기록표는 기록순으로 정리하면서도 동점자의 접수 순서를 지켜야 합니다.\n삽입 정렬은 정리된 앞부분에 참가자를 한 명씩 끼워 넣는 방식이어서, 어떤 항목을 이동해야 이 조건을 지킬 수 있는지 살펴보기에 적합합니다.\n\n- 새 참가자와 기록이 같은 사람이 앞에 있다면, 그 사람을 뒤로 옮겨도 접수 순서가 유지될까요? 기록이 같은 경우와 다른 경우를 나누어 생각해 보세요.\n- 이미 기록순으로 정리된 표에 새 참가자 한 명을 추가한다면, 기존 항목 중 어떤 항목만 이동하면 될까요? 이런 상황에서 삽입 정렬이 유용한 이유를 설명해 보세요.\n","skeleton":"def insertion_sort(records):\n    # To Do: 삽입 정렬로 records를 기록 오름차순으로 정렬하고 동점자의 접수 순서를 유지하세요.\n    pass\n\n\ncount = int(input(\"참가자 수: \"))\nrecords = []\n\nfor i in range(count):\n    name, seconds = input(\"이름과 기록: \").split()\n    records.append((name, int(seconds)))\n\ninsertion_sort(records)\n\nfor name, seconds in records:\n    print(name, seconds)\n","code":"### Solution ###\n\ndef insertion_sort(records):\n    for i in range(1, len(records)):    # Sol: 두 번째 항목부터 정렬된 앞부분에 삽입\n        key = records[i]    # Sol: 삽입할 이름과 기록을 함께 보관\n        j = i - 1    # Sol: 정렬된 앞부분의 마지막 위치\n        # Sol: 기록이 더 클 때만 이동해 동점자의 접수 순서를 유지합니다.\n        while j >= 0 and records[j][1] > key[1]:\n            records[j + 1] = records[j]    # Sol: 앞쪽 항목을 오른쪽으로 한 칸 이동\n            j -= 1    # Sol: 그다음 왼쪽 항목 확인\n        records[j + 1] = key    # Sol: 확보한 자리에 보관한 참가자 삽입\n\n\ncount = int(input(\"참가자 수: \"))\nrecords = []\n\nfor i in range(count):\n    name, seconds = input(\"이름과 기록: \").split()\n    records.append((name, int(seconds)))\n\ninsertion_sort(records)\n\nfor name, seconds in records:\n    print(name, seconds)\n","imageAlt":"운동장에서 참가자의 달리기 기록을 적는 학생들","image":"assets/illustrations/aeee680c6418968ad9c4.webp","inputSpec":"참가자 수와 이름/기록을 접수 순서대로 입력","outputSpec":"기록 오름차순, 같은 기록은 접수 순서 유지","cases":[{"label":"혼합 기록과 동점","input":["4","민수 15","지우 12","서연 15","하늘 11"],"expected":"하늘 11\n지우 12\n민수 15\n서연 15","fullOutput":"참가자 수: 4\n이름과 기록: 민수 15\n이름과 기록: 지우 12\n이름과 기록: 서연 15\n이름과 기록: 하늘 11\n하늘 11\n지우 12\n민수 15\n서연 15","trace":[{"line":14,"kind":"line","scope":"<module>","before":{"vars":{},"frames":[],"objects":[],"output":[]},"state":{"vars":{"count":4},"frames":[],"objects":[],"output":[]},"input":{"prompt":"참가자 수: ","value":"4"}},{"line":15,"kind":"line","scope":"<module>","before":{"vars":{"count":4},"frames":[],"objects":[],"output":[]},"state":{"vars":{"count":4,"records":[]},"frames":[],"objects":[],"output":[]}},{"line":17,"kind":"line","scope":"<module>","before":{"vars":{"count":4,"records":[]},"frames":[],"objects":[],"output":[]},"state":{"vars":{"count":4,"records":[],"i":0},"frames":[],"objects":[],"output":[]}},{"line":18,"kind":"line","scope":"<module>","before":{"vars":{"count":4,"records":[],"i":0},"frames":[],"objects":[],"output":[]},"state":{"vars":{"count":4,"records":[],"i":0,"name":"민수","seconds":"15"},"frames":[],"objects":[],"output":[]},"input":{"prompt":"이름과 기록: ","value":"민수 15"}},{"line":19,"kind":"line","scope":"<module>","before":{"vars":{"count":4,   for i in range(1, len(records)):    # Sol: 두 번째 항목부터 정렬된 앞부분에 삽입","show":2,"source":4},{"id":7,"text":"        key = records[i]    # Sol: 삽입할 이름과 기록을 함께 보관","show":3,"source":5},{"id":8,"text":"        j = i - 1    # Sol: 정렬된 앞부분의 마지막 위치","show":4,"source":6},{"id":9,"text":"        # Sol: 기록이 더 클 때만 이동해 동점자의 접수 순서를 유지합니다.","show":5,"source":7},{"id":10,"text":"        while j >= 0 and records[j][1] > key[1]:","show":6,"source":8},{"id":11,"text":"            records[j + 1] = records[j]    # Sol: 앞쪽 항목을 오른쪽으로 한 칸 이동","show":7,"source":9},{"id":12,"text":"            j -= 1    # Sol: 그다음 왼쪽 항목 확인","show":8,"source":10},{"id":13,"text":"        records[j + 1] = key    # Sol: 확보한 자리에 보관한 참가자 삽입","show":9,"source":11},{"id":14,"text":"","show":0,"source":12},{"id":15,"text":"","show":0,"source":13},{"id":16,"text":"count = int(input(\"참가자 수: \"))","show":0,"source":14},{"id":17,"text":"records = []","show":0,"source":15},{"id":18,"text":"","show":0,"source":16},{"id":19,"text":"for i in range(count):","show":0,"source":17},{"id":20,"text":"    name, seconds = input(\"이름과 기록: \").split()","show":0,"source":18},{"id":21,"text":"    records.append((name, int(seconds)))","show":0,"source":19},{"id":22,"text":"","show":0,"source":20},{"id":23,"text":"insertion_sort(records)","show":0,"source":21},{"id":24,"text":"","show":0,"source":22},{"id":25,"text":"for name, seconds in records:","show":0,"source":23},{"id":26,"text":"    print(name, seconds)","show":0,"source":24}],"steps":[{"row":1,"source":1,"kind":"write","context":"Python / 작성 중"},{"row":6,"source":4,"kind":"write","context":"Python / 작성 중"},{"row":7,"source":5,"kind":"write","context":"Python / 작성 중"},{"row":8,"source":6,"kind":"write","context":"Python / 작성 중"},{"row":9,"source":7,"kind":"write","context":"Python / 작성 중"},{"row":10,"source":8,"kind":"write","context":"Python / 작성 중"},{"row":11,"source":9,"kind":"write","context":"Python / 작성 중"},{"row":12,"source":10,"kind":"write","context":"Python / 작성 중"},{"row":13,"source":11,"kind":"write","context":"Python / 작성 중"}],"final":"### Solution ###\n\ndef insertion_sort(records):\n    for i in range(1, len(records)):    # Sol: 두 번째 항목부터 정렬된 앞부분에 삽입\n        key = records[i]    # Sol: 삽입할 이름과 기록을 함께 보관\n        j = i - 1    # Sol: 정렬된 앞부분의 마지막 위치\n        # Sol: 기록이 더 클 때만 이동해 동점자의 접수 순서를 유지합니다.\n        while j >= 0 and records[j][1] > key[1]:\n            records[j + 1] = records[j]    # Sol: 앞쪽 항목을 오른쪽으로 한 칸 이동\n            j -= 1    # Sol: 그다음 왼쪽 항목 확인\n        records[j + 1] = key    # Sol: 확보한 자리에 보관한 참가자 삽입\n\n\ncount = int(input(\"참가자 수: \"))\nrecords = []\n\nfor i in range(count):\n    name, seconds = input(\"이름과 기록: \").split()\n    records.append((name, int(seconds)))\n\ninsertion_sort(records)\n\nfor name, seconds in records:\n    print(name, seconds)"}},{"id":"chal4","title":"정렬 방법의 비교 횟수 조사","tag":"도전문제 4","problemNumber":4,"statement":"**문제 상황**\n\n같은 데이터라도 정렬 방법에 따라 필요한 연산 수가 달라집니다.\n교환이 없는 차례에서 멈추는 **조기 종료 버블 정렬**과 **선택 정렬**의 비교 횟수를 조사하세요.\n두 방법 모두 오름차순으로 정렬합니다. 실행 시간 대신 정확히 셀 수 있는 원소 비교 횟수를 출력합니다.\n\n**만들 함수와 제공 코드**\n\n| 함수 | 역할 |\n| --- | --- |\n| `bubble_count(values)` | 리스트 자체를 조기 종료 버블 정렬하고, 원소 비교 횟수를 정수로 반환합니다. 학생이 작성합니다. |\n| `selection_count(values)` | 리스트 자체를 선택 정렬하고, 원소 비교 횟수를 반환합니다. 완성 코드가 제공됩니다. |\n\n**비교 횟수의 기준**\n\n- `values[j] > values[j + 1]` 또는 `values[j] < values[min_index]`처럼 **원소 값 두 개를 비교할 때마다 1회**로 셉니다. 조건이 거짓이어도 1회입니다.\n- 반복 범위, 인덱스, `swapped`의 검사와 교환, 대입은 비교 횟수에 포함하지 않습니다.\n- 버블 정렬은 각 차례마다 왼쪽부터 인접한 값을 비교하고, 끝난 뒤 오른쪽 비교 범위를 하나 줄입니다.\n- 한 차례 동안 교환이 한 번도 없었으면 그 차례의 비교까지 센 뒤 종료합니다.\n- 비교할 원소가 2개 미만이면 두 방법 모두 0회입니다.\n\n**입출력 형식**\n\n- **입력:** 정수를 공백으로 구분한 한 줄입니다. 아무것도 입력하지 않고 Enter를 누르면 빈 리스트입니다.\n- **출력:** `버블 결과`, `버블 비교`, `선택 결과`, `선택 비교`를 예시처럼 네 줄로 출력합니다.\n\n**조건과 작성 안내**\n\n- 정수는 0개 이상 8개 이하이며 각 값은 0 이상 100 이하입니다. 중복도 가능합니다.\n- 두 함수에 **같은 원본의 서로 다른 복사본**을 전달합니다. 첫 번째로 정렬한 결과를 두 번째 함수의 입력으로 사용하지 않습니다.\n- 복사와 출력 코드는 제공됩니다. `bubble_count()`의 본문만 완성하세요. `sort()`와 `sorted()`는 사용하지 않습니다.\n- 비교 횟수는 이 문제에서 정한 한 종류의 기본 연산입니다. 이것만으로 모든 입력에서 실제 실행 시간이 더 빠르다고 결론 내리지는 않습니다.\n\n**입출력 예시**\n\n입력\n```\n1 2 3 4\n```\n\n출력\n```\n정수 목록(공백 구분): 1 2 3 4\n버블 결과: [1, 2, 3, 4]\n버블 비교: 3회\n선택 결과: [1, 2, 3, 4]\n선택 비교: 6회\n```\n\n**왜 이 두 정렬을 비교할까요?**\n\n정렬 방법을 고를 때는 최종 결과뿐 아니라 입력이 얼마나 정리되어 있는지와 필요한 연산 수도 살펴봐야 합니다.\n이 문제에서는 조기 종료 버블 정렬과 선택 정렬을 비교하며 입력 순서가 성능에 미치는 영향을 확인합니다.\n\n- 이미 오름차순인 입력을 받았을 때, 두 알고리즘은 각각 어떤 근거로 정렬이 끝났음을 판단할까요? 남은 비교를 생략할 수 있는지 실행 전에 예상해 보세요.\n- 같은 값들을 역순으로 입력하면 두 알고리즘의 비교 횟수 차이는 어떻게 달라질까요? 두 입력에 대한 측정 결과를 근거로, 알고리즘을 선택할 때 입력 상태를 함께 살펴봐야 하는 이유를 설명해 보세요.\n","skeleton":"def bubble_count(values):\n    # To Do: 조기 종료 버블 정렬로 values를 오름차순 정렬하고 원소 비교 횟수를 반환하세요.\n    pass\n\n\ndef selection_count(values):\n    comparisons = 0\n    for i in range(len(values) - 1):\n        min_index = i\n        for j in range(i + 1, len(values)):\n            comparisons += 1\n            if values[j] < values[min_index]:\n                min_index = j\n        if min_index != i:\n            values[i], values[min_index] = values[min_index], values[i]\n    return comparisons\n\n\nvalues = list(map(int, input(\"정수 목록(공백 구분): \").split()))\nbubble_values = values.copy()\nselection_values = values.copy()\n\nbubble_comparisons = bubble_count(bubble_values)\nselection_comparisons = selection_count(selection_values)\n\nprint(f\"버블 결과: {bubble_values}\")\nprint(f\"버블 비교: {bubble_comparisons}회\")\nprint(f\"선택 결과: {selection_values}\")\nprint(f\"선택 비교: {selection_comparisons}회\")\n","code":"### Solution ###\n\ndef bubble_count(values):\n    comparisons = 0    # Sol: 원소 비교 횟수를 0으로 시작\n    for end in range(len(values) - 1, 0, -1):    # Sol: 확정된 오른쪽 부분을 비교에서 제외\n        swapped = False    # Sol: 매 차례 교환 여부를 초기화\n        for j in range(end):    # Sol: 인접한 두 원소를 차례로 확인\n            # Sol: 교환 여부와 관계없이 바로 다음 원소 비교를 한 번 셉니다.\n            comparisons += 1\n            if values[j] > values[j + 1]:    # Sol: 왼쪽 값이 더 클 때 교환\n                values[j], values[j + 1] = values[j + 1], values[j]    # Sol: 큰 값을 오른쪽으로 이동\n                swapped = True    # Sol: 이번 차례에 교환이 있었음을 기록\n        # Sol: 한 차례 동안 교환이 없으면 이미 정렬된 상태입니다.\n        if not swapped:\n            break    # Sol: 남은 차례를 생략\n    return comparisons    # Sol: 누적된 원소 비교 횟수 반환\n\n\ndef selection_count(values):    # 비교용으로 제공된 선택 정렬\n    comparisons = 0\n    for i in range(len(values) - 1):\n        min_index = i\n        for j in range(i + 1, len(values)):\n            comparisons += 1    # 교환 여부와 관계없이 원소 비교 1회\n            if values[j] < values[min_index]:\n                min_index = j\n        if min_index != i:\n            values[i], values[min_index] = values[min_index], values[i]\n    return comparisons\n\n\nvalues = list(map(int, input(\"정수 목록(공백 구분): \").split()))\n# 두 정렬이 같은 초기 상태에서 시작하도록 독립적인 복사본을 만듭니다.\nbubble_values = values.copy()\nselection_values = values.copy()\n\nbubble_comparisons = bubble_count(bubble_values)\nselection_comparisons = selection_count(selection_values)\n\nprint(f\"버블 결과: {bubble_values}\")\nprint(f\"버블 비교: {bubble_comparisons}회\")\nprint(f\"선택 결과: {selection_values}\")\nprint(f\"선택 비교: {selection_comparisons}회\")\n","imageAlt":"두 정렬 방법을 비교하며 공부하는 학생들","image":"assets/illustrations/61afa3140c64809b608e.webp","inputSpec":"0~8개 정수. 빈 줄도 입력 가능","outputSpec":"두 정렬 결과와 원소 값끼리 비교한 횟수","cases":[{"label":"정렬된 입력과 조기 종료","input":["1 2 3 4"],"expected":"버블 결과: [1, 2, 3, 4]\n버블 비교: 3회\n선택 결과: [1, 2, 3, 4]\n선택 비교: 6회","fullOutput":"정수 목록(공백 구분): 1 2 3 4\n버블 결과: [1, 2, 3, 4]\n버블 비교: 3회\n선택 결과: [1, 2, 3, 4]\n선택 비교: 6회","trace":[{"line":32,"kind":"line","scope":"<module>","before":{"vars":{},"frames":[],"objects":[],"output":[]},"state":{"vars":{"values":[1,2,3,4]},"frames":[],"objects":[],"output":[]},"input":{"prompt":"정수 목록(공백 구분): ","value":"1 2 3 4"}},{"line":34,"kind":"line","scope":"<module>","before":{"vars":{"values":[1,2,3,4]},"frames":[],"objects":[],"output":[]},"state":{"vars":{"values":[1,2,3,4],"bubble_values":[1,2,3,4]},"frames":[],"objects":[],"output":[]}},{"line":3 nt(f\"선택 비교: {selection_comparisons}회\")","show":0,"source":43}],"steps":[{"row":1,"source":1,"kind":"write","context":"Python / 작성 중"},{"row":6,"source":4,"kind":"write","context":"Python / 작성 중"},{"row":7,"source":5,"kind":"write","context":"Python / 작성 중"},{"row":8,"source":6,"kind":"write","context":"Python / 작성 중"},{"row":9,"source":7,"kind":"write","context":"Python / 작성 중"},{"row":10,"source":8,"kind":"write","context":"Python / 작성 중"},{"row":11,"source":9,"kind":"write","context":"Python / 작성 중"},{"row":12,"source":10,"kind":"write","context":"Python / 작성 중"},{"row":13,"source":11,"kind":"write","context":"Python / 작성 중"},{"row":14,"source":12,"kind":"write","context":"Python / 작성 중"},{"row":15,"source":13,"kind":"write","context":"Python / 작성 중"},{"row":16,"source":14,"kind":"write","context":"Python / 작성 중"},{"row":17,"source":15,"kind":"write","context":"Python / 작성 중"},{"row":18,"source":16,"kind":"write","context":"Python / 작성 중"},{"row":22,"source":19,"kind":"write","context":"Python / 작성 중"},{"row":28,"source":24,"kind":"write","context":"Python / 작성 중"},{"row":37,"source":33,"kind":"write","context":"Python / 작성 중"}],"final":"### Solution ###\n\ndef bubble_count(values):\n    comparisons = 0    # Sol: 원소 비교 횟수를 0으로 시작\n    for end in range(len(values) - 1, 0, -1):    # Sol: 확정된 오른쪽 부분을 비교에서 제외\n        swapped = False    # Sol: 매 차례 교환 여부를 초기화\n        for j in range(end):    # Sol: 인접한 두 원소를 차례로 확인\n            # Sol: 교환 여부와 관계없이 바로 다음 원소 비교를 한 번 셉니다.\n            comparisons += 1\n            if values[j] > values[j + 1]:    # Sol: 왼쪽 값이 더 클 때 교환\n                values[j], values[j + 1] = values[j + 1], values[j]    # Sol: 큰 값을 오른쪽으로 이동\n                swapped = True    # Sol: 이번 차례에 교환이 있었음을 기록\n        # Sol: 한 차례 동안 교환이 없으면 이미 정렬된 상태입니다.\n        if not swapped:\n            break    # Sol: 남은 차례를 생략\n    return comparisons    # Sol: 누적된 원소 비교 횟수 반환\n\n\ndef selection_count(values):    # 비교용으로 제공된 선택 정렬\n    comparisons = 0\n    for i in range(len(values) - 1):\n        min_index = i\n        for j in range(i + 1, len(values)):\n            comparisons += 1    # 교환 여부와 관계없이 원소 비교 1회\n            if values[j] < values[min_index]:\n                min_index = j\n        if min_index != i:\n            values[i], values[min_index] = values[min_index], values[i]\n    return comparisons\n\n\nvalues = list(map(int, input(\"정수 목록(공백 구분): \").split()))\n# 두 정렬이 같은 초기 상태에서 시작하도록 독립적인 복사본을 만듭니다.\nbubble_values = values.copy()\nselection_values = values.copy()\n\nbubble_comparisons = bubble_count(bubble_values)\nselection_comparisons = selection_count(selection_values)\n\nprint(f\"버블 결과: {bubble_values}\")\nprint(f\"버블 비교: {bubble_comparisons}회\")\nprint(f\"선택 결과: {selection_values}\")\nprint(f\"선택 비교: {selection_comparisons}회\")"}},{"id":"extra1","title":"사진 공모전 전시작 선정","tag":"추가문제 1","problemNumber":5,"statement":"**문제 상황**\n\n사진 공모전에서 점수가 높은 참가자부터 `k`명의 작품을 전시하려고 합니다.\n도전문제 3의 삽입 정렬을 응용해 참가자들을 점수 **내림차순**으로 정렬하세요.\n같은 점수이면 먼저 접수한 참가자가 먼저 선정됩니다.\n\n**만들 함수와 자료**\n\n| 항목 | 역할 |\n| --- | --- |\n| `entries` | 접수 순서대로 저장된 `(이름, 점수)` 튜플의 리스트입니다. |\n| `rank_entries(entries)` | 점수 내림차순으로 리스트 자체를 삽입 정렬합니다. 동점의 접수 순서를 유지하며 반환값은 사용하지 않습니다. |\n\n**입출력 형식**\n\n- **입력:** 첫 줄에 참가자 수, 다음 줄부터 `이름 점수`, 마지막 줄에 선정할 인원 `k`를 입력합니다.\n- **출력:** 선정된 참가자 `k`명의 `이름 점수`를 정렬된 순서대로 한 줄씩 출력합니다.\n- `k`가 0이면 `선발된 참가자가 없습니다.`를 한 줄 출력합니다.\n\n**조건과 작성 안내**\n\n- 참가자는 1명 이상 8명 이하, 점수는 0 이상 100 이하의 정수입니다. 이름은 서로 다르고 공백이 없습니다.\n- `k`는 0 이상 참가자 수 이하입니다. 동점자가 선정 경계에 있어도 정확히 `k`명만 선정합니다.\n- 이름순으로 정렬하지 않습니다. 점수가 같을 때는 원래 접수 순서를 보존합니다.\n- 도전문제 3에서 연습한 삽입 정렬만 사용합니다. `sort()`, `sorted()`, `insert()`를 사용하지 않습니다.\n- 입력과 상위 `k`명 출력은 제공됩니다. 함수 본문을 작성하세요.\n\n**입출력 예시**\n\n입력\n```\n4\n민수 80\n지우 95\n서연 95\n하늘 70\n2\n```\n\n출력\n```\n참가자 수: 4\n이름과 점수: 민수 80\n이름과 점수: 지우 95\n이름과 점수: 서연 95\n이름과 점수: 하늘 70\n선정 인원: 2\n지우 95\n서연 95\n```\n\n**왜 이 정렬을 사용할까요?**\n\n전시작 선정에서는 높은 점수를 먼저 배치하는 것과 동점자의 접수 순서를 지키는 것이 모두 중요합니다.\n이 문제에서는 도전문제 3의 삽입 정렬을 내림차순으로 응용해 두 조건을 함께 만족시키는 방법을 연습합니다.\n\n- 마지막 선정 자리를 두고 점수가 같은 두 참가자가 있다면, 두 사람의 순서가 바뀌어도 괜찮을까요? 정렬의 안정성이 실제 선정 결과에 어떤 영향을 주는지 생각해 보세요.\n- 도전문제 3은 기록이 작은 사람부터, 이번 문제는 점수가 큰 사람부터 정렬합니다. 비교 방향을 바꾸면서도 동점자의 접수 순서를 유지하려면 어떤 경우에 항목을 이동해야 할까요?\n","skeleton":"def rank_entries(entries):\n    # To Do: 삽입 정렬로 entries를 점수 내림차순으로 정렬하고 동점자의 접수 순서를 유지하세요.\n    pass\n\n\ncount = int(input(\"참가자 수: \"))\nentries = []\n\nfor i in range(count):\n    name, score = input(\"이름과 점수: \").split()\n    entries.append((name, int(score)))\n\nk = int(input(\"선정 인원: \"))\nrank_entries(entries)\n\nif k == 0:\n    print(\"선발된 참가자가 없습니다.\")\nelse:\n    for i in range(k):\n        print(entries[i][0], entries[i][1])\n","code":"### Solution ###\n\ndef rank_entries(entries):\n    for i in range(1, len(entries)):    # Sol: 두 번째 항목부터 정렬된 앞부분에 삽입\n        key = entries[i]    # Sol: 삽입할 이름과 점수를 함께 보관\n        j = i - 1    # Sol: 정렬된 앞부분의 마지막 위치\n        # Sol: 점수가 더 낮을 때만 이동해 동점자의 접수 순서를 유지합니다.\n        while j >= 0 and entries[j][1] < key[1]:\n            entries[j + 1] = entries[j]    # Sol: 점수가 낮은 참가자를 오른쪽으로 이동\n            j -= 1    # Sol: 그다음 왼쪽 참가자 확인\n        entries[j + 1] = key    # Sol: 확보한 자리에 보관한 참가자 삽입\n\n\ncount = int(input(\"참가자 수: \"))\nentries = []\n\nfor i in range(count):\n    name, score = input(\"이름과 점수: \").split()\n    entries.append((name, int(score)))\n\nk = int(input(\"선정 인원: \"))\nrank_entries(entries)\n\nif k == 0:\n    print(\"선발된 참가자가 없습니다.\")\nelse:\n    for i in range(k):\n        print(entries[i][0], entries[i][1])\n","imageAlt":"사진 공모전의 출품작과 평가표를 검토하는 학생들","image":"assets/illustrations/2b4efa25c51a7ef5bb16.webp","inputSpec":"참가자 수, 이름/점수, 선정 인원 k","outputSpec":"상위 k명. 같은 점수는 접수 순서 유지","cases":[{"label":"동점 최고 점수","input":["4","민수 80","지우 95","서연 95","하늘 70","2"],"expected":"지우 95\n서연 95","fullOutput":"참가자 수: 4\n이름과 점수: 민수 80\n이름과 점수: 지우 95\n이름과 점수: 서연 95\n이름과 점수: 하늘 70\n선정 인원: 2\n지우 95\n서연 95","trace":[{"line":14,"kind":"line","scope":"<module>","before":{"vars":{},"frames":[],"objects":[],"output":[]}," <script>
'use strict';
const lessons = JSON.parse(document.getElementById('lesson-data').textContent);
const $ = id => document.getElementById(id);
const escapeHTML = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
let typing = null;
const ui = {lesson:0,phase:'problem',buildIndex:0,traceIndex:-1,caseIndex:0,toastTimer:null,modalFocus:null};
const lesson = () => lessons[ui.lesson];
const testCase = () => lesson().cases[ui.caseIndex];
const buildStep = () => lesson().build.steps[ui.buildIndex-1] || null;
const traceStep = () => testCase().trace[ui.traceIndex] || null;
const emptyState = () => ({objects:[],frames:[],vars:{},output:[]});
const same = (a,b) => JSON.stringify(a) === JSON.stringify(b);
const pyValue = value => value && typeof value==='object' && 'ref' in value ? `객체 #${Number(value.ref)}` : value===true ? 'True' : value===false ? 'False' : value===null ? 'None' : typeof value==='string' ? `"${value}"` : Array.isArray(value) ? `[${value.map(pyValue).join(', ')}]` : String(value);
const currentRows = () => {
 const index = ui.phase==='run' ? lesson().build.steps.length : ui.buildIndex;
 return lesson().build.rows.filter(row=>row.show<=index && (row.until===undefined || index<row.until));
};
const currentCode = () => currentRows().map(row=>row.text).join('\n');

function highlight(code){
 const token=/(#[^\n]*|f?"(?:\\.|[^"\\])*"|f?'(?:\\.|[^'\\])*'|\b(?:class|def|return|if|elif|else|for|while|in|is|and|or|not|from|import|True|False|None|pass|break)\b|\bself\b|\b(?:print|input|int|list|map|len|range|deque)\b|\b\d+\b)/g;
 let html='',last=0;
 for(const match of code.matchAll(token)){
  html+=escapeHTML(code.slice(last,match.index));const value=match[0];
  const type=value.startsWith('#')?'comment':/^(f?["'])/.test(value)?'str':/^\d/.test(value)?'num':value==='self'?'self':/^(print|input|int|list|map|len|range|deque)$/.test(value)?'fn':'kw';
  html+=`<span class="${type}">${escapeHTML(value)}</span>`;last=match.index+value.length;
 }
 return html+escapeHTML(code.slice(last));
}


function introPicture(){return "";}

function renderLesson(){
 const l=lesson();
 $('lesson-title').textContent=l.title;
 $('lesson-badge').textContent=ui.lesson===4?'추가':String(ui.lesson+1).padStart(2,'0');
 $('problem-copy').innerHTML=markdown(l.statement);
 formatSentences($('problem-copy'));
 $('scene').innerHTML=`<button class="scene-trigger" type="button" aria-haspopup="dialog" aria-label="${escapeHTML(l.title)} 그림 크게 보기" title="그림 크게 보기"><img src="${l.image}" alt="${escapeHTML(l.imageAlt)}"><span class="scene-zoom" aria-hidden="true">＋</span></button>`;
 $('case-select').innerHTML=l.cases.map((c,index)=>`<option value="${index}">예제 ${index+1} / ${escapeHTML(c.label)}</option>`).join('');
 $('case-select').value=String(ui.caseIndex);
 $('problem-copy').scrollTop=0;
 renderIO();render(true);
}

function renderIO(){
 const l=lesson(),example=l.example;
 $('io-panel').innerHTML=`<p class="example-label">기본 예제 1</p><section class="io-section"><h2>입력</h2><p class="io-spec">${escapeHTML(l.inputSpec)}</p><pre class="io-example" id="input-example">${escapeHTML(example.input||'(빈 줄 입력)')}</pre></section><section class="io-section"><h2>실행 화면</h2><p class="io-spec">${escapeHTML(l.outputSpec)}</p><pre class="io-example" id="output-example">${escapeHTML(example.output)}</pre></section>`;
}

function revealExplanation(lineNumber){
 const code=lesson().code.split('\n')[lineNumber-1].trim().replace(/ {4}#.*$/, '');
 if(code.startsWith('# Sol:'))return ['구현할 역할',code.replace('# Sol:','').trim()];
 if(code.startsWith('#'))return ['완성 코드를 준비합니다','입력과 출력 형식을 유지하며 함수 본문을 완성합니다.'];
 if(code.startsWith('def '))return ['정렬 함수를 정의합니다','리스트 자체를 수정합니다. 횟수를 세는 함수는 정수 비교 횟수도 반환합니다.'];
 if(code.includes('input('))return ['입력을 읽습니다','입력한 값으로 리스트 또는 참가자 정보를 준비합니다. 이름과 숫자는 같은 항목에 저장합니다.'];
 if(code.includes('.copy()'))return ['독립적인 복사본을 만듭니다','두 알고리즘에 같은 원본 데이터를 따로 전달합니다. 한쪽의 정렬이 다른 쪽 입력에 영향을 주지 않습니다.'];
 if(code.includes('comparisons += 1'))return ['원소 비교 1회를 셉니다','바로 다음 줄에서 원소 값 두 개를 비교합니다. 참과 거짓에 관계없이 한 번입니다.'];
 if(code==='swapped = False')return ['이번 차례의 교환 여부를 초기화합니다','이전 차례의 교환 기록을 지웁니다. 매 차례 새로 확인해야 합니다.'];
 if(code==='swapped = True')return ['교환이 있었음을 기록합니다','이번 차례에 값의 순서를 바꿨으므로 교환 없음으로 종료하지 않습니다.'];
 if(code==='if not swapped:')return ['조기 종료 조건을 확인합니다','이번 차례 전체에서 교환이 없었는지 확인합니다. 현재 차례의 비교 횟수는 이미 포함되어 있습니다.'];
 if(code==='break')return ['정렬 반복을 종료합니다','교환이 없는 차례에서 정렬이 끝났음을 확인했습니다. 다음은 비교 횟수 반환입니다.'];
 if(code.startsWith('for end '))return ['오른쪽 비교 경계를 줄입니다','end는 이번 차례에 비교하는 마지막 인덱스입니다. 그 오른쪽은 이전 차례에서 자리가 확정되었습니다.'];
 if(code.startsWith('for j in range(end)'))return ['인접한 두 위치로 이동합니다','j와 j + 1 위치를 비교합니다. 오른쪽 경계 end를 넘지 않습니다.'];
 if(code.startsWith('while j >= 0'))return ['앞쪽 항목을 이동할지 판단합니다',lesson().id==='extra1'?'현재 항목보다 점수가 낮은 항목만 이동합니다. 같은 점수에서는 멈춰 접수 순서를 지킵니다.':'현재 항목보다 기록이 큰 항목만 이동합니다. 같은 기록에서는 멈춰 접수 순서를 지킵니다.'];
 if(code.includes('key = '))return ['삽입할 항목을 따로 보관합니다','이름과 정렬 기준 값을 함께 key에 저장합니다. 이동 중에도 이 항목은 사라지지 않습니다.'];
 if(/\[j \+ 1\] = .*\[j\]$/.test(code))return ['앞쪽 항목을 오른쪽으로 이동합니다','key의 자리를 확보하는 중입니다. 리스트에 같은 항목이 잠시 두 번 보여도 key는 별도로 보관되어 있습니다.'];
 if(code==='j -= 1')return ['왼쪽의 다음 위치를 확인합니다','j를 한 칸 줄입니다. -1이 되면 더 이상 앞에 원소가 없습니다.'];
 if(code.endsWith('[j + 1] = key'))return ['보관한 항목을 삽입합니다','확인한 위치의 오른쪽인 j + 1에 key를 넣습니다. 이번 항목까지 앞부분이 정렬되었습니다.'];
 if(code==='max_index = i'||code==='min_index = i')return ['선택할 값의 후보 위치를 정합니다','미정렬 영역의 첫 위치 i에서 후보를 시작합니다. 이후 항목들을 모두 비교합니다.'];
 if(code==='max_index = j'||code==='min_index = j')return ['후보 위치를 갱신합니다','더 적합한 값을 찾았습니다. 값 자체를 옮기는 단계는 아직 아닙니다.'];
 if(code.includes('], ')&&code.includes(' = '))return ['두 위치의 값을 교환합니다','교환 전과 후의 리스트를 비교하세요. 원소 수와 각 값의 개수는 유지됩니다.'];
 if(code.startsWith('if ')||code.startsWith('elif '))return ['조건을 확인합니다','다음 실행에서 실제로 선택된 분기를 따라갑니다. 같은 값일 때의 비교 결과도 확인하세요.'];
 if(code.startsWith('for '))return ['다음 항목 또는 위치를 처리합니다','반복 범위 안의 원소를 하나씩 처리합니다. 반복이 끝나면 다음 구역으로 이동합니다.'];
 if(code.startsWith('return '))return ['비교 횟수를 반환합니다','리스트는 이미 정렬되어 있습니다. 반환한 횟수를 호출부의 변수에 저장합니다.'];
 if(code.startsWith('print('))return ['결과를 출력합니다','문제에서 정한 순서와 문구에 맞춰 결과를 출력합니다.'];
 if(code.includes('.append('))return ['접수 순서대로 저장합니다','이름과 숫자를 한 튜플로 묶습니다. 현재 순서가 동점일 때 유지할 접수 순서입니다.'];
 if(code.endsWith('= 0'))return ['횟수를 0에서 시작합니다','이 함수 호출에서 발생하는 원소 비교만 누적합니다.'];
 if(/^(bubble_sort|selection_sort|insertion_sort|rank_entries)\(/.test(code)||code.includes('= bubble_count(')||code.includes('= selection_count('))return ['정렬 함수를 호출합니다','함수 안의 비교와 이동을 마친 뒤 호출한 위치로 돌아옵니다.'];
 return ['변수에 값을 저장합니다','현재 코드 줄과 변수의 이전 값 → 현재 값을 함께 확인하세요.'];
}
function buildExplanation(){
 const step=buildStep();
 return step?revealExplanation(step.source):['학생용 코드에서 시작합니다','입력과 출력 등 제공된 코드를 유지하면서 작성할 부분을 한 줄씩 채웁니다. pass를 구현 코드로 바꿉니다.'];
}
function traceExplanation(step){
 if(step.input)return ['입력값을 읽었습니다',`${step.input.prompt}${step.input.value || '(빈 줄)'}`];
 if(step.kind==='call')return ['함수를 호출합니다',`${step.scope}()의 매개변수와 정렬 대상 리스트를 확인하세요.`];
 if(step.kind==='return')return ['호출한 곳으로 돌아갑니다',`반환값은 ${pyValue(step.value)}입니다. None을 반환하는 정렬 함수도 전달받은 리스트 자체는 수정합니다.`];
 if(step.state.output.length>step.before.output.length)return ['결과가 출력되었습니다',step.state.output.at(-1)];
 return revealExplanation(step.line);
}

function keepCodeLineVisible(line){
 const container=$('code-scroll');
 if(!line?.isConnected||!container.contains(line))return;
 const top=line.offsetTop,bottom=top+line.offsetHeight;
 if(top<container.scrollTop+16||bottom>container.scrollTop+container.clientHeight-16)container.scrollTop=Math.max(0,top-Math.min(container.clientHeight*.27,70));
}

function finishTyping(){
 if(!typing)return;
 const animation=typing;typing=null;
 cancelAnimationFrame(animation.frame);
 animation.text.innerHTML=highlight(animation.fullText);
 animation.text.classList.remove('typing');
 animation.text.style.minHeight='';
 $('code-scroll').setAttribute('aria-busy','false');
 keepCodeLineVisible(animation.line);
}

function typeCodeLine(line,fullText){
 if(!line||window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const text=line.querySelector('.line-text');
 const indent=fullText.match(/^\s*/)[0],characters=Array.from(fullText.slice(indent.length));
 if(!characters.length)return;
 // Reserve the wrapped line's height so following code stays in place.
 text.style.minHeight=text.getBoundingClientRect().height+'px';
 text.innerHTML=highlight(indent);text.classList.add('typing');
 $('code-scroll').setAttribute('aria-busy','true');
 const animation={line,text,fullText,frame:0,count:0,started:performance.now()};
 typing=animation;
 const duration=Math.min(1100,Math.max(250,characters.length*18));
 function tick(now){
  if(typing!==animation)return;
  const count=Math.min(characters.length,Math.floor((now-animation.started)/duration*characters.length)+1);
  if(count!==animation.count){
   animation.count=count;text.innerHTML=highlight(indent+characters.slice(0,count).join(''));
   keepCodeLineVisible(line);
  }
  if(count===characters.length)finishTyping();
  else animation.frame=requestAnimationFrame(tick);
 }
 animation.frame=requestAnimationFrame(tick);
}

function renderCode(resetScroll=false,animateLine=false){
 const rows=currentRows(),running=ui.phase==='run';
 const step=running?traceStep():buildStep();
 const target=running?rows.find(row=>row.source===step?.line)?.id:step?.row;
 $('code-scroll').innerHTML=rows.map(row=>`<div class="code-line ${!row.text.trim()?'blank':''} ${row.id===target?'active':''}" id="code-row-${row.id}" data-source="${row.source||''}" ${row.id===target?'aria-current="step"':''}><span class="line-text">${highlight(row.text)}</span></div>`).join('');
 $('code-context').textContent=running?step?.state.frames.at(-1)?.name?step.state.frames.at(-1).name+'()':'완성 코드':step?.context||'Python';
 const explanation=running?(step?traceExplanation(step):['완성한 코드가 움직이는 순서','함수 정의가 준비되어 있습니다. 다음 버튼으로 입력부터 정렬 중인 리스트를 따라갑니다.']):buildExplanation();
 $('explanation').hidden=!explanation;
 $('explanation-title').textContent=explanation?.[0]||'';$('explanation-body').textContent=explanation?.[1]||'';
 formatSentences($('explanation'));
 if(resetScroll||!target)$('code-scroll').scrollTop=0;
 if(target){
  const line=$('code-row-'+target);
  if(animateLine&&!running&&step?.kind==='write'&&rows.find(row=>row.id===target).text.trim())typeCodeLine(line,rows.find(row=>row.id===target).text);
  requestAnimationFrame(()=>keepCodeLineVisible(line));
 }
}

function render(resetScroll=false,animateLine=false){

 const problem=ui.phase==='problem',running=ui.phase==='run';

 $('io-panel').hidden=running;$('runtime').hidden=!running;

function objectMarkup(){return '';}
function calculationMarkup(){return '';}
function renderRuntime(resetScroll=false){
 const step=traceStep(),state=step?.state||emptyState(),before=step?.before||emptyState(),scroll=$('memory').scrollTop;
 const variableRows=(values,previous={})=>Object.entries(values).filter(([,value])=>!Array.isArray(value)).map(([key,value])=>`<div class="variable ${!same(value,previous[key])?'changed':''}"><span>${escapeHTML(key)}</span><span class="variable-value">${key in previous&&!same(value,previous[key])?`<span class="previous-value">${escapeHTML(pyValue(previous[key]))}</span> → `:''}${escapeHTML(pyValue(value))}</span></div>`).join('');
 const frame=state.frames.at(-1),priorFrame=before.frames.find(f=>f.id===frame?.id),v=frame?.vars||{},old=priorFrame?.vars||{};
 const itemValue=item=>Array.isArray(item)&&item.length===2?`${item[0]} / ${item[1]}`:pyValue(item);
 function array(name,items,prior,indices={}){
  const markers=index=>Object.entries(indices).filter(([,value])=>value===index).map(([key])=>key);
  return `<section class="sort-array"><h3>${escapeHTML(name)}</h3><div class="sort-items">${items.length?items.map((item,index)=>`<span class="sort-item ${markers(index).length?'active':''} ${prior&&!same(item,prior[index])?'changed':''}"><b>${escapeHTML(itemValue(item))}</b><small>[${index}]${markers(index).length?' / '+escapeHTML(markers(index).join(', ')):''}</small></span>`).join(''):'<span class="sort-item">빈 리스트</span>'}</div>${prior&&!same(items,prior)?`<p class="sort-prior">이전 ${escapeHTML(pyValue(prior))} → 현재 ${escapeHTML(pyValue(items))}</p>`:''}</section>`;
 }
 let content='';
 if(!step)content='<div class="empty-state"><div class="empty-mark">[ ]</div><p>아직 실행 전입니다.<br>리스트의 비교와 이동을 따라가 봅시다.</p></div>';
 else{
  if(step.input)content+=`<div class="sort-input">입력: ${escapeHTML(step.input.prompt)}${escapeHTML(step.input.value||'(빈 줄)')}</div>`;
  const indices={};for(const key of ['i','j','end','min_index','max_index'])if(Number.isInteger(v[key]))indices[key]=v[key];
  if(Number.isInteger(v.j)&&['bubble_sort','bubble_count'].includes(frame?.name))indices['j + 1']=v.j+1;
  if(frame){
   content+=`<div class="call-flow"><span class="frame active">${escapeHTML(frame.name)}()</span></div>`;
   if('comparisons' in v)content+=`<p class="sort-counter">원소 비교 누적: ${v.comparisons}회</p>`;
   if('key' in v)content+=`<div class="sort-key">따로 보관한 key: ${escapeHTML(itemValue(v.key))}</div><p style="font-size:17px;margin-bottom:10px">이동 중의 중복은 임시 상태입니다. key를 넣으면 이번 삽입이 끝납니다.</p>`;
   for(const [key,value] of Object.entries(v))if(Array.isArray(value)&&key!=='key')content+=array(key,value,old[key],indices);
   content+='<p style="font-size:17px;margin-bottom:12px">[숫자]는 인덱스, i와 j 등은 현재 변수의 위치입니다. 아래 변수와 강조된 코드 줄을 함께 확인하세요.</p>';
  }
  if(step.kind==='return')content+=`<div class="return-message">${escapeHTML(step.scope)}() 반환<strong>${escapeHTML(pyValue(step.value))}</strong></div>`;
  content+='<div class="recursive-frames">'+state.frames.map((f,index)=>`<section class="recursive-frame ${index===state.frames.length-1?'active':''}"><div class="frame-heading"><strong>${escapeHTML(f.name)}()</strong><span>지역 변수</span></div><div class="variables">${variableRows(f.vars,before.frames.find(x=>x.id===f.id)?.vars)}</div></section>`).join('')+'</div>';
  for(const [key,value] of Object.entries(state.vars))if(Array.isArray(value))content+=array('함수 밖 / '+key,value,before.vars[key]);
  if(Object.keys(state.vars).length)content+=`<section class="global-variables"><h3>함수 밖의 변수</h3><div class="variables">${variableRows(state.vars,before.vars)}</div></section>`;
 }
 $('memory').innerHTML=content;$('memory').scrollTop=resetScroll?0:scroll;
 $('output-lines').innerHTML=state.output.length?state.output.map((line,index)=>`<div class="output-line ${index>=before.output.length?'new-output':''}">${escapeHTML(line)}</div>`).join(''):'<p class="output-placeholder">아직 출력이 없습니다.</p>';
 $('finished-label').hidden=ui.traceIndex!==testCase().trace.length-1;
 if(state.output.length>before.output.length)$('output-lines').scrollTop=$('output-lines').scrollHeight;
}

function formatSentences(root){
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
 const nodes=[];
 while(walker.nextNode()){
  const node=walker.currentNode,parent=node.parentElement;
  if(parent.closest('p,li,td,th')&&!parent.closest('pre,code,svg'))nodes.push(node);
 }
 for(const node of nodes){
  const lines=node.textContent.replace(/([.!?。！？]["'’”)\]]*)[ \t\r\n]+/g,'$1\n').split('\n');
  if(lines.length<2)continue;
  const fragment=document.createDocumentFragment();
  lines.forEach((line,index)=>{if(index)fragment.append(document.createElement('br'));fragment.append(document.createTextNode(line))});
  node.replaceWith(fragment);
 }
}

function markdown(source){
 const inline=value=>escapeHTML(value).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>');
 const lines=source.split('\n');
 let html='',paragraph=[];
 const flush=()=>{if(paragraph.length){html+=`<p>${inline(paragraph.join(' '))}</p>`;paragraph=[]}};
 for(let index=0;index<lines.length;index++){
  const line=lines[index].trim();
  if(!line){flush();continue}
  if(line.startsWith('```')){
   flush();const code=[];
   while(++index<lines.length&&!lines[index].startsWith('```'))code.push(lines[index]);
   html+=`<pre>${escapeHTML(code.join('\n'))}</pre>`;continue;
  }
  if(line.startsWith('|')){
   flush();const rows=[];
   while(index<lines.length&&lines[index].trim().startsWith('|')){
    const row=lines[index++].trim();
    if(!/^\|[\s:|\-]+\|$/.test(row))rows.push(row.split('|').slice(1,-1));
   }
   index--;
   html+='<table><thead><tr>'+rows[0].map(cell=>`<th scope="col">${inline(cell.trim())}</th>`).join('')+'</tr></thead><tbody>';
   html+=rows.slice(1).map(row=>'<tr>'+row.map(cell=>`<td>${inline(cell.trim())}</td>`).join('')+'</tr>').join('')+'</tbody></table>';continue;
  }
  if(/^\d+\. /.test(line)){
   flush();html+='<ol>';
   while(index<lines.length&&/^\d+\. /.test(lines[index].trim()))html+=`<li>${inline(lines[index++].trim().replace(/^\d+\. /,''))}</li>`;
   index--;html+='</ol>';continue;
  }
  if(line.startsWith('- ')){
   flush();html+='<ul>';
   while(index<lines.length&&lines[index].trim().startsWith('- '))html+=`<li>${inline(lines[index++].trim().slice(2))}</li>`;
   index--;html+='</ul>';continue;
  }
  if(/^#{1,3} /.test(line)||/^\*\*.+\*\*$/.test(line)){
   flush();html+=`<h3>${inline(line.replace(/^#+ /,''))}</h3>`;continue;
  }
  paragraph.push(line);
 }
 flush();return html;
}

async function copyCode(){
 finishTyping();
 const source=currentCode();let copied=false;
 if(navigator.clipboard?.writeText){try{await navigator.clipboard.writeText(source);copied=true}catch(error){/* A file URL may require the local fallback. */}}
 if(!copied){
  const area=document.createElement('textarea'),focused=document.activeElement;
  area.value=source;area.setAttribute('readonly','');area.style.cssText='position:fixed;left:-10000px;top:0';
  document.body.append(area);area.select();
  try{copied=document.execCommand('copy')}catch(error){copied=false}
  area.remove();focused?.focus();
 }
 if(copied)toast('화면의 코드와 주석을 복사했습니다.');
 else openModal('코드 직접 복사',`<p>코드를 선택한 뒤 Ctrl+C 또는 ⌘C를 눌러 주세요.</p><textarea aria-label="복사할 코드" readonly>${escapeHTML(source)}</textarea>`);
}

async function toggleFullscreen(){
 try{
  if(document.fullscreenElement){await document.exitFullscreen();return}
  if(document.documentElement.requestFullscreen){await document.documentElement.requestFullscreen();return}
 }catch(error){/* Fall back to a larger presentation area when fullscreen is unavailable. */}
 document.body.classList.toggle('focus-screen');
 toast(document.body.classList.contains('focus-screen')?'F 또는 Esc를 누르면 원래 화면으로 돌아갑니다.':'원래 화면으로 돌아왔습니다.');
}

$('next-button').addEventListener('click',next);
$('previous-button').addEventListener('click',previous);
$('copy-button').addEventListener('click',copyCode);
$('restart-button').addEventListener('click',restartPhase);
$('menu-button').addEventListener('click',showMenu);
$('scene').addEventListener('click',event=>{if(event.target.closest('.scene-trigger'))showPicture()});
$('fullscreen-button').addEventListener('click',toggleFullscreen);
$('close-modal').addEventListener('click',closeModal);
$('modal-backdrop').addEventListener('click',event=>{if(event.target===$('modal-backdrop'))closeModal()});
document.querySelectorAll('[data-phase]').forEach(button=>button.addEventListener('click',()=>setPhase(button.dataset.phase)));
$('case-select').addEventListener('change',event=>{ui.caseIndex=Number(event.target.value);ui.traceIndex=-1;renderIO();render(true)});
$('modal-content').addEventListener('click',event=>{
 const choice=event.target.closest('[data-lesson]');
 if(choice){closeModal();changeLesson(Number(choice.dataset.lesson))}
 if(event.target.closest('#reset-lesson')){closeModal();changeLesson(ui.lesson)}
 if(event.target.closest('#help-button'))showHelp();
});
document.addEventListener('fullscreenchange',()=>$('fullscreen-button').setAttribute('aria-label',document.fullscreenElement?'전체 화면 종료':'전체 화면'));
document.addEventListener('keydown',event=>{
 if(event.key==='Escape'){closeModal();document.body.classList.remove('focus-screen');return}
 if(!$('modal-backdrop').hidden){
  if(event.key==='Tab'){
   const focusable=[...$('modal').querySelectorAll('button,textarea,select,a[href],[tabindex="0"]')].filter(element=>!element.disabled&&!element.hidden);
   const first=focusable[0],last=focusable.at(-1);
   if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus()}
   else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus()}
  }
  return;
 }
 if(event.altKey||event.ctrlKey||event.metaKey||event.isComposing||event.repeat)return;
 if(event.target.closest('select,input,textarea,[contenteditable="true"]'))return;
 if(event.target.closest('button,a[href]')&&[' ','Enter'].includes(event.key))return;
 if(['ArrowRight',' '].includes(event.key)){event.preventDefault();next()}
 else if(event.key==='ArrowLeft'){event.preventDefault();previous()}
 else if(event.key==='PageDown'){event.preventDefault();changeLesson(ui.lesson+1)}
 else if(event.key==='PageUp'){event.preventDefault();changeLesson(ui.lesson-1)}
 else if(/^[1-5]$/.test(event.key)){event.preventDefault();changeLesson(Number(event.key)-1)}
 else if(event.key.toLowerCase()==='f'){event.preventDefault();toggleFullscreen()}
 else if(event.key==='?'){event.preventDefault();showHelp()}
});
renderLesson();

</script>
