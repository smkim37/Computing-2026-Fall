<!-- Course loading screen: keep before embedded fonts and lesson data. -->
<style id="page-loader-style">
#page-loader{display:none;position:fixed;inset:0;z-index:10000;place-content:center;justify-items:center;gap:24px;background:#fafbf8;color:#245e4f;font:500 16px/1.5 system-ui,sans-serif;letter-spacing:-.3px}
html.page-is-loading #page-loader{display:grid}
html.page-is-loading{overflow:hidden}
#page-loader .loading-mark{display:grid;grid-template-columns:26px 26px;grid-template-rows:26px 26px;gap:8px}
#page-loader .loading-tile{position:relative;border-radius:6px;background:#c4d8b0;overflow:hidden}
#page-loader .loading-tile:nth-child(3){grid-area:2/2;background:#70945b}
#page-loader .loading-tile:nth-child(4){grid-area:2/1}
#page-loader .loading-tile::after{content:"";position:absolute;inset:0;background:#245e4f;opacity:0;animation:loading-clockwise 1.2s linear infinite;will-change:opacity}
#page-loader .loading-tile:nth-child(2)::after{animation-delay:-.9s}
#page-loader .loading-tile:nth-child(3)::after{animation-delay:-.6s}
#page-loader .loading-tile:nth-child(4)::after{animation-delay:-.3s}
#page-loader p{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@keyframes loading-clockwise{0%,20%,100%{opacity:1}25%,95%{opacity:0}}
@media(prefers-reduced-motion:reduce){#page-loader .loading-tile::after{animation:none;will-change:auto}#page-loader .loading-tile:first-child::after{opacity:1}}
</style>
<script>
(() => {
  const root = document.documentElement;
  let navigationTimer;
  let navigating = false;
  const setLoading = active => {
    root.classList.toggle('page-is-loading', active);
    root.setAttribute('aria-busy', String(active));
    document.querySelectorAll('.deck,.container').forEach(el => { el.inert = active; });
  };
  const finish = () => { clearTimeout(navigationTimer); navigating = false; setLoading(false); };
  setLoading(true);
  document.addEventListener('DOMContentLoaded', async () => {
    setLoading(true);
    const assets = [...document.images].map(img => img.decode().catch(() => {}));
    if (document.fonts) assets.push(document.fonts.ready);
    let assetTimer;
    await Promise.race([Promise.allSettled(assets), new Promise(resolve => { assetTimer = setTimeout(resolve, 8000); })]);
    clearTimeout(assetTimer);
    requestAnimationFrame(() => requestAnimationFrame(() => { if (!navigating) finish(); }));
  }, {once:true});
  window.addEventListener('pageshow', event => { if (event.persisted) finish(); });
  window.addEventListener('pagehide', () => clearTimeout(navigationTimer));
  window.navigateWithCourseLoader = (destination, replace = false) => {
    navigating = true;
    setLoading(true);
    clearTimeout(navigationTimer);
    navigationTimer = setTimeout(finish, 15000);
    requestAnimationFrame(() => setTimeout(() => location[replace ? 'replace' : 'assign'](destination), 0));
  };
  document.addEventListener('click', event => {
    const link = event.target.closest('a[href]');
    if (!link || event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey || link.hasAttribute('download') || (link.target && link.target !== '_self')) return;
    const destination = new URL(link.href, location.href);
    if (destination.origin !== location.origin || !/\/(?:main|week\d+_prac)\.html$/.test(destination.pathname)) return;
    event.preventDefault();
    window.navigateWithCourseLoader(destination.href);
  });
})();
</script>

<script id="lesson-data" type="application/json">[{"id":"chal1","title":"접수 목록에서 신청자 찾기","tag":"도전문제 1","problemNumber":1,"statement":"**문제 상황**\n\n동아리에서 신청 번호와 이름을 접수된 순서대로 저장했습니다.\n신청 번호를 입력받아 신청자 이름과 몇 번째로 접수했는지 알려 주는 프로그램을 작성하세요.\n목록은 번호순으로 정렬되어 있지 않습니다. **순차 탐색**을 직접 구현해 사용합니다.\n\n**이론 코드와 연결하기**\n\n이론 교안의 「순차 탐색 알고리즘」(7쪽)을 참고합니다.\n교안의 `A[i].key`는 i번째 기록의 탐색 키입니다. 이 문제에서는 신청 번호가 `key`이고 이름이 `name`입니다.\n`Application` 클래스와 객체를 만드는 입력 코드는 제공됩니다.\n\n| 항목 | 역할 |\n| --- | --- |\n| `A` | 접수 순서대로 저장한 `Application` 객체의 리스트입니다. |\n| `A[i].key`, `A[i].name` | i번째 신청자의 신청 번호와 이름입니다. |\n| `sequential_search(A, key, low, high)` | 양 끝을 포함한 `low`부터 `high`까지 탐색합니다. 찾으면 인덱스, 없으면 `None`을 반환합니다. |\n\n**입출력 형식**\n\n- **입력:** 첫 줄에 신청자 수, 다음 줄부터 `신청번호 이름`, 마지막 줄에 찾을 신청 번호를 입력합니다.\n- **출력:** 찾으면 `신청자: 이름`과 `접수 위치: N`을 두 줄로 출력합니다. 접수 위치는 1부터 셉니다.\n- 없으면 `신청 내역이 없습니다.`를 한 줄 출력합니다.\n- **조건:** 신청자는 1명 이상 30명 이하입니다. 신청 번호와 찾을 번호는 1 이상 9999 이하의 정수입니다. 등록된 신청 번호는 서로 다르며, 이름은 공백 없는 비어 있지 않은 문자열입니다. 찾는 번호는 목록에 없을 수도 있습니다.\n\n**작성 안내**\n\n1. 교안과 같은 인자와 반환 규칙을 사용해 **`sequential_search()`의 본문**을 작성하세요. 찾는 즉시 탐색을 끝내고 인덱스를 반환합니다.\n2. **전체 목록에 대한 함수 호출과 결과 출력**을 작성하세요. 반환값은 `index`에 저장하고, 해당 기록에서 이름을 읽습니다.\n\n함수 안에서는 출력하지 않습니다. 인덱스 0도 정상적인 탐색 결과이며, 실패를 뜻하는 `None`과 구분해야 합니다.\n신청 번호의 `in` 검사나 `index()`, `dict`, `set`으로 탐색을 대신하지 않습니다. 목록을 정렬하거나 바꾸지 않습니다.\n`pass`는 아무 일도 하지 않는 임시 코드입니다. 각 `pass`를 지우고 `To Do:`에 맞는 코드로 교체하세요.\n\n**입출력 예시**\n\n입력\n```\n4\n42 민수\n17 지우\n63 서연\n90 하늘\n17\n```\n\n출력\n```\n신청자 수: 4\n신청 번호와 이름: 42 민수\n신청 번호와 이름: 17 지우\n신청 번호와 이름: 63 서연\n신청 번호와 이름: 90 하늘\n찾을 신청 번호: 17\n신청자: 지우\n접수 위치: 2\n```\n\n**왜 순차 탐색을 사용할까요?**\n\n접수 순서를 유지한 목록은 신청 번호순으로 정렬되어 있지 않습니다.\n이 문제에서는 목록을 재배치하지 않고 앞에서부터 번호를 비교하는 방법을 연습합니다.\n\n- 번호순으로 정렬되지 않은 목록에서 가운데 번호만 보고 어느 쪽을 제외할지 결정할 수 있을까요?\n- 찾는 신청자가 첫 번째에 있을 때와 목록에 없을 때, 확인해야 하는 기록의 수는 어떻게 달라질까요?\n","skeleton":"class Application:\n    def __init__(self, key, name):\n        self.key = key\n        self.name = name\n\n\ndef sequential_search(A, key, low, high):\n    # To Do: low부터 high까지 순차 탐색하여 인덱스 또는 None을 반환하세요.\n    pass\n\n\nn = int(input(\"신청자 수: \"))\nA = []\nfor _ in range(n):\n    number, name = input(\"신청 번호와 이름: \").split()\n    A.append(Application(int(number), name))\n\nkey = int(input(\"찾을 신청 번호: \"))\n\n# To Do: 전체 목록을 탐색하고 신청자 이름과 접수 위치 또는 실패 문구를 출력하세요.\npass\n","code":"### Solution ###\n\nclass Application:\n    def __init__(self, key, name):\n        self.key = key\n        self.name = name\n\n\ndef sequential_search(A, key, low, high):\n    for i in range(low, high + 1):    # Sol: 양 끝을 포함한 범위를 앞에서부터 확인\n        if A[i].key == key:    # Sol: 현재 신청 번호와 찾을 번호를 비교\n            return i    # Sol: 찾은 기록의 인덱스를 반환하고 탐색 종료\n    return None    # Sol: 범위 안에 찾는 번호가 없으면 탐색 실패\n\n\nn = int(input(\"신청자 수: \"))\nA = []\nfor _ in range(n):\n    number, name = input(\"신청 번호와 이름: \").split()\n    A.append(Application(int(number), name))\n\nkey = int(input(\"찾을 신청 번호: \"))\n\nindex = sequential_search(A, key, 0, len(A) - 1)    # Sol: 전체 접수 목록에서 탐색\n# Sol: 인덱스 0도 성공이므로 None 여부로 실패를 구분합니다.\nif index is not None:\n    print(f\"신청자: {A[index].name}\")    # Sol: 찾은 기록의 이름 출력\n    print(f\"접수 위치: {index + 1}\")    # Sol: 인덱스를 1부터 시작하는 위치로 변환\nelse:\n    print(\"신청 내역이 없습니다.\")    # Sol: 탐색에 실패했을 때 안내\n","imageAlt":"동아리 접수대에서 신청 기록을 확인하는 학생","image":"assets/illustrations/20bebc6925cec4e1173e.webp","inputSpec":"신청자 수, 번호와 이름, 찾을 번호","outputSpec":"신청자 이름과 1부터 시작하는 접수 위치 또는 실패 안내","cases":[{"label":"중간 위치 성공","input":["4","42 민수","17 지우","63 서연","90 하늘","17"],"expected":"신청자: 지우\n접수 위치: 2","fullOutput":"신청자 수: 4\n신청 번호와 이름: 42 민수\n신청 번호와 이름: 17 지우\n신청 번호와 이름: 63 서연\n신청 번호와 이름: 90 하늘\n찾을 신청 번호: 17\n신청자: 지우\n접수 위치: 2","trace":[{"line":3,"kind":"line","scope":"<module>","before":{"vars":{},"frames":[],"objects":[],"output":[]},"state":{"vars":{},"frames":[],"objects":[],"output":[]}},{"line":16,"kind":"line","scope":"<module>","before":{"vars":{},"frames":[],"objects":[],"output":[]},"state":{"vars":{"n":4},"frames":[],"objects":[],"ou ss Application:","show":0,"source":3},{"id":4,"text":"    def __init__(self, key, name):","show":0,"source":4},{"id":5,"text":"        self.key = key","show":0,"source":5},{"id":6,"text":"        self.name = name","show":0,"source":6},{"id":7,"text":"","show":0,"source":7},{"id":8,"text":"","show":0,"source":8},{"id":9,"text":"def sequential_search(A, key, low, high):","show":0,"source":9},{"id":10,"text":"    # To Do: low부터 high까지 순차 탐색하여 인덱스 또는 None을 반환하세요.","show":0,"until":2},{"id":11,"text":"    pass","show":0,"until":2},{"id":12,"text":"    for i in range(low, high + 1):    # Sol: 양 끝을 포함한 범위를 앞에서부터 확인","show":2,"source":10},{"id":13,"text":"        if A[i].key == key:    # Sol: 현재 신청 번호와 찾을 번호를 비교","show":3,"source":11},{"id":14,"text":"            return i    # Sol: 찾은 기록의 인덱스를 반환하고 탐색 종료","show":4,"source":12},{"id":15,"text":"    return None    # Sol: 범위 안에 찾는 번호가 없으면 탐색 실패","show":5,"source":13},{"id":16,"text":"","show":0,"source":14},{"id":17,"text":"","show":0,"source":15},{"id":18,"text":"n = int(input(\"신청자 수: \"))","show":0,"source":16},{"id":19,"text":"A = []","show":0,"source":17},{"id":20,"text":"for _ in range(n):","show":0,"source":18},{"id":21,"text":"    number, name = input(\"신청 번호와 이름: \").split()","show":0,"source":19},{"id":22,"text":"    A.append(Application(int(number), name))","show":0,"source":20},{"id":23,"text":"","show":0,"source":21},{"id":24,"text":"key = int(input(\"찾을 신청 번호: \"))","show":0,"source":22},{"id":25,"text":"","show":0,"source":23},{"id":26,"text":"# To Do: 전체 목록을 탐색하고 신청자 이름과 접수 위치 또는 실패 문구를 출력하세요.","show":0,"until":6},{"id":27,"text":"pass","show":0,"until":6},{"id":28,"text":"index = sequential_search(A, key, 0, len(A) - 1)    # Sol: 전체 접수 목록에서 탐색","show":6,"source":24},{"id":29,"text":"# Sol: 인덱스 0도 성공이므로 None 여부로 실패를 구분합니다.","show":7,"source":25},{"id":30,"text":"if index is not None:","show":8,"source":26},{"id":31,"text":"    print(f\"신청자: {A[index].name}\")    # Sol: 찾은 기록의 이름 출력","show":9,"source":27},{"id":32,"text":"    print(f\"접수 위치: {index + 1}\")    # Sol: 인덱스를 1부터 시작하는 위치로 변환","show":10,"source":28},{"id":33,"text":"else:","show":11,"source":29},{"id":34,"text":"    print(\"신청 내역이 없습니다.\")    # Sol: 탐색에 실패했을 때 안내","show":12,"source":30}],"steps":[{"row":1,"source":1,"kind":"write","context":"Python / 작성 중"},{"row":12,"source":10,"kind":"write","context":"Python / 작성 중"},{"row":13,"source":11,"kind":"write","context":"Python / 작성 중"},{"row":14,"source":12,"kind":"write","context":"Python / 작성 중"},{"row":15,"source":13,"kind":"write","context":"Python / 작성 중"},{"row":28,"source":24,"kind":"write","context":"Python / 작성 중"},{"row":29,"source":25,"kind":"write","context":"Python / 작성 중"},{"row":30,"source":26,"kind":"write","context":"Python / 작성 중"},{"row":31,"source":27,"kind":"write","context":"Python / 작성 중"},{"row":32,"source":28,"kind":"write","context":"Python / 작성 중"},{"row":33,"source":29,"kind":"write","context":"Python / 작성 중"},{"row":34,"source":30,"kind":"write","context":"Python / 작성 중"}],"final":"### Solution ###\n\nclass Application:\n    def __init__(self, key, name):\n        self.key = key\n        self.name = name\n\n\ndef sequential_search(A, key, low, high):\n    for i in range(low, high + 1):    # Sol: 양 끝을 포함한 범위를 앞에서부터 확인\n        if A[i].key == key:    # Sol: 현재 신청 번호와 찾을 번호를 비교\n            return i    # Sol: 찾은 기록의 인덱스를 반환하고 탐색 종료\n    return None    # Sol: 범위 안에 찾는 번호가 없으면 탐색 실패\n\n\nn = int(input(\"신청자 수: \"))\nA = []\nfor _ in range(n):\n    number, name = input(\"신청 번호와 이름: \").split()\n    A.append(Application(int(number), name))\n\nkey = int(input(\"찾을 신청 번호: \"))\n\nindex = sequential_search(A, key, 0, len(A) - 1)    # Sol: 전체 접수 목록에서 탐색\n# Sol: 인덱스 0도 성공이므로 None 여부로 실패를 구분합니다.\nif index is not None:\n    print(f\"신청자: {A[index].name}\")    # Sol: 찾은 기록의 이름 출력\n    print(f\"접수 위치: {index + 1}\")    # Sol: 인덱스를 1부터 시작하는 위치로 변환\nelse:\n    print(\"신청 내역이 없습니다.\")    # Sol: 탐색에 실패했을 때 안내"}},{"id":"chal2","title":"도서 번호로 책 정보 찾기","tag":"도전문제 2","problemNumber":2,"statement":"**문제 상황**\n\n도서관에는 도서 번호, 제목, 대출 가능 여부가 **도서 번호의 오름차순**으로 정리되어 있습니다.\n원하는 도서를 **재귀 이진 탐색**으로 찾고 제목과 대출 상태를 안내하세요.\n목록에 도서가 있는지 확인하는 것과 그 도서를 대출할 수 있는지 확인하는 것은 서로 다른 판단입니다.\n\n**이론 코드와 연결하기**\n\n이론 교안의 「이진 탐색 알고리즘」(10쪽)에 있는 재귀 함수를 바탕으로 작성합니다.\n함수 이름과 인자 `A, key, low, high`, 가운데 인덱스 `middle`, 성공 시 인덱스와 실패 시 `None` 반환을 그대로 사용합니다.\n이 문제에서 `A[middle].key`는 가운데 도서의 번호입니다.\n\n| 항목 | 역할 |\n| --- | --- |\n| `Book(key, title, available)` | 도서 번호, 제목, 대출 가능 여부를 저장합니다. 클래스는 제공됩니다. |\n| `A[i].available` | 대출 가능하면 `True`, 대출 중이면 `False`입니다. |\n| `binary_search(A, key, low, high)` | 양 끝을 포함한 범위에서 재귀 이진 탐색을 수행해 인덱스 또는 `None`을 반환합니다. |\n\n**입출력 형식**\n\n- **입력:** 첫 줄에 도서 수, 다음 줄부터 `도서번호 제목 상태`, 마지막 줄에 찾을 도서 번호를 입력합니다.\n- 상태는 `1`이면 대출 가능, `0`이면 대출 중입니다. 제공 코드가 이를 불리언으로 변환합니다.\n- **출력:** 찾으면 `도서: 제목`을 출력한 다음 줄에 `대출 가능` 또는 `대출 중`을 출력합니다.\n- 없으면 `등록되지 않은 도서입니다.`를 한 줄 출력합니다.\n- **조건:** 도서는 1권 이상 30권 이하입니다. 등록된 번호는 서로 다르고 오름차순으로 입력됩니다. 번호는 1 이상 9999 이하의 정수이며 제목에는 공백이 없습니다. 찾는 번호는 목록에 없을 수도 있습니다.\n\n**작성 안내**\n\n1. **`binary_search()`의 본문**을 작성하세요. 교안처럼 가운데 항목을 확인하고 왼쪽 또는 오른쪽 범위에 대해 재귀 호출합니다. 범위가 남아 있지 않으면 탐색 실패입니다.\n2. **전체 목록에 대한 탐색 호출과 결과 출력**을 작성하세요. 반환값은 `index`에 저장합니다. 도서를 찾은 경우에만 제목과 대출 가능 여부를 읽습니다.\n\n클래스와 입력 처리는 제공됩니다. 함수 안에서는 출력하지 않습니다.\n반복문 방식으로 바꾸거나 리스트를 잘라 새로 만들지 않고, 인덱스 범위를 바꾸는 재귀 호출을 사용합니다.\n`in`, `index()`, `bisect`, `dict`, `set`으로 탐색을 대신하지 않습니다. 입력은 이미 정렬되어 있으므로 정렬 코드를 추가하지 않습니다.\n\n**입출력 예시**\n\n입력\n```\n5\n10 파이썬 0\n20 자료구조 1\n30 알고리즘 1\n40 네트워크 0\n50 데이터베이스 1\n20\n```\n\n출력\n```\n도서 수: 5\n도서 번호, 제목, 대출 상태: 10 파이썬 0\n도서 번호, 제목, 대출 상태: 20 자료구조 1\n도서 번호, 제목, 대출 상태: 30 알고리즘 1\n도서 번호, 제목, 대출 상태: 40 네트워크 0\n도서 번호, 제목, 대출 상태: 50 데이터베이스 1\n찾을 도서 번호: 20\n도서: 자료구조\n대출 가능\n```\n\n**왜 이진 탐색을 사용할까요?**\n\n번호가 정렬되어 있으면 가운데 도서와 비교한 결과로 다음에 확인할 범위를 줄일 수 있습니다.\n이 문제에서는 그 판단을 교안의 재귀 호출로 표현합니다.\n\n- 가운데 번호가 찾는 번호보다 크다면 오른쪽 범위를 제외해도 되는 이유는 무엇일까요? 목록이 정렬되어 있지 않아도 같은 판단을 할 수 있을까요?\n- 가운데 번호가 정답이 아니었다면, 다음 재귀 호출에 그 위치를 다시 포함할 필요가 있을까요? 탐색 범위와 종료 조건을 연결해 생각해 보세요.\n","skeleton":"class Book:\n    def __init__(self, key, title, available):\n        self.key = key\n        self.title = title\n        self.available = available\n\n\ndef binary_search(A, key, low, high):\n    # To Do: 재귀 이진 탐색으로 인덱스 또는 None을 반환하세요.\n    pass\n\n\nn = int(input(\"도서 수: \"))\nA = []\nfor _ in range(n):\n    number, title, status = input(\"도서 번호, 제목, 대출 상태: \").split()\n    A.append(Book(int(number), title, status == \"1\"))\n\nkey = int(input(\"찾을 도서 번호: \"))\n\n# To Do: 전체 목록을 탐색하고 제목과 대출 상태 또는 미등록 문구를 출력하세요.\npass\n","code":"### Solution ###\n\nclass Book:\n    def __init__(self, key, title, available):\n        self.key = key\n        self.title = title\n        self.available = available\n\n\ndef binary_search(A, key, low, high):\n    if low <= high:    # Sol: 탐색할 범위가 남아 있을 때만 확인\n        middle = (low + high) // 2    # Sol: 현재 범위의 가운데 인덱스 계산\n        if key == A[middle].key:    # Sol: 가운데 도서 번호와 찾을 번호가 같은지 확인\n            return middle    # Sol: 찾은 도서의 인덱스를 반환\n        elif key < A[middle].key:    # Sol: 찾을 번호가 더 작으면 왼쪽 범위 선택\n            return binary_search(A, key, low, middle - 1)    # Sol: 왼쪽 탐색 결과를 반환\n        else:\n            return binary_search(A, key, middle + 1, high)    # Sol: 오른쪽 탐색 결과를 반환\n    return None    # Sol: low가 high보다 커지면 탐색할 항목이 없으므로 실패\n\n\nn = int(input(\"도서 수: \"))\nA = []\nfor _ in range(n):\n    number, title, status = input(\"도서 번호, 제목, 대출 상태: \").split()\n    A.append(Book(int(number), title, status == \"1\"))\n\nkey = int(input(\"찾을 도서 번호: \"))\n\nindex = binary_search(A, key, 0, len(A) - 1)    # Sol: 전체 도서 목록에서 탐색\nif index is not None:    # Sol: 인덱스 0을 포함한 탐색 성공 처리\n    print(f\"도서: {A[index].title}\")    # Sol: 찾은 도서의 제목 출력\n    if A[index].available:    # Sol: 등록된 도서의 대출 가능 여부 확인\n        print(\"대출 가능\")    # Sol: 대출 가능한 도서 안내\n    else:\n        print(\"대출 중\")    # Sol: 이미 대출 중인 도서 안내\nelse:\n    print(\"등록되지 않은 도서입니다.\")    # Sol: 번호가 없는 경우 안내\n","imageAlt":"도서 번호가 붙은 책장과 도서관 안내 데스크","image":"assets/illustrations/d82ef4d1cd522ea5c770.webp","inputSpec":"번호순 도서 목록과 찾을 번호. 상태 1: 대출 가능, 0: 대출 중","outputSpec":"도서 제목과 대출 상태 또는 미등록 안내","cases":[{"label":"재귀 호출과 대출 가능","input":["5","10 파이썬 0","20 자료구조 1","30 알고리즘 1","40 네트워크 0","50 데이터베이스 1","20"],"expected":"도서: 자료구조\n대출 가능","fullOutput":"도서 수: 5\n도서 번호, 제목, 대출 상태: 10 파이썬 0\n도서 번호, 제목, 대출 상태: 20 자료구조 1\n도서 번호, 제목, 대출 상태: 30 알고리즘 1\n도서 번호, 제목, 대출 상태: 40 네트워크 0\n도서 번호, 제목, 대출 상태: 50 데이터베이스 1\n찾을 도서 번호: 20\n도서: 자료구조\n대출 가능","trace":[{"line":3,"kind":"line","scope":"<module>","before":{"vars":{},"frames":[],"objects":[],"output":[]},"state":{"vars":{},"frames":[],"objects":[],"output":[]}},{"line":22,"kind":"line","scope":"<module>","before":{"vars":{},"frames":[],"objects":[],"output":[]},"state":{"vars":{"n":5},"frames":[],"objects":[],"output":[]},"input":{"prompt":"도서 수: ","value":"5"}},{"line":23,"kind":"line","scope":"<module>","before":{"vars":{"n":5},"frames":[],"objects":[],"output":[]},"state":{"vars":{"n":5,"A":[]},"frames":[],"objects":[],"output":[]}},{"line":24,"kind":"line","scope":"<module>","before":{"vars":{"n":5,"A":[]},"frames":[],"objects":[],"output":[]},"state":{"vars":{"n":5,"A":[],"_":0},"frames":[],"objects":[],"output":[]}},{"line":25,"kind":"line","scope":"<module>","before":{"vars":{"n":5,"A":[],"_":0},"frames":[],"objects":[],"output":[]},"state":{"vars":{"n":5,"A":[],"_":0,"number":"10","title":"파이썬","status":"0"},"frames":[],"objects":[],"output":[]},"input":{"prompt":"도서 번호, 제목, 대출 상태: ","value":"10 파이썬 0"}},{"line":4,"kind":"call","scope":"__init__","before":{"vars":{"n":5,"A":[],"_":0,"number":"10","title":"파이썬","status":"0"},"frames":[],"objects":[],"output":[]},"state":{"vars":{"n":5,"A":[],"_":0,"number":"10","title":"파이썬","status":"0"},"frames":[{"id":2,"name":"__init__","vars":{"self":{"type":"Book"},"key":10,"title":"파이썬","available":false}}],"objects":[],"output":[]},"callId":2},{"line":5,"kind":"line","scope":"__init__","before":{"vars":{"n":5,"A":[],"_":0,"number":"10","ti  # Sol: 찾은 도서의 제목 출력","show":13,"source":32},{"id":37,"text":"    if A[index].available:    # Sol: 등록된 도서의 대출 가능 여부 확인","show":14,"source":33},{"id":38,"text":"        print(\"대출 가능\")    # Sol: 대출 가능한 도서 안내","show":15,"source":34},{"id":39,"text":"    else:","show":16,"source":35},{"id":40,"text":"        print(\"대출 중\")    # Sol: 이미 대출 중인 도서 안내","show":17,"source":36},{"id":41,"text":"else:","show":18,"source":37},{"id":42,"text":"    print(\"등록되지 않은 도서입니다.\")    # Sol: 번호가 없는 경우 안내","show":19,"source":38}],"steps":[{"row":1,"source":1,"kind":"write","context":"Python / 작성 중"},{"row":13,"source":11,"kind":"write","context":"Python / 작성 중"},{"row":14,"source":12,"kind":"write","context":"Python / 작성 중"},{"row":15,"source":13,"kind":"write","context":"Python / 작성 중"},{"row":16,"source":14,"kind":"write","context":"Python / 작성 중"},{"row":17,"source":15,"kind":"write","context":"Python / 작성 중"},{"row":18,"source":16,"kind":"write","context":"Python / 작성 중"},{"row":19,"source":17,"kind":"write","context":"Python / 작성 중"},{"row":20,"source":18,"kind":"write","context":"Python / 작성 중"},{"row":21,"source":19,"kind":"write","context":"Python / 작성 중"},{"row":34,"source":30,"kind":"write","context":"Python / 작성 중"},{"row":35,"source":31,"kind":"write","context":"Python / 작성 중"},{"row":36,"source":32,"kind":"write","context":"Python / 작성 중"},{"row":37,"source":33,"kind":"write","context":"Python / 작성 중"},{"row":38,"source":34,"kind":"write","context":"Python / 작성 중"},{"row":39,"source":35,"kind":"write","context":"Python / 작성 중"},{"row":40,"source":36,"kind":"write","context":"Python / 작성 중"},{"row":41,"source":37,"kind":"write","context":"Python / 작성 중"},{"row":42,"source":38,"kind":"write","context":"Python / 작성 중"}],"final":"### Solution ###\n\nclass Book:\n    def __init__(self, key, title, available):\n        self.key = key\n        self.title = title\n        self.available = available\n\n\ndef binary_search(A, key, low, high):\n    if low <= high:    # Sol: 탐색할 범위가 남아 있을 때만 확인\n        middle = (low + high) // 2    # Sol: 현재 범위의 가운데 인덱스 계산\n        if key == A[middle].key:    # Sol: 가운데 도서 번호와 찾을 번호가 같은지 확인\n            return middle    # Sol: 찾은 도서의 인덱스를 반환\n        elif key < A[middle].key:    # Sol: 찾을 번호가 더 작으면 왼쪽 범위 선택\n            return binary_search(A, key, low, middle - 1)    # Sol: 왼쪽 탐색 결과를 반환\n        else:\n            return binary_search(A, key, middle + 1, high)    # Sol: 오른쪽 탐색 결과를 반환\n    return None    # Sol: low가 high보다 커지면 탐색할 항목이 없으므로 실패\n\n\nn = int(input(\"도서 수: \"))\nA = []\nfor _ in range(n):\n    number, title, status = input(\"도서 번호, 제목, 대출 상태: \").split()\n    A.append(Book(int(number), title, status == \"1\"))\n\nkey = int(input(\"찾을 도서 번호: \"))\n\nindex = binary_search(A, key, 0, len(A) - 1)    # Sol: 전체 도서 목록에서 탐색\nif index is not None:    # Sol: 인덱스 0을 포함한 탐색 성공 처리\n    print(f\"도서: {A[index].title}\")    # Sol: 찾은 도서의 제목 출력\n    if A[index].available:    # Sol: 등록된 도서의 대출 가능 여부 확인\n        print(\"대출 가능\")    # Sol: 대출 가능한 도서 안내\n    else:\n        print(\"대출 중\")    # Sol: 이미 대출 중인 도서 안내\nelse:\n    print(\"등록되지 않은 도서입니다.\")    # Sol: 번호가 없는 경우 안내"}},{"id":"chal3","title":"물품 보관함의 해시 탐색","tag":"도전문제 3","problemNumber":3,"statement":"**문제 상황**\n\n영상 동아리에서 물품 번호를 이용해 보관 위치를 관리합니다.\n각 물품 번호를 **해시 테이블**에 저장한 뒤, 찾을 번호가 어느 칸에 저장되어 있는지 출력하세요.\n여기서는 실제 물품 대신 물품 번호만 저장합니다.\n\n**이론 설명과 연결하기**\n\n이론 교안 17~19쪽은 선형 조사의 삽입과 탐색을 그림으로 설명합니다.\n이번 문제에서는 그 절차를 Python 코드로 옮깁니다.\n교안처럼 해시 함수는 `h(key) = key % M`이고 테이블 크기 `M`은 13입니다.\n서로 다른 번호가 같은 해시 주소를 가지는 경우를 **충돌**이라고 합니다.\n\n| 항목 | 역할 |\n| --- | --- |\n| `table` | 길이가 13인 리스트입니다. 칸 번호는 0~12이며, 빈칸은 `None`입니다. |\n| `hash_insert(table, key)` | 물품 번호를 저장합니다. 테이블을 수정하고 반환값은 사용하지 않습니다. |\n| `hash_search(table, key)` | 물품 번호가 있으면 칸 인덱스, 없으면 `None`을 반환합니다. |\n\n**삽입과 탐색 규칙**\n\n- 물품은 입력 순서대로 삽입합니다. 해시 주소의 칸이 차 있으면 다음 칸을 차례로 조사하고, 처음 만난 빈칸에 저장합니다.\n- 12번 칸의 다음은 0번 칸입니다. 삽입과 탐색 모두 이 순서를 따릅니다.\n- 탐색은 해당 번호의 해시 주소에서 시작합니다. 같은 번호를 만나면 성공, 빈칸을 만나면 실패입니다.\n- 물품 번호는 서로 다르고 최대 12개이므로, 테이블에 항상 빈칸이 있습니다. 삭제는 수행하지 않습니다.\n\n**입출력 형식**\n\n- **입력:** 첫 줄에 물품 번호들을 공백으로 구분해 입력하고, 둘째 줄에 찾을 물품 번호를 입력합니다.\n- **출력:** 찾으면 `보관 칸: N`, 없으면 `등록되지 않은 물품입니다.`를 출력합니다. 칸 번호는 0부터 셉니다.\n- **조건:** 물품은 1개 이상 12개 이하입니다. 모든 번호는 1 이상 9999 이하의 정수입니다. 찾을 번호는 저장 목록에 없을 수도 있습니다.\n\n**작성 안내**\n\n1. **`hash_insert()`와 `hash_search()`의 본문**을 작성하세요. 각 함수 안에서 칸 수는 `M`, 조사 중인 칸 인덱스는 `i`로 사용합니다.\n2. **`numbers`의 번호들을 차례로 삽입하는 호출, `target`에 대한 탐색 호출과 결과 출력**을 작성하세요. 탐색 결과는 `index`에 저장합니다.\n\n테이블 생성과 입력 처리는 제공됩니다. 함수 안에서는 출력하지 않습니다.\n리스트 전체를 처음부터 순차 탐색하지 않고 해시 주소에서 선형 조사를 시작합니다.\n`dict`, `set`, `index()`나 물품 번호의 `in` 검사로 탐색을 대신하지 않습니다.\n\n**입출력 예시**\n\n입력\n```\n45 27 88 9 71 60 46 38 24\n46\n```\n\n출력\n```\n물품 번호(공백 구분): 45 27 88 9 71 60 46 38 24\n찾을 물품 번호: 46\n보관 칸: 11\n```\n\n**왜 해시 탐색을 사용할까요?**\n\n해시 탐색은 번호로부터 조사할 시작 위치를 계산합니다.\n충돌이 적을 때 빠른 조회를 기대할 수 있지만, 충돌이 많으면 여러 칸을 확인해야 합니다.\n\n- 같은 해시 주소를 가진 물품이 여러 개라면 시작 칸만 확인해도 원하는 번호를 찾을 수 있을까요? 삽입과 탐색의 조사 순서가 같아야 하는 이유를 생각해 보세요.\n- 서로 다른 번호들이 한 해시 주소에 몰린다면 필요한 조사 횟수는 어떻게 변할까요? 해시 탐색이 항상 한 번의 검사로 끝난다고 할 수 있을까요?\n","skeleton":"def hash_insert(table, key):\n    # To Do: 해시 주소에서 선형 조사로 빈칸을 찾아 물품 번호를 저장하세요.\n    pass\n\n\ndef hash_search(table, key):\n    # To Do: 선형 조사로 물품을 찾아 칸 인덱스 또는 None을 반환하세요.\n    pass\n\n\nM = 13\ntable = [None] * M\nnumbers = list(map(int, input(\"물품 번호(공백 구분): \").split()))\ntarget = int(input(\"찾을 물품 번호: \"))\n\n# To Do: 모든 물품을 순서대로 삽입한 뒤 target을 탐색하고 결과를 출력하세요.\npass\n","code":"### Solution ###\n\ndef hash_insert(table, key):\n    M = len(table)    # Sol: 테이블의 칸 수를 해시 주소 계산에 사용\n    i = key % M    # Sol: 물품 번호의 해시 주소 계산\n    while table[i] is not None:    # Sol: 이미 물품이 있으면 다음 칸을 조사\n        i = (i + 1) % M    # Sol: 마지막 칸 다음에는 0번 칸으로 이동\n    table[i] = key    # Sol: 처음 만난 빈칸에 물품 번호 저장\n\n\ndef hash_search(table, key):\n    M = len(table)    # Sol: 삽입할 때와 같은 테이블 크기 사용\n    i = key % M    # Sol: 삽입할 때의 시작 주소에서 탐색\n    while table[i] is not None:    # Sol: 빈칸을 만나기 전까지 확인\n        if table[i] == key:    # Sol: 현재 칸의 물품 번호와 비교\n            return i    # Sol: 찾은 칸의 인덱스 반환\n        i = (i + 1) % M    # Sol: 충돌로 뒤에 저장된 물품까지 순환 조사\n    return None    # Sol: 빈칸에 도달하면 등록되지 않은 번호\n\n\nM = 13\ntable = [None] * M\nnumbers = list(map(int, input(\"물품 번호(공백 구분): \").split()))\ntarget = int(input(\"찾을 물품 번호: \"))\n\nfor key in numbers:    # Sol: 입력된 순서대로 물품 번호를 저장\n    hash_insert(table, key)    # Sol: 충돌을 처리하며 테이블에 삽입\n\nindex = hash_search(table, target)    # Sol: 요청한 번호의 저장 위치 탐색\nif index is not None:    # Sol: 0번 칸을 포함한 탐색 성공 처리\n    print(f\"보관 칸: {index}\")    # Sol: 0부터 시작하는 실제 칸 번호 출력\nelse:\n    print(\"등록되지 않은 물품입니다.\")    # Sol: 탐색에 실패했을 때 안내\n","imageAlt":"번호표를 들고 물품 보관 위치를 문의하는 학생","image":"assets/illustrations/f9e2f16fe09339bbdd07.webp","inputSpec":"서로 다른 물품 번호 1~12개, 찾을 번호","outputSpec":"0~12 중 보관 칸 번호 또는 미등록 안내","cases":[{"label":"여러 충돌을 거친 탐색","input":["45 27 88 9 71 60 46 38 24","46"],"expected":"보관 칸: 11","fullOutput":"물품 번호(공백 구분): 45 27 88 9 71 60 46 38 24\n찾을 물품 번호: 46\n보관 칸: 11","trace":[{"line":21,"kind":"line","scope":"<module>","before":{"vars":{},"frames":[],"objects":[],"output":[]},"state":{"vars":{"M":13},"frames":[],"objects":[],"output":[]}},{"line":22,"kind":"line","scope":"<module>","before":{"vars":{"M":13},"frames":[],"objects":[],"output":[]},"state":{"vars":{"M":13,"table":[null,null,null,null,null,null,null,null,null,null,null,null,null]},"frames":[],"objects":[],"output":[]}},{"line":23,"kind":"line","scope":"<module>","before":{"vars":{"M":13,"table":[null,null,null,null,null,null,null,null,null,null,null,null,null]},"frames":[],"objects":[],"output":[]},"state":{"vars":{"M":13,"table":[null,null,null,null,null,null,null,null,null,null,null,null,null],"numbers":[45,27,88,9,71,60,46,38,24]},"frames":[],"objects":[],"output":[]},"input":{"prompt":"물품 번호(공백 구분): ","value":"45 27 88 9 71 60 46 38 24"}},{"line":24,"kind":"line","scope":"<module>","before":{"vars":{"M":13,"table":[null,null,null,null,null,null,null,null,null,null,null,null,null],"numbers":     # Sol: 요청한 번호의 저장 위치 탐색","show":16,"source":29},{"id":36,"text":"if index is not None:    # Sol: 0번 칸을 포함한 탐색 성공 처리","show":17,"source":30},{"id":37,"text":"    print(f\"보관 칸: {index}\")    # Sol: 0부터 시작하는 실제 칸 번호 출력","show":18,"source":31},{"id":38,"text":"else:","show":19,"source":32},{"id":39,"text":"    print(\"등록되지 않은 물품입니다.\")    # Sol: 탐색에 실패했을 때 안내","show":20,"source":33}],"steps":[{"row":1,"source":1,"kind":"write","context":"Python / 작성 중"},{"row":6,"source":4,"kind":"write","context":"Python / 작성 중"},{"row":7,"source":5,"kind":"write","context":"Python / 작성 중"},{"row":8,"source":6,"kind":"write","context":"Python / 작성 중"},{"row":9,"source":7,"kind":"write","context":"Python / 작성 중"},{"row":10,"source":8,"kind":"write","context":"Python / 작성 중"},{"row":16,"source":12,"kind":"write","context":"Python / 작성 중"},{"row":17,"source":13,"kind":"write","context":"Python / 작성 중"},{"row":18,"source":14,"kind":"write","context":"Python / 작성 중"},{"row":19,"source":15,"kind":"write","context":"Python / 작성 중"},{"row":20,"source":16,"kind":"write","context":"Python / 작성 중"},{"row":21,"source":17,"kind":"write","context":"Python / 작성 중"},{"row":22,"source":18,"kind":"write","context":"Python / 작성 중"},{"row":32,"source":26,"kind":"write","context":"Python / 작성 중"},{"row":33,"source":27,"kind":"write","context":"Python / 작성 중"},{"row":35,"source":29,"kind":"write","context":"Python / 작성 중"},{"row":36,"source":30,"kind":"write","context":"Python / 작성 중"},{"row":37,"source":31,"kind":"write","context":"Python / 작성 중"},{"row":38,"source":32,"kind":"write","context":"Python / 작성 중"},{"row":39,"source":33,"kind":"write","context":"Python / 작성 중"}],"final":"### Solution ###\n\ndef hash_insert(table, key):\n    M = len(table)    # Sol: 테이블의 칸 수를 해시 주소 계산에 사용\n    i = key % M    # Sol: 물품 번호의 해시 주소 계산\n    while table[i] is not None:    # Sol: 이미 물품이 있으면 다음 칸을 조사\n        i = (i + 1) % M    # Sol: 마지막 칸 다음에는 0번 칸으로 이동\n    table[i] = key    # Sol: 처음 만난 빈칸에 물품 번호 저장\n\n\ndef hash_search(table, key):\n    M = len(table)    # Sol: 삽입할 때와 같은 테이블 크기 사용\n    i = key % M    # Sol: 삽입할 때의 시작 주소에서 탐색\n    while table[i] is not None:    # Sol: 빈칸을 만나기 전까지 확인\n        if table[i] == key:    # Sol: 현재 칸의 물품 번호와 비교\n            return i    # Sol: 찾은 칸의 인덱스 반환\n        i = (i + 1) % M    # Sol: 충돌로 뒤에 저장된 물품까지 순환 조사\n    return None    # Sol: 빈칸에 도달하면 등록되지 않은 번호\n\n\nM = 13\ntable = [None] * M\nnumbers = list(map(int, input(\"물품 번호(공백 구분): \").split()))\ntarget = int(input(\"찾을 물품 번호: \"))\n\nfor key in numbers:    # Sol: 입력된 순서대로 물품 번호를 저장\n    hash_insert(table, key)    # Sol: 충돌을 처리하며 테이블에 삽입\n\nindex = hash_search(table, target)    # Sol: 요청한 번호의 저장 위치 탐색\nif index is not None:    # Sol: 0번 칸을 포함한 탐색 성공 처리\n    print(f\"보관 칸: {index}\")    # Sol: 0부터 시작하는 실제 칸 번호 출력\nelse:\n    print(\"등록되지 않은 물품입니다.\")    # Sol: 탐색에 실패했을 때 안내"}},{"id":"extra1","title":"여러 도서의 대출 가능 여부 조회","tag":"추가문제 1","problemNumber":4,"statement":"**문제 상황**\n\n도전문제 2의 도서 목록에 여러 조회 요청이 들어왔습니다.\n각 요청에 대해 도서가 등록되어 있는지, 대출 가능한지 확인하고 **대출 가능한 요청 수**를 구하세요.\n같은 번호가 여러 번 요청되면 요청마다 결과를 출력하고 각각 집계합니다.\n실제로 대출하는 프로그램은 아니므로 조회 후에도 도서 상태는 바꾸지 않습니다.\n\n**제공 코드와 사용할 자료**\n\n`Book` 클래스와 도전문제 2의 완성된 `binary_search(A, key, low, high)`가 제공됩니다.\n앞선 문제의 셀을 실행하지 않아도 이 문제를 독립적으로 실행할 수 있습니다.\n\n| 항목 | 역할 |\n| --- | --- |\n| `A` | 도서 번호 오름차순의 `Book` 객체 리스트입니다. |\n| `requests` | 입력된 순서대로 저장한 조회 번호 리스트입니다. |\n| `binary_search(A, key, low, high)` | 찾으면 인덱스, 없으면 `None`을 반환합니다. |\n| `count` | 대출 가능한 조회 요청 수를 누적합니다. |\n\n**입출력 형식**\n\n- **입력:** 첫 줄에 도서 수, 다음 줄부터 `도서번호 제목 상태`, 그다음 줄에 조회 요청 수를 입력합니다. 이후에는 조회할 번호를 한 줄에 하나씩 입력합니다.\n- 상태는 `1`이면 대출 가능, `0`이면 대출 중입니다.\n- **출력:** 요청 순서대로 `번호: 대출 가능`, `번호: 대출 중`, `번호: 미등록` 중 하나를 출력합니다.\n- 마지막 줄에는 `대출 가능한 요청 수: N`을 출력합니다.\n- **조건:** 도서와 조회 요청은 각각 1개 이상 30개 이하입니다. 도서 번호는 중복 없이 오름차순으로 입력됩니다. 모든 번호는 1 이상 9999 이하의 정수이고 제목에는 공백이 없습니다. 조회 번호는 반복되거나 목록에 없을 수 있습니다.\n\n**작성 안내**\n\n**조회 요청을 처리하는 부분 전체**를 작성하세요.\n`count`를 초기화하고 `requests`의 각 번호에 대해 제공된 이진 탐색 함수를 호출합니다.\n반환값은 `index`에 저장하고, 등록 여부와 대출 상태를 구분해 출력한 뒤 대출 가능한 요청 수를 합산하세요.\n\n클래스, 탐색 함수와 입력 처리는 수정하지 않습니다. 새로운 탐색 방법을 구현할 필요는 없습니다.\n같은 번호가 반복되어도 매번 전체 도서 목록을 대상으로 탐색하며, 목록과 대출 상태는 변경하지 않습니다.\n\n**입출력 예시**\n\n입력\n```\n3\n10 파이썬 1\n20 자료구조 0\n30 알고리즘 1\n4\n10\n20\n25\n30\n```\n\n출력\n```\n도서 수: 3\n도서 번호, 제목, 대출 상태: 10 파이썬 1\n도서 번호, 제목, 대출 상태: 20 자료구조 0\n도서 번호, 제목, 대출 상태: 30 알고리즘 1\n조회 요청 수: 4\n조회할 도서 번호: 10\n조회할 도서 번호: 20\n조회할 도서 번호: 25\n조회할 도서 번호: 30\n10: 대출 가능\n20: 대출 중\n25: 미등록\n30: 대출 가능\n대출 가능한 요청 수: 2\n```\n\n**왜 이진 탐색을 반복해서 사용할까요?**\n\n이미 정렬된 도서 목록에 여러 요청이 들어오므로 같은 탐색 함수를 요청마다 활용할 수 있습니다.\n탐색 결과를 실제 안내와 집계에 연결하는 연습입니다.\n\n- 조회 요청이 많아질 때, 목록 전체를 매번 순차 탐색하는 방법과 범위를 줄이는 방법은 어떤 차이가 있을까요? 원본이 정렬되어 있지 않다면 어떤 준비가 먼저 필요할까요?\n- 이번 집계는 대출 가능한 도서 종류 수가 아니라 요청 수입니다. 같은 번호가 반복될 때 중복을 제거하거나 도서 상태를 바꾸면 결과가 어떻게 달라질까요?\n","skeleton":"class Book:\n    def __init__(self, key, title, available):\n        self.key = key\n        self.title = title\n        self.available = available\n\n\ndef binary_search(A, key, low, high):\n    if low <= high:\n        middle = (low + high) // 2\n        if key == A[middle].key:\n            return middle\n        elif key < A[middle].key:\n            return binary_search(A, key, low, middle - 1)\n        else:\n            return binary_search(A, key, middle + 1, high)\n    return None\n\n\nn = int(input(\"도서 수: \"))\nA = []\nfor _ in range(n):\n    number, title, status = input(\"도서 번호, 제목, 대출 상태: \").split()\n    A.append(Book(int(number), title, status == \"1\"))\n\nq = int(input(\"조회 요청 수: \"))\nrequests = []\nfor _ in range(q):\n    requests.append(int(input(\"조회할 도서 번호: \")))\n\n# To Do: 요청마다 이진 탐색으로 상태를 출력하고 대출 가능한 요청 수를 합산해 출력하세요.\npass\n","code":"### Solution ###\n\nclass Book:\n    def __init__(self, key, title, available):\n        self.key = key\n        self.title = title\n        self.available = available\n\n\ndef binary_search(A, key, low, high):\n    if low <= high:\n        middle = (low + high) // 2\n        if key == A[middle].key:\n            return middle\n        elif key < A[middle].key:\n            return binary_search(A, key, low, middle - 1)\n        else:\n            return binary_search(A, key, middle + 1, high)\n    return None\n\n\nn = int(input(\"도서 수: \"))\nA = []\nfor _ in range(n):\n    number, title, status = input(\"도서 번호, 제목, 대출 상태: \").split()\n    A.append(Book(int(number), title, status == \"1\"))\n\nq = int(input(\"조회 요청 수: \"))\nrequests = []\nfor _ in range(q):\n    requests.append(int(input(\"조회할 도서 번호: \")))\n\ncount = 0    # Sol: 대출 가능한 조회 요청 수를 누적할 변수\nfor key in requests:    # Sol: 입력된 순서대로 요청을 하나씩 처리\n    index = binary_search(A, key, 0, len(A) - 1)    # Sol: 매 요청마다 전체 목록에서 탐색\n    if index is None:    # Sol: 번호가 없으면 도서 속성에 접근하지 않음\n        print(f\"{key}: 미등록\")    # Sol: 등록되지 않은 번호 안내\n    elif A[index].available:    # Sol: 찾은 도서가 대출 가능한지 확인\n        print(f\"{key}: 대출 가능\")    # Sol: 이번 요청의 조회 결과 출력\n        count += 1    # Sol: 같은 번호의 반복 요청도 각각 1회로 계산\n    else:\n        print(f\"{key}: 대출 중\")    # Sol: 등록되어 있지만 대출 중인 도서 안내\nprint(f\"대출 가능한 요청 수: {count}\")    # Sol: 대출 가능한 요청의 합계 출력\n","imageAlt":"도서관에서 여러 도서의 조회 목록을 확인하는 학생과 사서","image":"assets/illustrations/d5e3018030651cb48bc0.webp","inputSpec":"번호순 도서 목록, 요청 수, 조회할 번호들","outputSpec":"요청별 상태와 대출 가능한 요청 수. 반복 요청도 각각 집계","cases":[{"label":"세 가지 조회 결과","input":["3","10 파이썬 1","20 자료구조 0","30 알고리즘 1","4","10","20","25","30"],"expected":"10: 대출 가능\n20: 대출 중\n25: 미등록\n30: 대출 가능\n대출 가능한 요청 수: 2","fullOutput":"도서 수: 3\n도서 번호, 제목, 대출 상태: 10 파이썬 1\n도서 번호, 제목, 대출 상태: 20 자료구조 0\n도서 번호, 제목, 대출 상태: 30 알고리즘 1\n조회 요청 수: 4\n조회할 도서 번호: 10\n조회할 도서 번호: 20\n조회할 도서 번호: 25\n조회할 도서 번호: 30\n10: 대출 가능\n20: 대출 중\n25: 미등록\n30: 대출 가능\n대출 가능한 요청 수: 2","trace":[{"line":3,"kind":"line","scope":"<module>","before":{"vars":{},"frames":[],"objects":[],"output":[]},"state":{"vars":{},"frames":[],"objects":[],"output":[]}},{"line":22,"kind":"line","scope":"<module>","before":{"vars":{},"frames":[],"objects":[],"output":[]},"state":{"vars":{"n":3 d":"write","context":"Python / 작성 중"},{"row":43,"source":41,"kind":"write","context":"Python / 작성 중"},{"row":44,"source":42,"kind":"write","context":"Python / 작성 중"},{"row":45,"source":43,"kind":"write","context":"Python / 작성 중"}],"final":"### Solution ###\n\nclass Book:\n    def __init__(self, key, title, available):\n        self.key = key\n        self.title = title\n        self.available = available\n\n\ndef binary_search(A, key, low, high):\n    if low <= high:\n        middle = (low + high) // 2\n        if key == A[middle].key:\n            return middle\n        elif key < A[middle].key:\n            return binary_search(A, key, low, middle - 1)\n        else:\n            return binary_search(A, key, middle + 1, high)\n    return None\n\n\nn = int(input(\"도서 수: \"))\nA = []\nfor _ in range(n):\n    number, title, status = input(\"도서 번호, 제목, 대출 상태: \").split()\n    A.append(Book(int(number), title, status == \"1\"))\n\nq = int(input(\"조회 요청 수: \"))\nrequests = []\nfor _ in range(q):\n    requests.append(int(input(\"조회할 도서 번호: \")))\n\ncount = 0    # Sol: 대출 가능한 조회 요청 수를 누적할 변수\nfor key in requests:    # Sol: 입력된 순서대로 요청을 하나씩 처리\n    index = binary_search(A, key, 0, len(A) - 1)    # Sol: 매 요청마다 전체 목록에서 탐색\n    if index is None:    # Sol: 번호가 없으면 도서 속성에 접근하지 않음\n        print(f\"{key}: 미등록\")    # Sol: 등록되지 않은 번호 안내\n    elif A[index].available:    # Sol: 찾은 도서가 대출 가능한지 확인\n        print(f\"{key}: 대출 가능\")    # Sol: 이번 요청의 조회 결과 출력\n        count += 1    # Sol: 같은 번호의 반복 요청도 각각 1회로 계산\n    else:\n        print(f\"{key}: 대출 중\")    # Sol: 등록되어 있지만 대출 중인 도서 안내\nprint(f\"대출 가능한 요청 수: {count}\")    # Sol: 대출 가능한 요청의 합계 출력"}}]</script>
<script>
'use strict';
const lessons = JSON.parse(document.getElementById('lesson-data').textContent);
const $ = id => document.getElementById(id);
const escapeHTML = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
let typing = null;
const ui = {lesson:0,phase:'problem',buildIndex:0,traceIndex:-1,caseIndex:0,toastTimer:null,modalFocus:null};
const lesson = () => lessons[ui.lesson];
const testCase = () => lesson().cases[ui.caseIndex];
const buildStep = () => lesson().build.steps[ui.buildIndex-1] || null;
const traceStep = () => testCase().trace[ui.traceIndex] || null;
const emptyState = () => ({objects:[],frames:[],vars:{},output:[]});
const same = (a,b) => JSON.stringify(a) === JSON.stringify(b);
const pyValue = value => value && typeof value==='object' && 'ref' in value ? `객체 #${Number(value.ref)}` : value===true ? 'True' : value===false ? 'False' : value===null ? 'None' : typeof value==='string' ? `"${value}"` : Array.isArray(value) ? `[${value.map(pyValue).join(', ')}]` : value && typeof value==='object' ? `${value.type || '기록'}(${Object.entries(value).filter(([k])=>k!=='type').map(([k,v])=>`${k}=${pyValue(v)}`).join(', ')})` : String(value);
const currentRows = () => {
 const index = ui.phase==='run' ? lesson().build.steps.length : ui.buildIndex;
 return lesson().build.rows.filter(row=>row.show<=index && (row.until===undefined || index<row.until));
};
const currentCode = () => currentRows().map(row=>row.text).join('\n');

function highlight(code){
 const token=/(#[^\n]*|f?"(?:\\.|[^"\\])*"|f?'(?:\\.|[^'\\])*'|\b(?:class|def|return|if|elif|else|for|while|in|is|and|or|not|from|import|True|False|None|pass|break)\b|\bself\b|\b(?:print|input|int|list|map|len|range|deque)\b|\b\d+\b)/g;
 let html='',last=0;
 for(const match of code.matchAll(token)){
  html+=escapeHTML(code.slice(last,match.index));const value=match[0];
  const type=value.startsWith('#')?'comment':/^(f?["'])/.test(value)?'str':/^\d/.test(value)?'num':value==='self'?'self':/^(print|input|int|list|map|len|range|deque)$/.test(value)?'fn':'kw';
  html+=`<span class="${type}">${escapeHTML(value)}</span>`;last=match.index+value.length;
 }
 return html+escapeHTML(code.slice(last));
}


function introPicture(){return "";}

function renderLesson(){
 const l=lesson();
 $('lesson-title').textContent=l.title;
 $('lesson-badge').textContent=ui.lesson===3?'추가':String(ui.lesson+1).padStart(2,'0');
 $('problem-copy').innerHTML=markdown(l.statement);
 formatSentences($('problem-copy'));
 $('scene').innerHTML=`<button class="scene-trigger" type="button" aria-haspopup="dialog" aria-label="${escapeHTML(l.title)} 그림 크게 보기" title="그림 크게 보기"><img src="${l.image}" alt="${escapeHTML(l.imageAlt)}"><span class="scene-zoom" aria-hidden="true">＋</span></button>`;
 $('case-select').innerHTML=l.cases.map((c,index)=>`<option value="${index}">예제 ${index+1} / ${escapeHTML(c.label)}</option>`).join('');
 $('case-select').value=String(ui.caseIndex);
 $('problem-copy').scrollTop=0;
 renderIO();render(true);
}

function renderIO(){
 const l=lesson(),example=l.example;
 $('io-panel').innerHTML=`<p class="example-label">기본 예제 1</p><section class="io-section"><h2>입력</h2><p class="io-spec">${escapeHTML(l.inputSpec)}</p><pre class="io-example" id="input-example">${escapeHTML(example.input||'(빈 줄 입력)')}</pre></section><section class="io-section"><h2>실행 화면</h2><p class="io-spec">${escapeHTML(l.outputSpec)}</p><pre class="io-example" id="output-example">${escapeHTML(example.output)}</pre></section>`;
}

function revealExplanation(lineNumber){
 const raw=lesson().code.split('\n')[lineNumber-1].trim(),code=raw.replace(/ {4}#.*$/, '');
 if(raw.startsWith('# Sol:'))return ['구현할 역할',raw.replace('# Sol:','').trim()];
 const comment=raw.match(/ {4}# Sol: (.*)$/)?.[1];
 if(code.startsWith('def sequential_search'))return ['순차 탐색을 정의합니다','교안의 A, key, low, high를 유지합니다. 양 끝을 포함한 범위를 확인하고 인덱스 또는 None을 반환합니다.'];
 if(code.startsWith('def binary_search'))return ['재귀 이진 탐색을 정의합니다','교안처럼 가운데 번호를 비교하고 인덱스 범위를 줄여 재귀 호출합니다. 각 호출의 반환값을 호출한 곳으로 전달합니다.'];
 if(code.startsWith('def hash_insert'))return ['해시 삽입을 정의합니다','해시 주소에서 시작해 처음 만난 빈칸에 저장합니다. 테이블을 수정하고 반환값은 사용하지 않습니다.'];
 if(code.startsWith('def hash_search'))return ['해시 탐색을 정의합니다','삽입과 같은 순서로 조사합니다. 번호를 찾으면 칸 인덱스, 빈칸에 도달하면 None을 반환합니다.'];
 if(code.includes('input('))return ['입력을 읽습니다','입력 안내에 맞춰 숫자와 문자열을 읽습니다. 코드 확인에서는 실제로 읽은 값을 보여 줍니다.'];
 if(code.includes('return binary_search'))return ['줄어든 범위로 재귀 호출합니다',comment||'자식 호출이 반환한 인덱스 또는 None을 그대로 반환합니다.'];
 if(code.includes('index is not None')||code.includes('index is None'))return ['탐색 성공과 실패를 구분합니다','인덱스 0은 첫 항목 또는 0번 칸을 찾은 정상 결과입니다. None인 경우와 구분합니다.'];
 if(code.includes('(i + 1) % M'))return ['다음 조사 위치로 이동합니다','12번 칸 다음에는 0번 칸으로 돌아갑니다. 삽입과 탐색에서 같은 순서를 따릅니다.'];
 if(code==='return None')return ['탐색 실패를 반환합니다',comment||'지정한 범위에서 찾지 못했으므로 None을 호출한 곳으로 전달합니다.'];
 if(code.startsWith('return '))return ['찾은 위치를 반환합니다',comment||'위치는 0부터 시작하는 인덱스입니다. 출력 형식은 호출부에서 결정합니다.'];
 if(code.startsWith('if ')||code.startsWith('elif ')||code.startsWith('while '))return ['조건을 확인합니다',comment||'현재 변수로 조건을 평가합니다. 다음 단계는 실제로 선택된 분기입니다.'];
 if(code.startsWith('for '))return ['다음 항목을 처리합니다',comment||'반복 범위의 항목을 하나씩 처리하고, 끝나면 반복문 밖으로 이동합니다.'];
 if(code.startsWith('print('))return ['문제 조건에 맞춰 출력합니다',comment||'조회 결과를 지정된 문구로 출력합니다.'];
 if(code.includes('count += 1'))return ['대출 가능한 요청을 집계합니다','도서 종류 수가 아니라 요청 수를 셉니다. 같은 번호를 다시 조회해도 별도의 요청입니다.'];
 if(code==='count = 0')return ['집계를 시작합니다','대출 가능한 요청 수를 0으로 초기화합니다.'];
 if(code.includes('hash_insert(')||code.includes('hash_search(')||code.includes('sequential_search(')||code.includes('binary_search('))return ['탐색 관련 함수를 호출합니다',comment||'함수 호출과 반환을 따라 결과가 호출부에 전달되는 과정을 확인합니다.'];
 if(code.startsWith('class '))return ['기록의 자료형을 준비합니다','객체의 key가 탐색 기준이며 나머지 속성은 찾은 뒤 안내할 정보입니다.'];
 if(code.startsWith('def __init__')||code.startsWith('self.'))return ['객체의 속성을 저장합니다','번호와 이름 또는 제목, 대출 상태를 하나의 기록에 보관합니다.'];
 if(code.includes('A.append'))return ['기록을 목록에 추가합니다','제공된 입력 처리입니다. 순차 탐색은 접수 순서, 이진 탐색은 번호 오름차순을 유지합니다.'];
 if(code.includes('requests.append'))return ['조회 요청을 저장합니다','같은 번호가 여러 번 들어와도 입력된 순서대로 모두 저장합니다.'];
 if(comment)return ['현재 줄의 역할',comment];
 if(code.startsWith('#'))return ['작성 범위를 확인합니다','제공 코드를 유지하면서 학생 작성 부분을 완성합니다.'];
 return ['변수에 값을 저장합니다','현재 코드 줄과 값의 변화를 함께 확인하세요. 입력 준비와 탐색 처리는 구분해서 살펴봅니다.'];
}
function buildExplanation(){
 const step=buildStep();
 return step?revealExplanation(step.source):['학생용 코드에서 시작합니다','제공된 클래스와 입력 코드를 유지하고, 탐색 함수와 응용 처리의 pass를 차례로 채웁니다.'];
}
function traceExplanation(step){
 if(step.input)return ['입력값을 읽었습니다',`${step.input.prompt}${step.input.value || '(빈 줄)'}`];
 if(step.kind==='call')return ['함수를 호출합니다',step.scope==='binary_search'?'새 재귀 호출의 low와 high를 확인하세요. 이전 호출은 결과를 기다립니다.':`${step.scope}()에 전달된 인자와 현재 상태를 확인하세요.`];

function keepCodeLineVisible(line){
 const container=$('code-scroll');

 if(top<container.scrollTop+16||bottom>container.scrollTop+container.clientHeight-16)container.scrollTop=Math.max(0,top-Math.min(container.clientHeight*.27,70));

function finishTyping(){
 if(!typing)return;

 cancelAnimationFrame(animation.frame);
 animation.text.innerHTML=highlight(animation.fullText);
 animation.text.classList.remove('typing');
 animation.text.style.minHeight='';
 $('code-scroll').setAttribute('aria-busy','false');

}

function typeCodeLine(line,fullText){
 if(!line||window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const text=line.querySelector('.line-text');
 const indent=fullText.match(/^\s*/)[0],characters=Array.from(fullText.slice(indent.length));
 if(!characters.length)return;
 // Reserve the wrapped line's height so following code stays in place.
 text.style.minHeight=text.getBoundingClientRect().height+'px';
 text.innerHTML=highlight(indent);text.classList.add('typing');
 $('code-scroll').setAttribute('aria-busy','true');
 const animation={line,text,fullText,frame:0,count:0,started:performance.now()};
 typing=animation;
 const duration=Math.min(1100,Math.max(250,characters.length*18));
 function tick(now){
  if(typing!==animation)return;
  const count=Math.min(characters.length,Math.floor((now-animation.started)/duration*characters.length)+1);
  if(count!==animation.count){
   animation.count=count;text.innerHTML=highlight(indent+characters.slice(0,count).join(''));
   keepCodeLineVisible(line);
  }
  if(count===characters.length)finishTyping();
  else animation.frame=requestAnimationFrame(tick);
 }
 animation.frame=requestAnimationFrame(tick);
}

function formatSentences(root){
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
 const nodes=[];

  const node=walker.currentNode,parent=node.parentElement;

 for(const node of nodes){
  const lines=node.textContent.replace(/([.!?。！？]["'’”)\]]*)[ \t\r\n]+/g,'$1\n').split('\n');
  if(lines.length<2)continue;
  const fragment=document.createDocumentFragment();
  lines.forEach((line,index)=>{if(index)fragment.append(document.createElement('br'));fragment.append(document.createTextNode(line))});
  node.replaceWith(fragment);
 }
}

function markdown(source){
 const inline=value=>escapeHTML(value).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>');
 const lines=source.split('\n');
 let html='',paragraph=[];
 const flush=()=>{if(paragraph.length){html+=`<p>${inline(paragraph.join(' '))}</p>`;paragraph=[]}};
 for(let index=0;index<lines.length;index++){
  const line=lines[index].trim();
  if(!line){flush();continue}
  if(line.startsWith('```')){
   flush();const code=[];
   while(++index<lines.length&&!lines[index].startsWith('```'))code.push(lines[index]);
   html+=`<pre>${escapeHTML(code.join('\n'))}</pre>`;continue;
  }
  if(line.startsWith('|')){
   flush();const rows=[];
   while(index<lines.length&&lines[index].trim().startsWith('|')){
    const row=lines[index++].trim();
    if(!/^\|[\s:|\-]+\|$/.test(row))rows.push(row.split('|').slice(1,-1));
   }
   index--;
   html+='<table><thead><tr>'+rows[0].map(cell=>`<th scope="col">${inline(cell.trim())}</th>`).join('')+'</tr></thead><tbody>';
   html+=rows.slice(1).map(row=>'<tr>'+row.map(cell=>`<td>${inline(cell.trim())}</td>`).join('')+'</tr>').join('')+'</tbody></table>';continue;
  }
  if(/^\d+\. /.test(line)){
   flush();html+='<ol>';
   while(index<lines.length&&/^\d+\. /.test(lines[index].trim()))html+=`<li>${inline(lines[index++].trim().replace(/^\d+\. /,''))}</li>`;
   index--;html+='</ol>';continue;
  }
  if(line.startsWith('- ')){
   flush();html+='<ul>';
   while(index<lines.length&&lines[index].trim().startsWith('- '))html+=`<li>${inline(lines[index++].trim().slice(2))}</li>`;
   index--;html+='</ul>';continue;
  }
  if(/^#{1,3} /.test(line)||/^\*\*.+\*\*$/.test(line)){
   flush();html+=`<h3>${inline(line.replace(/^#+ /,''))}</h3>`;continue;
  }
  paragraph.push(line);
 }
 flush();return html;
}

async function copyCode(){
 finishTyping();
 const source=currentCode();let copied=false;
 if(navigator.clipboard?.writeText){try{await navigator.clipboard.writeText(source);copied=true}catch(error){/* A file URL may require the local fallback. */}}
 if(!copied){
  const area=document.createElement('textarea'),focused=document.activeElement;
  area.value=source;area.setAttribute('readonly','');area.style.cssText='position:fixed;left:-10000px;top:0';
  document.body.append(area);area.select();
  try{copied=document.execCommand('copy')}catch(error){copied=false}
  area.remove();focused?.focus();
 }
 if(copied)toast('화면의 코드와 주석을 복사했습니다.');
 else openModal('코드 직접 복사',`<p>코드를 선택한 뒤 Ctrl+C 또는 ⌘C를 눌러 주세요.</p><textarea aria-label="복사할 코드" readonly>${escapeHTML(source)}</textarea>`);
}

async function toggleFullscreen(){
 try{
  if(document.fullscreenElement){await document.exitFullscreen();return}
  if(document.documentElement.requestFullscreen){await document.documentElement.requestFullscreen();return}
 }catch(error){/* Fall back to a larger presentation area when fullscreen is unavailable. */}
 document.body.classList.toggle('focus-screen');
 toast(document.body.classList.contains('focus-screen')?'F 또는 Esc를 누르면 원래 화면으로 돌아갑니다.':'원래 화면으로 돌아왔습니다.');
}

$('next-button').addEventListener('click',next);
$('previous-button').addEventListener('click',previous);
$('copy-button').addEventListener('click',copyCode);
$('restart-button').addEventListener('click',restartPhase);
$('menu-button').addEventListener('click',showMenu);
$('scene').addEventListener('click',event=>{if(event.target.closest('.scene-trigger'))showPicture()});
$('fullscreen-button').addEventListener('click',toggleFullscreen);
$('close-modal').addEventListener('click',closeModal);
$('modal-backdrop').addEventListener('click',event=>{if(event.target===$('modal-backdrop'))closeModal()});
document.querySelectorAll('[data-phase]').forEach(button=>button.addEventListener('click',()=>setPhase(button.dataset.phase)));
$('case-select').addEventListener('change',event=>{ui.caseIndex=Number(event.target.value);ui.traceIndex=-1;renderIO();render(true)});
$('modal-content').addEventListener('click',event=>{
 const choice=event.target.closest('[data-lesson]');
 if(choice){closeModal();changeLesson(Number(choice.dataset.lesson))}
 if(event.target.closest('#reset-lesson')){closeModal();changeLesson(ui.lesson)}
 if(event.target.closest('#help-button'))showHelp();
});
document.addEventListener('fullscreenchange',()=>$('fullscreen-button').setAttribute('aria-label',document.fullscreenElement?'전체 화면 종료':'전체 화면'));
document.addEventListener('keydown',event=>{
 if(event.key==='Escape'){closeModal();document.body.classList.remove('focus-screen');return}
 if(!$('modal-backdrop').hidden){
  if(event.key==='Tab'){
   const focusable=[...$('modal').querySelectorAll('button,textarea,select,a[href],[tabindex="0"]')].filter(element=>!element.disabled&&!element.hidden);
   const first=focusable[0],last=focusable.at(-1);
   if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus()}
   else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus()}
  }
  return;
 }
 if(event.altKey||event.ctrlKey||event.metaKey||event.isComposing||event.repeat)return;
 if(event.target.closest('select,input,textarea,[contenteditable="true"]'))return;
 if(event.target.closest('button,a[href]')&&[' ','Enter'].includes(event.key))return;
 if(['ArrowRight',' '].includes(event.key)){event.preventDefault();next()}
 else if(event.key==='ArrowLeft'){event.preventDefault();previous()}
 else if(event.key==='PageDown'){event.preventDefault();changeLesson(ui.lesson+1)}
 else if(event.key==='PageUp'){event.preventDefault();changeLesson(ui.lesson-1)}
 else if(/^[1-4]$/.test(event.key)){event.preventDefault();changeLesson(Number(event.key)-1)}
 else if(event.key.toLowerCase()==='f'){event.preventDefault();toggleFullscreen()}
 else if(event.key==='?'){event.preventDefault();showHelp()}
});
renderLesson();

</script>
