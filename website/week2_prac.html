<!-- Course loading screen: keep before embedded fonts and lesson data. -->
<style id="page-loader-style">
#page-loader{display:none;position:fixed;inset:0;z-index:10000;place-content:center;justify-items:center;gap:24px;background:#fafbf8;color:#245e4f;font:500 16px/1.5 system-ui,sans-serif;letter-spacing:-.3px}
html.page-is-loading #page-loader{display:grid}
html.page-is-loading{overflow:hidden}
#page-loader .loading-mark{display:grid;grid-template-columns:26px 26px;grid-template-rows:26px 26px;gap:8px}
#page-loader .loading-tile{position:relative;border-radius:6px;background:#c4d8b0;overflow:hidden}
#page-loader .loading-tile:nth-child(3){grid-area:2/2;background:#70945b}
#page-loader .loading-tile:nth-child(4){grid-area:2/1}
#page-loader .loading-tile::after{content:"";position:absolute;inset:0;background:#245e4f;opacity:0;animation:loading-clockwise 1.2s linear infinite;will-change:opacity}
#page-loader .loading-tile:nth-child(2)::after{animation-delay:-.9s}
#page-loader .loading-tile:nth-child(3)::after{animation-delay:-.6s}
#page-loader .loading-tile:nth-child(4)::after{animation-delay:-.3s}
#page-loader p{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@keyframes loading-clockwise{0%,20%,100%{opacity:1}25%,95%{opacity:0}}
@media(prefers-reduced-motion:reduce){#page-loader .loading-tile::after{animation:none;will-change:auto}#page-loader .loading-tile:first-child::after{opacity:1}}
</style>
<script>
(() => {
  const root = document.documentElement;
  let navigationTimer;
  let navigating = false;
  const setLoading = active => {
    root.classList.toggle('page-is-loading', active);
    root.setAttribute('aria-busy', String(active));
    document.querySelectorAll('.deck,.container').forEach(el => { el.inert = active; });
  };
  const finish = () => { clearTimeout(navigationTimer); navigating = false; setLoading(false); };
  setLoading(true);
  document.addEventListener('DOMContentLoaded', async () => {
    setLoading(true);
    const assets = [...document.images].map(img => img.decode().catch(() => {}));
    if (document.fonts) assets.push(document.fonts.ready);
    let assetTimer;
    await Promise.race([Promise.allSettled(assets), new Promise(resolve => { assetTimer = setTimeout(resolve, 8000); })]);
    clearTimeout(assetTimer);
    requestAnimationFrame(() => requestAnimationFrame(() => { if (!navigating) finish(); }));
  }, {once:true});
  window.addEventListener('pageshow', event => { if (event.persisted) finish(); });
  window.addEventListener('pagehide', () => clearTimeout(navigationTimer));
  window.navigateWithCourseLoader = (destination, replace = false) => {
    navigating = true;
    setLoading(true);
    clearTimeout(navigationTimer);
    navigationTimer = setTimeout(finish, 15000);
    requestAnimationFrame(() => setTimeout(() => location[replace ? 'replace' : 'assign'](destination), 0));
  };
  document.addEventListener('click', event => {
    const link = event.target.closest('a[href]');
    if (!link || event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey || link.hasAttribute('download') || (link.target && link.target !== '_self')) return;
    const destination = new URL(link.href, location.href);
    if (destination.origin !== location.origin || !/\/(?:main|week\d+_prac)\.html$/.test(destination.pathname)) return;
    event.preventDefault();
    window.navigateWithCourseLoader(destination.href);
  });
})();
</script>

량을 각각 한 줄\n- **출력:** 재입고할 상품의 번호, 상품명, 재고 수량을 여러 줄\n- **조건:** 상품명과 재고 수량의 개수는 같고 1개 이상입니다. 상품명에는 공백이 없고 서로 다르며, 재고와 기준 수량은 0 이상의 정수입니다. 재입고할 상품이 없으면 안내 문장을 출력합니다.\n\n**입력 예시**\n```\n샌드위치 주스 쿠키 생수\n3 0 7 2\n2\n```\n\n**출력 예시**\n```\n상품명을 입력하세요: 샌드위치 주스 쿠키 생수\n재고 수량을 입력하세요: 3 0 7 2\n재입고 기준을 입력하세요: 2\n1. 주스: 0개\n2. 생수: 2개\n```","skeleton":"def make_restock_report(items, stocks, limit):\n    # zip으로 상품명과 재고를 묶고, 기준 이하인 상품만 딕셔너리에 담으세요.\n    low_stock = {\n        ______: ______\n        for ______, ______ in ______\n        if ______\n    }\n\n    lines = []\n\n    # enumerate를 사용해 1번부터 번호를 붙인 문장을 lines에 추가하세요.\n    for number, (item, stock) in ______:\n        lines.append(______)\n\n    if len(lines) == 0:\n        return \"재입고할 상품이 없습니다.\"\n\n    return ______\n\n\nitems = input(\"상품명을 입력하세요: \").split()\nstocks = ______\nlimit = ______\n\nprint(make_restock_report(items, stocks, limit))","code":"def make_restock_report(items, stocks, limit):\n    # 상품명과 재고를 묶고, 기준 이하인 상품만 딕셔너리에 담습니다.\n    low_stock = {\n        item: stock  # Sol: 상품명을 키, 재고를 값으로 저장합니다.\n        for item, stock in zip(items, stocks)  # Sol: 같은 위치의 상품명과 재고를 묶습니다.\n        if stock <= limit  # Sol: 재고가 기준 이하인지 확인합니다.\n    }\n\n    lines = []\n\n    # 재입고할 상품에 1번부터 번호를 붙입니다.\n    for number, (item, stock) in enumerate(low_stock.items(), start=1):  # Sol: 번호와 상품 정보를 함께 순회합니다.\n        lines.append(f\"{number}. {item}: {stock}개\")  # Sol: 상품 하나의 출력 문장을 만듭니다.\n\n    if len(lines) == 0:\n        return \"재입고할 상품이 없습니다.\"\n\n    return \"\\n\".join(lines)  # Sol: 문장들을 줄바꿈으로 연결합니다.\n\n\nitems = input(\"상품명을 입력하세요: \").split()\nstocks = list(map(int, input(\"재고 수량을 입력하세요: \").split()))  # Sol: 재고를 정수 리스트로 변환합니다.\nlimit = int(input(\"재입고 기준을 입력하세요: \"))  # Sol: 기준 수량을 정수로 변환합니다.\n\nprint(make_restock_report(items, stocks, limit))","image":"assets/illustrations/2676ac90035239a76cf4.webp","inputSpec":"공백으로 구분된 상품명들, 재고 수량들, 재입고 기준 수량을 각각 한 줄","outputSpec":"재입고할 상품의 번호, 상품명, 재고 수량을 여러 줄","example":{"input":"샌드위치 주 니다.\nlimit = int(input(\"재입고 기준을 입력하세요: \"))  # Sol: 기준 수량을 정수로 변환합니다.\n\nprint(make_restock_report(items, stocks, limit))"}},{"id":"books","badge":"03","problemNumber":3,"extra":false,"title":"희망 도서 우선구매 목록","concept":"filter와 정렬 기준","statement":"**문제 상황**\n\n교내 도서관은 학생들이 신청한 희망 도서 중 표를 많이 받은 책부터 구매하려고 합니다.  \n최소 표 수 이상을 받은 도서만 남기고, 표가 많은 순서대로 정렬해 우선구매 목록을 만들어 보세요.  \n표 수가 같다면 도서명 오름차순으로 정렬합니다.\n\n**입출력 형식**\n- **입력:** 공백으로 구분된 도서명들, 각 도서의 표 수, 최소 표 수를 각각 한 줄\n- **출력:** 순위, 도서명, 표 수를 여러 줄\n- **조건:** 도서명과 표 수의 개수는 같고 1개 이상입니다. 도서명에는 공백이 없고 표 수는 0 이상의 정수입니다. 기준을 만족하는 도서가 없으면 안내 문장을 출력합니다.\n\n**입력 예시**\n```\n파이썬입문 자료구조 알고리즘\n12 20 20\n10\n```\n\n**출력 예시**\n```\n도서명을 입력하세요: 파이썬입문 자료구조 알고리즘\n신청 표 수를 입력하세요: 12 20 20\n최소 표 수를 입력하세요: 10\n1위 알고리즘 (20표)\n2위 자료구조 (20표)\n3위 파이썬입문 (12표)\n```","skeleton":"def make_book_ranking(titles, votes, minimum_votes):\n    # 도서명과 표 수를 같은 위치끼리 묶으세요.\n    records = list(______)\n\n    # filter와 lambda로 최소 표 수 이상인 도서만 남기세요.\n    selected = list(filter(\n        ______,\n        ______,\n    ))\n\n    # 표 수 내림차순, 도서명 오름차순으로 정렬하세요.\n    ranked = sorted(\n        ______,\n        key=______,\n    )\n\n    lines = []\n\n    # enumerate를 사용해 순위를 붙인 문장을 만드세요.\n    for rank, (title, vote) in ______:\n        lines.append(______)\n\n    if ______:\n        return \"우선구매할 도서가 없습니다.\"\n\n    return ______\n\n\ntitles = input(\"도서명을 입력하세요: \").split()\nvotes = ______\nminimum_votes = ______\n\nprint(make_book_ranking(titles, votes, minimum_votes))","code":"def make_book_ranking(titles, votes, minimum_votes):\n    # 도서명과 표 수를 같은 위치끼리 묶습니다.\n    records = list(zip(titles, votes))  # Sol: 두 리스트의 같은 위치에 있는 값을 튜플로 묶습니다.\n\n    # 최소 표 수 이상인 도서만 남깁니다.\n    selected = list(filter(\n        lambda record: record[1] >= minimum_votes,  # Sol: 표 수가 기준 이상인지 검사합니다.\n        records,\n    ))\n\n    # 표 수 내림차순, 도서명 오름차순으로 정렬합니다.\n    ranked = sorted(\n        selected,\n        key=lambda record: (-record[1], record[0]),  # Sol: 표 수에는 음수를 사용하고 도서명은 그대로 사용합니다.\n    )\n\n    lines = []\n\n    # 정렬된 도서에 1위부터 순위를 붙입니다.\n    for rank, (title, vote) in enumerate(ranked, start=1):  # Sol: 순위와 도서 정보를 함께 순회합니다.\n        lines.append(f\"{rank}위 {title} ({vote}표)\")  # Sol: 도서 하나의 순위 문장을 만듭니다.\n\n    if len(lines) == 0:  # Sol: 기준을 만족한 도서가 없는지 확인합니다.\n        return \"우선구매할 도서가 없습니다.\"\n\n    return \"\\n\".join(lines)  # Sol: 순위 문장들을 줄바꿈으로 연결합니다.\n\n\ntitles = input(\"도서명을 입력하세요: \").split()\nvotes = list(map(int, input(\"신청 표 수를 입력하세요: \").split()))  # Sol: 표 수를 정수 리스트로 변환합니다.\nminimum_votes = int(input(\"최소 표 수를 입력하세요: \"))  # Sol: 최소 표 수를 정수로 변환합니다.\n\nprint(make_book_ranking(titles, votes, minimum_votes))","image":"assets/illustrations/3b5c6f67cf890f32850d.webp","inputSpec":"공백으로 구분된 도서명들, 각 도서의 표 수, 최소 표 수를 각각 한 줄","outputSpec":"순위, 도서명, 표 수를 여러 줄","example":{"input":"파이썬입문 자료구조 알고리즘\n12 20 20\n10","output":"도서명을 입력하세요: 파이썬입문 자료구조 알고리즘\n신청 표 수를 입력하세요: 12 20 20\n최소 표 수를 입력하세요: 10\n1위 알고리즘 (20표)\n2위 자료구조 (20표)\n3위 파이썬입문 (12표)"},"cases":[{"label":"동점 도서 정렬","input":["파이썬입문 자료구조 알고리즘","12 20 20","10"],"expected":"1위 알고리즘 (20표)\n2위 자료구조 (20표)\n3위 파이썬입문 (12표)","trace":[{"line":1,"sourceLine":1,"kind":"define","scope":"<module>","value":null,"before":{"vars":{},"frames":[],"objects":[],"output":[],"inputUsed":0},"state":{"vars":{},"types":{},"frames":[],"objects":[],"output":[],"inputUsed":0}},{"line":29,"sourceLine":29,"kind":"line","scope":"<module>","value":null,"before":{"vars":{},"types":{},"frames":[],"objects":[],"output":[],"inputUsed":0},"state":{"vars":{"titles":["파이썬입문","자료구조","알고리즘"]},"types":{},"frames":[],"objects":[],"output":[],"inputUsed":1}},{"line":30,"sourceLine":30,"kind":"line","scope":"<module>","value":null,"before":{"vars":{"titles":["파이썬입문","자료구조","알고리즘"]},"types":{},"frames":[],"objects":[],"output":[],"inputUsed":1},"state":{"vars":{"titles":["파이썬입문","자료구조","알고리즘"],"votes":[12,20,20]},"types":{},"frames":[],"objects":[],"output":[],"inputUsed":2}},{"line":31,"sourceLine":31,"kind":"line","scope":"<module>","value" ines = []\n\n    # 정렬된 도서에 1위부터 순위를 붙입니다.\n    for rank, (title, vote) in enumerate(ranked, start=1):  # Sol: 순위와 도서 정보를 함께 순회합니다.\n        lines.append(f\"{rank}위 {title} ({vote}표)\")  # Sol: 도서 하나의 순위 문장을 만듭니다.\n\n    if len(lines) == 0:  # Sol: 기준을 만족한 도서가 없는지 확인합니다.\n        return \"우선구매할 도서가 없습니다.\"\n\n    return \"\\n\".join(lines)  # Sol: 순위 문장들을 줄바꿈으로 연결합니다.\n\n\ntitles = input(\"도서명을 입력하세요: \").split()\nvotes = list(map(int, input(\"신청 표 수를 입력하세요: \").split()))  # Sol: 표 수를 정수 리스트로 변환합니다.\nminimum_votes = int(input(\"최소 표 수를 입력하세요: \"))  # Sol: 최소 표 수를 정수로 변환합니다.\n\nprint(make_book_ranking(titles, votes, minimum_votes))"}},{"id":"average","badge":"04","problemNumber":4,"extra":false,"title":"안전한 조별 평균 계산기","concept":"try-except-else","statement":"**문제 상황**\n\n한 조의 활동 점수들을 입력받아 평균을 계산하려고 합니다.  \n정상 입력이면 평균을 소수점 첫째 자리까지 출력하고, 잘못된 입력은 예외 종류에 맞는 오류 문장으로 안내해 보세요.\n\n**입출력 형식**\n- **입력:** 공백으로 구분된 점수들을 한 줄에 입력\n- **출력:** 정상 입력이면 평균, 잘못된 입력이면 오류 문장\n- **조건:** 점수는 정수입니다. 정수가 아닌 값은 `ValueError`, 빈 입력은 평균 계산 중 발생하는 `ZeroDivisionError`로 처리합니다. `try-except-else`를 사용하세요.\n\n**입력 예시**\n```\n80 90 100\n```\n\n**출력 예시**\n```\n점수를 입력하세요: 80 90 100\n평균: 90.0점\n```","skeleton":"try:\n    # map으로 입력값을 정수 리스트로 변환하세요.\n    scores = ______\n\n    # sum과 len을 사용해 평균을 계산하세요.\n    average = ______ / ______\nexcept ______:\n    print(\"입력 오류: 점수는 정수로 입력하세요.\")\nexcept ______:\n    print(\"입력 오류: 점수를 한 개 이상 입력하세요.\")\nelse:\n    print(f\"평균: {______:.1f}점\")","code":"try:\n    scores = list(map(int, input(\"점수를 입력하세요: \").split()))  # Sol: 입력값을 정수 리스트로 변환합니다.\n    average = sum(scores) / len(scores)  # Sol: 점수 합계를 점수 개수로 나눕니다.\nexcept ValueError:  # Sol: 정수가 아닌 입력에서 발생하는 예외를 처리합니다.\n    print(\"입력 오류: 점수는 정수로 입력하세요.\")\nexcept ZeroDivisionError:  # Sol: 빈 점수 목록의 평균을 계산할 때 발생하는 예외를 처리합니다.\n    print(\"입력 오류: 점수를 한 개 이상 입력하세요.\")\nelse:\n    print(f\"평균: {average:.1f}점\")  # Sol: 예외가 없을 때 평균을 소수점 첫째 자리까지 출력합니다.","image":"assets/illustrations/c038ad6bd60ec1e52138.webp","inputSpec":"공백으로 <script>
'use strict';
const WEEK = 2;
const lessons = JSON.parse(document.getElementById('lesson-data').textContent);
const $ = id => document.getElementById(id);
const escapeHTML = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
let typing = null;
const ui = {lesson:0,phase:'problem',buildIndex:0,traceIndex:-1,caseIndex:0,toastTimer:null,modalFocus:null};
const lesson = () => lessons[ui.lesson];
const testCase = () => lesson().cases[ui.caseIndex];
const buildStep = () => lesson().build.steps[ui.buildIndex-1] || null;
const traceStep = () => testCase().trace[ui.traceIndex] || null;
const emptyState = () => ({objects:[],frames:[],vars:{},output:[]});
const same = (a,b) => JSON.stringify(a) === JSON.stringify(b);
const pyValue = (value,hint) => value===true?'True':value===false?'False':value===null?'None':typeof value==='string'?JSON.stringify(value):Array.isArray(value)?(hint?.kind==='tuple'?'(':'[')+value.map((v,i)=>pyValue(v,hint?.items?.[i])).join(', ')+(hint?.kind==='tuple'?(value.length===1?',)':')'):']'):value&&typeof value==='object'?value.errorType?value.errorType+'('+JSON.stringify(value.message)+')':'{'+Object.entries(value).map(([k,v])=>JSON.stringify(k)+': '+pyValue(v)).join(', ')+'}':String(value);
const currentRows = () => {
 const index = ui.phase==='run' ? lesson().build.steps.length : ui.buildIndex;
 return lesson().build.rows.filter(row=>row.show<=index && (row.until===undefined || index<row.until));
};
const currentCode = () => currentRows().map(row=>row.text).join('\n');

function highlight(code){
 const token=/(#[^\n]*|f?"(?:\\.|[^"\\])*"|f?'(?:\\.|[^'\\])*'|\b(?:class|def|return|if|elif|else|for|while|in|is|not|or|and|try|except|raise|as|lambda|True|False|None|pass)\b|\bself\b|\b(?:print|input|int|str|list|dict|tuple|map|filter|zip|enumerate|sorted|sum|len|range|ValueError|ZeroDivisionError)\b|\b\d+\b)/g;
 let html='',last=0;
 for(const match of code.matchAll(token)){
  html+=escapeHTML(code.slice(last,match.index));const value=match[0];
  const type=value.startsWith('#')?'comment':/^(f?["'])/.test(value)?'str':/^\d/.test(value)?'num':value==='self'?'self':/^(print|input|int|str|list|dict|tuple|map|filter|zip|enumerate|sorted|sum|len|range|ValueError|ZeroDivisionError)$/.test(value)?'fn':'kw';
  html+=`<span class="${type}">${escapeHTML(value)}</span>`;last=match.index+value.length;
 }
 return html+escapeHTML(code.slice(last));
}

function introPicture(){
 if(lesson().id==='syntax')return `<div class="flow-caption">의도된 오류 예제</div><div class="syntax-card"><span>문자열을 여는 따옴표</span><pre>print(<mark>'</mark>안녕하세요)</pre><p>문자열을 닫는 따옴표가 없어 코드를 실행하기 전에 멈춥니다.</p></div><div class="flow-arrow" aria-hidden="true">↓</div><div class="syntax-card corrected"><span>수정한 예시</span><pre>print('안녕하세요<mark>'</mark>)</pre><p>여는 따옴표와 같은 종류로 닫아 주세요.</p></div><figcaption class="concept-summary">코드 확인에서는 원본의 오류를 재현합니다.</figcaption>`;
 return `<div class="flow-caption">첫 실습의 흐름</div><ol class="elice-flow"><li><b>01</b><div><h2>문제를 읽고</h2><p>입력, 출력, 조건을 확인합니다.</p></div></li><li><b>02</b><div><h2>직접 실행하고</h2><p>입력한 값과 결과를 비교합니다.</p></div></li><li><b>03</b><div><h2>제출하고</h2><p>공개/비공개 테스트 결과를 확인합니다.</p></div></li><li><b>04</b><div><h2>피드백을 반영합니다</h2><p>막힌 부분은 조교와 튜터에게 질문하세요.</p></div></li></ol><figcaption class="concept-summary">문제 풀이는 <strong>Elice</strong>에서 진행합니다.</figcaption>`;
}


function renderLesson(){
 const l=lesson(),intro=!l.image;
 $('problem-screen').classList.toggle('intro-screen',intro);
 $('scene').classList.toggle('concept-scene',intro);
 if(intro)$('scene').setAttribute('tabindex','0');else $('scene').removeAttribute('tabindex');
 $('lesson-title').textContent=l.title;
 $('lesson-badge').textContent=l.badge;
 $('problem-copy').innerHTML=markdown(l.statement);
 formatSentences($('problem-copy'));
 $('scene').innerHTML=l.image?`<button class="scene-trigger" type="button" aria-haspopup="dialog" aria-label="${escapeHTML(l.title)} 그림 크게 보기" title="그림 크게 보기"><img src="${l.image}" alt="${escapeHTML(l.title)}의 상황 그림"><span class="scene-zoom" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5M8 10.5h5M10.5 8v5"/></svg></span></button>`:introPicture();
 $('case-select').innerHTML=l.cases.map((c,index)=>`<option value="${index}">${l.cases.length===1?escapeHTML(c.label):`예제 ${index+1} / ${escapeHTML(c.label)}`}</option>`).join('');
 $('case-select').value=String(ui.caseIndex);$('case-select').disabled=l.cases.length===1;
 $('problem-copy').scrollTop=0;
 renderIO();render(true);
}


function renderIO(){
 const l=lesson(),example=l.example;
 $('io-panel').innerHTML=`<section class="io-section"><h2>입력</h2><p class="io-spec">${escapeHTML(l.inputSpec)}</p><pre class="io-example" id="input-example">${escapeHTML(example.input||'(입력 없음)')}</pre></section><section class="io-section"><h2>출력</h2><p class="io-spec">${escapeHTML(l.outputSpec)}</p><pre class="io-example" id="output-example">${escapeHTML(example.output)}</pre><p class="io-footnote">노트북의 기본 입출력 예시입니다.</p></section>`;
}


function revealExplanation(lineNumber){
 const text=lesson().code.split('\n')[lineNumber-1].trim();
 const solution=text.match(/# Sol:\s*(.*)/)?.[1];
 if(solution)return ['이 줄에서 할 일',solution];
 if(lesson().id==='syntax')return ['문자열의 끝을 찾아봅니다','여는 작은따옴표는 있지만 닫는 따옴표가 없습니다. 원본의 오류를 확인한 뒤 Elice에서 수정해 보세요.'];
 if(text.includes('input(')&&text.includes('== \"Y\"'))return ['할인 여부를 비교합니다','입력한 문자열이 Y인지 비교해 True 또는 False를 저장합니다.'];
 if(text.includes('input('))return ['입력을 준비합니다',text.includes('map(')?'공백으로 나눈 값을 map(int, ...)로 정수로 바꿉니다.':text.includes('int(')?'input()으로 읽은 문자열을 계산에 쓸 정수로 바꿉니다.':text.includes('.split(')?'공백을 기준으로 나누어 문자열 목록을 만듭니다.':'입력한 문자열을 변수에 저장합니다.'];
 if(text.startsWith('def '))return ['호출할 함수를 살펴봅니다','매개변수로 받을 값과 함수가 반환할 값을 확인합니다. 본문은 함수를 호출할 때 실행됩니다.'];
 if(text.startsWith('return '))return ['결과를 호출한 곳으로 돌려줍니다','return은 함수를 끝내고 값을 돌려줍니다. 화면에 보여 주는 print()와 역할이 다릅니다.'];
 if(text.startsWith('for '))return ['다음 값을 하나씩 확인합니다',text.includes('range(len(')?'문자열의 인덱스는 0부터 길이보다 1 작은 값까지입니다. phone[index]로 현재 문자를 읽습니다.':text.includes('range(')?'range()의 끝 값은 포함되지 않습니다. 범위의 끝도 확인하려면 종료값에 1을 더합니다.':'순회할 목록과 이번 반복에서 사용할 값을 확인합니다.'];
 if(text.startsWith('if '))return ['조건에 맞는 경로를 고릅니다','조건이 True이면 들여쓴 본문을 실행합니다. False이면 해당 본문을 건너뜁니다.'];
 if(text==='else:')return ['다른 실행 경로를 준비합니다',/try:/.test(lesson().code)?'try 블록에서 예외가 발생하지 않았을 때 실행할 부분입니다.':'앞의 if 조건이 False일 때 실행할 부분입니다.'];
 if(text==='try:')return ['오류가 날 수 있는 코드를 묶습니다','예외가 발생하면 해당 예외를 처리하는 except 블록으로 이동합니다.'];
 if(text.startsWith('except '))return ['예외에 맞는 안내를 준비합니다','이 except가 처리할 예외 종류를 확인합니다. 정상 입력에서는 이 부분을 건너뜁니다.'];
 if(text.startsWith('print('))return ['정해진 형식으로 출력합니다','입출력 예시의 문구, 순서와 줄바꿈을 확인합니다.'];
 if(/^discount_text =/.test(text))return ['할인 안내를 한 줄로 정리합니다','제공된 if-else와 같은 동작을 조건 표현식으로 적었습니다. True이면 적용, False이면 미적용을 저장합니다.'];
 if(/^[\])}]+,?$/.test(text))return ['묶음을 닫습니다','여는 괄호와 닫는 괄호가 짝을 이루는지 확인합니다.'];
 if(/=\s*(""|\[\])\s*$/.test(text))return ['빈 결과에서 시작합니다','조건을 통과한 값이나 출력 문장을 차례로 모을 준비를 합니다.'];
 return ['코드의 흐름을 연결합니다','현재 줄이 어떤 값을 읽고 어떤 값을 저장하는지 확인해 보세요.'];
}

function buildExplanation(){
 const step=buildStep();
 if(!step)return ['학생용 코드에서 시작합니다','제공된 코드와 주석을 확인한 뒤, 다음 버튼으로 빈칸을 채워 갑니다.'];
 if(step.kind==='resume')return ['함수를 완성하고 호출부로 돌아옵니다','위에서 작성한 함수의 반환값을 여기서 사용합니다. 작성 순서와 실제 실행 순서를 구분해 보세요.'];
 const explanation=revealExplanation(step.source);
 if(step.kind==='given')explanation[0]='제공된 코드를 확인합니다';
 if(ui.buildIndex===lesson().build.steps.length)explanation[0]=lesson().id==='syntax'?'오류 코드가 준비되었습니다':'완성된 코드를 확인합니다';
 return explanation;
}

function frameName(name){
 return ({'<module>':'실행 코드','<listcomp>':'리스트 컴프리헨션','<dictcomp>':'딕셔너리 컴프리헨션','<lambda>':'lambda'})[name]||name+'()';
}

function traceExplanation(step){
 const text=lesson().code.split('\n')[step.line-1].trim();
 const state=step.state,before=step.before;
 if(step.kind==='syntax-error')return ['실행 전에 문법 오류를 찾았습니다','문자열을 닫는 따옴표가 빠졌습니다. 문법 검사에서 멈추므로 print()는 실행되지 않습니다.'];
 if(step.exception)return [step.exception.type+'가 발생했습니다',step.exception.type==='ZeroDivisionError'?'빈 점수 목록은 길이가 0입니다. 합계를 0으로 나누는 줄에서 예외가 발생해 except로 이동합니다.':text.startsWith('raise ')?'입력 조건을 만족하지 않아 코드에서 직접 예외를 발생시켰습니다.':'입력을 정수로 바꾸는 과정에서 예외가 발생했습니다. 해당 except로 이동합니다.'];
 if(step.kind==='condition')return [step.value?'조건이 True입니다':'조건이 False입니다',step.scope.includes('comp')?(step.value?'현재 값을 결과에 포함합니다.':'현재 값을 결과에 넣지 않고 다음 값을 확인합니다.'):(step.value?'바로 아래의 들여쓴 본문으로 이동합니다.':'이 if의 본문을 건너뛰고 다음 경로로 이동합니다.')];
 if(step.kind==='lambda-value')return ['lambda의 결과를 확인합니다',typeof step.value==='boolean'?`${pyValue(step.value,step.valueType)}를 반환합니다. filter는 True인 항목을 남깁니다.`:`정렬 기준값은 ${pyValue(step.value,step.valueType)}입니다. 이 값을 기준으로 순서를 비교합니다.`];
 if(step.kind==='collect')return ['결과에 값을 담습니다',`${pyValue(step.value,step.valueType)}를 컴프리헨션의 결과에 넣습니다.`];
 if(step.kind==='call')return ['호출한 코드 안으로 이동합니다',`${frameName(state.frames.at(-1)?.name||'<module>')}에 전달된 값을 확인합니다.`];
 if(step.kind==='return-value')return ['함수가 값을 반환합니다',`${pyValue(step.value,step.valueType)}를 호출한 곳에 돌려줍니다. 아직 출력하는 단계는 아닙니다.`];
 if(step.kind==='return')return ['호출한 곳으로 돌아옵니다',`${frameName(step.scope)}의 반환값은 ${pyValue(step.value,step.valueType)}입니다. 기다리던 계산이나 출력이 이어집니다.`];
 if(step.kind==='define')return ['함수를 정의합니다','함수의 본문은 아직 실행하지 않습니다. 나중에 이름으로 호출할 때 사용합니다.'];
 if(step.kind==='handler')return step.handlerMatches?['이 예외를 처리합니다','예외 종류에 맞는 except를 찾았습니다. 해당 본문으로 이동합니다.']:['다음 except를 확인합니다','이 except의 예외 종류와 일치하지 않습니다. 본문을 건너뛰고 다음 except를 확인합니다.'];
 if(state.output.length>before.output.length)return ['결과를 출력합니다',state.output.at(-1)===''?'조건에 맞는 결과가 없어 빈 줄을 한 줄 출력합니다.':'현재 값으로 출력문을 완성합니다. 출력된 문장은 아래에 차례로 쌓입니다.'];
 if((state.inputUsed||0)>(before.inputUsed||0))return ['다음 입력을 읽었습니다','선택한 예제의 입력을 순서대로 읽어 변수에 저장합니다.'];
 const local=state.frames.at(-1)?.vars||state.vars,oldLocal=before.frames.at(-1)?.vars||before.vars;
 const changes=Object.entries(local).filter(([key,value])=>!same(value,oldLocal[key]));
 if(changes.length)return ['변수의 값이 바뀝니다',changes.map(([key,value])=>`${key} = ${pyValue(value)}`).join(' / ')];
 if(step.kind==='loop')return ['반복의 흐름을 확인합니다','다음 항목이 있으면 본문으로 들어갑니다. 모두 확인했다면 반복문을 벗어납니다.'];
 return revealExplanation(step.line);
}


function keepCodeLineVisible(line){
 const container=$('code-scroll');
 if(!line?.isConnected||!container.contains(line))return;
 const top=line.offsetTop,bottom=top+line.offsetHeight;
 if(top<container.scrollTop+16||bottom>container.scrollTop+container.clientHeight-16)container.scrollTop=Math.max(0,top-Math.min(container.clientHeight*.27,70));
}

function finishTyping(){
 if(!typing)return;
 const animation=typing;typing=null;
 cancelAnimationFrame(animation.frame);
 animation.text.innerHTML=highlight(animation.fullText);
 animation.text.classList.remove('typing');
 animation.text.style.minHeight='';
 $('code-scroll').setAttribute('aria-busy','false');
 keepCodeLineVisible(animation.line);
}

function typeCodeLine(line,fullText){
 if(!line||window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const text=line.querySelector('.line-text');
 const indent=fullText.match(/^\s*/)[0],characters=Array.from(fullText.slice(indent.length));
 if(!characters.length)return;
 // Reserve the wrapped line's height so following code stays in place.
 text.style.minHeight=text.getBoundingClientRect().height+'px';
 text.innerHTML=highlight(indent);text.classList.add('typing');
 $('code-scroll').setAttribute('aria-busy','true');
 const animation={line,text,fullText,frame:0,count:0,started:performance.now()};
 typing=animation;
 const duration=Math.min(1100,Math.max(250,characters.length*18));
 function tick(now){
  if(typing!==animation)return;
  const count=Math.min(characters.length,Math.floor((now-animation.started)/duration*characters.length)+1);
  if(count!==animation.count){
   animation.count=count;text.innerHTML=highlight(indent+characters.slice(0,count).join(''));
   keepCodeLineVisible(line);
  }
  if(count===characters.length)finishTyping();
  else animation.frame=requestAnimationFrame(tick);
 }
 animation.frame=requestAnimationFrame(tick);
}

function renderCode(resetScroll=false,animateLine=false){
 const rows=currentRows(),running=ui.phase==='run';
 const step=running?traceStep():buildStep();
 const target=running?rows.find(row=>row.source===step?.line)?.id:step?.row;
 $('code-scroll').innerHTML=rows.map(row=>`<div class="code-line ${!row.text.trim()?'blank':''} ${row.id===target?'active':''}" id="code-row-${row.id}" data-source="${row.source||''}" ${row.id===target?'aria-current="step"':''}><span class="line-text">${highlight(row.text)}</span></div>`).join('');
 $('code-context').textContent=running?step?.state.frames.at(-1)?.name?frameName(step.state.frames.at(-1).name):'완성 코드':step?.context||'Python';
 const explanation=running?(step?traceExplanation(step):['완성한 코드가 움직이는 순서','다음 버튼으로 선택한 예제의 입력과 코드가 실행되는 순서를 따라갑니다.']):buildExplanation();
 $('explanation').hidden=!explanation;
 $('explanation-title').textContent=explanation?.[0]||'';$('explanation-body').textContent=explanation?.[1]||'';
 formatSentences($('explanation'));
 if(resetScroll||!target)$('code-scroll').scrollTop=0;
 if(target){
  const line=$('code-row-'+target);
  if(animateLine&&!running&&step?.kind==='write')typeCodeLine(line,rows.find(row=>row.id===target).text);
  requestAnimationFrame(()=>keepCodeLineVisible(line));
 }
}

function renderControls(){
 const restartLabel=ui.phase==='run'?'코드 확인 처음부터':'코드 구현 처음부터';
 $('restart-button').title=restartLabel;$('restart-button').setAttribute('aria-label',restartLabel);
 document.querySelectorAll('[data-phase]').forEach(button=>{
  const selected=button.dataset.phase===ui.phase;button.classList.toggle('active',selected);button.setAttribute('aria-current',selected?'step':'false');
 });
 const finished=ui.traceIndex===testCase().trace.length-1;
 $('counter').textContent=ui.phase==='problem'?`${ui.lesson+1} / ${lessons.length}`:ui.phase==='build'?`${ui.buildIndex} / ${lesson().build.steps.length}`:`${ui.traceIndex+1} / ${testCase().trace.length}`;
 $('next-label').textContent=ui.phase==='problem'?(lesson().id==='syntax'?'오류 코드 살펴보기':'코드 구현 시작'):ui.phase==='build'?(ui.buildIndex===lesson().build.steps.length?'코드 확인 시작':'다음 줄 보기'):finished?(ui.lesson===lessons.length-1?'수업 마무리':'다음 문제'):'다음 실행';
 $('previous-button').disabled=ui.phase==='problem'&&ui.lesson===0;
}

function render(resetScroll=false,animateLine=false){
 finishTyping();
 const problem=ui.phase==='problem',running=ui.phase==='run';
 $('problem-screen').hidden=!problem;$('work-screen').hidden=problem;
 $('io-panel').hidden=running;$('runtime').hidden=!running;
 $('work-screen').classList.toggle('running',running);
 $('work-screen').setAttribute('aria-label',running?'완성 코드와 실행 시각화':'입출력 안내와 코드 구현');
 if(!problem)renderCode(resetScroll,animateLine);
 if(running)renderRuntime(resetScroll);
 renderControls();
}

function collectionMarkup(value,hint){
 if(hint?.kind==='tuple')return `<span class="scalar">${escapeHTML(pyValue(value,hint))}</span>`;
 if(Array.isArray(value))return value.length?`<div class="sequence">${value.map((item,index)=>`<div class="sequence-cell"><span class="cell-index">${index}</span><span>${escapeHTML(pyValue(item,hint?.items?.[index]))}</span></div>`).join('')}</div>`:'<span class="empty-value">[ ] <small>빈 목록</small></span>';
 if(value&&typeof value==='object'&&!value.errorType)return `<dl class="mapping">${Object.entries(value).map(([key,item])=>`<div><dt>${escapeHTML(key)}</dt><dd>${escapeHTML(pyValue(item))}</dd></div>`).join('')}</dl>`;
 return `<span class="scalar">${escapeHTML(pyValue(value))}</span>`;
}

function scopeMarkup(name,vars,before={},types={},oldTypes={}){
 const entries=Object.entries(vars);
 if(!entries.length)return '';
 return `<section class="scope-card"><h3>${escapeHTML(name)}</h3>${entries.map(([key,value])=>{
  const changed=!same(value,before[key]),had=Object.hasOwn(before,key);
  return `<div class="value-row ${changed?'value-changed':''}" data-variable="${escapeHTML(key)}"><div class="value-heading"><code>${escapeHTML(key)}</code>${changed?`<span class="change-caption">${had?'값 변경':'새 값'}</span>`:''}</div>${changed&&had?`<div class="old-value">${escapeHTML(pyValue(before[key],oldTypes?.[key]))} <span aria-hidden="true">→</span></div>`:''}<div class="current-value">${collectionMarkup(value,types?.[key])}</div></div>`;
 }).join('')}</section>`;
}

function conceptMarkup(state,step){
 const local=state.frames.at(-1)?.vars||state.vars,l=lesson();
 if(l.id==='phone'&&typeof local.phone==='string'&&Number.isInteger(local.index))return `<section class="concept-focus"><h3>지금 살펴보는 문자 <code>index = ${local.index}</code></h3><div class="character-strip">${Array.from(local.phone).map((char,index)=>`<span class="character ${index===local.index?'current-character':''}"><small>${index}</small><b>${escapeHTML(char===' '?'␣':char)}</b></span>`).join('')}</div><p>공백은 ␣로 표시합니다. 숫자만 digits에 이어 붙입니다.</p></section>`;
 if(l.id==='sensor'&&'reading' in local)return `<section class="concept-focus"><h3>정상 범위 비교</h3><div class="expression">${state.vars.minimum} ≤ <b>${local.reading}</b> ≤ ${state.vars.maximum}</div>${step.kind==='condition'?`<p>${step.value?'두 경계 사이에 있어 결과에 포함합니다.':'범위 밖의 값이므로 건너뜁니다.'}</p>`:''}</section>`;
 if(l.id==='change'&&'amount' in state.vars){
  const v=state.vars;
  return `<section class="concept-focus"><h3>거스름돈 나누기</h3><div class="coin-grid">${[500,100,10].map(coin=>`<div><span>${coin}원</span><strong>${v['coin_'+coin]??'—'}</strong><small>개</small></div>`).join('')}</div>${'remainder' in v?`<p>현재 remainder = <b>${v.remainder}</b>원</p>`:''}</section>`;
 }
 if(l.id==='lockers'&&'hundreds' in local)return `<section class="concept-focus"><h3>${local.number}의 각 자릿수</h3><div class="digit-grid">${[['백의 자리','hundreds'],['십의 자리','tens'],['일의 자리','ones']].map(([label,key])=>`<div><small>${label}</small><strong>${local[key]??'—'}</strong></div>`).join('')}</div><p>각 자릿수를 2로 나눈 나머지를 확인합니다.</p></section>`;
 if(l.id==='books'&&Array.isArray(local.ranked))return `<section class="concept-focus"><h3>표 수 내림차순 → 도서명 오름차순</h3><ol class="ranking-list">${local.ranked.map(([title,votes])=>`<li><span>${escapeHTML(title)}</span><b>${votes}표</b></li>`).join('')||'<li>기준을 만족하는 도서가 없습니다.</li>'}</ol></section>`;
 if(l.id==='presentations'&&Array.isArray(state.vars.ordered))return `<section class="concept-focus"><h3>배정 번호가 작은 팀부터</h3><ol class="ranking-list">${state.vars.ordered.map(([team,number])=>`<li><span>${escapeHTML(team)}</span><b>${number}번</b></li>`).join('')}</ol></section>`;
 if(l.id==='average'&&Array.isArray(state.vars.scores))return `<section class="concept-focus"><h3>합계 ÷ 개수</h3><div class="expression">${state.vars.scores.reduce((sum,v)=>sum+v,0)} ÷ ${state.vars.scores.length}${'average' in state.vars?' = '+state.vars.average:''}</div><p>${state.vars.scores.length?'출력할 때 소수점 첫째 자리까지 표시합니다.':'0으로 나눌 수 없어 ZeroDivisionError가 발생합니다.'}</p></section>`;
 return '';
}

function renderRuntime(resetScroll=false){
 const step=traceStep(),state=step?.state||emptyState(),before=step?.before||emptyState();
 const previousScroll=$('memory').scrollTop,c=testCase();
 let html=`<section class="selected-input"><h3>선택한 예제 입력</h3>${c.input.length?`<ol>${c.input.map((value,index)=>`<li class="${index<(state.inputUsed||0)?'input-read':''}"><code>${escapeHTML(value||'(빈 입력)')}</code><span>${index<(state.inputUsed||0)?'읽음':'대기'}</span></li>`).join('')}</ol>`:'<p>입력 없이 확인합니다.</p>'}</section>`;
 if(lesson().id==='change'&&ui.caseIndex===1)html+='<p class="case-note">원본 테스트 2의 1234는 10원 단위 조건 밖의 입력입니다. 이 코드는 10원 미만 금액을 제외합니다.</p>';
 if(!step)html+='<div class="empty-state"><div class="empty-mark">{ }</div><p>다음 실행을 눌러<br>입력부터 따라가 보세요.</p></div>';
 else{
  html+=`<div class="call-flow"><span>실행 코드</span>${state.frames.map((frame,index)=>`<span aria-hidden="true">→</span><span class="frame ${index===state.frames.length-1?'active':''}">${escapeHTML(frameName(frame.name))}</span>`).join('')}</div>`;
  if(step.exception)html+=`<section class="exception-card" role="status"><h3>${escapeHTML(step.exception.type)}</h3><p>${step.kind==='syntax-error'?'문자열을 닫는 따옴표가 없습니다.':escapeHTML(step.exception.message)}</p><small>${step.kind==='syntax-error'?'문법 검사에서 중단':'예외에 맞는 except로 이동합니다.'}</small></section>`;
  if(step.kind==='handler')html+=`<div class="condition-result handler-result ${step.handlerMatches?'':'false-result'}"><span>except의 예외 종류</span><strong>${step.handlerMatches?'일치':'불일치'}</strong></div>`;
  if(step.kind==='condition'||step.kind==='lambda-value')html+=`<div class="condition-result ${step.value===false?'false-result':''}"><span>${step.kind==='condition'?'조건 결과':'lambda 반환값'}</span><strong>${escapeHTML(pyValue(step.value,step.valueType))}</strong></div>`;
  if(['return-value','return','collect'].includes(step.kind))html+=`<div class="return-result"><span>${step.kind==='collect'?'결과에 추가':'반환값'}</span><code>${escapeHTML(pyValue(step.value,step.valueType))}</code></div>`;
  html+=conceptMarkup(state,step);
  // The active function's values stay closest to the current line.
  for(let index=state.frames.length-1;index>=0;index--){
   const frame=state.frames[index],old=before.frames[index];
   html+=scopeMarkup(frameName(frame.name),frame.vars,old?.name===frame.name?old.vars:{},frame.types,old?.types);
  }
  html+=scopeMarkup('실행 코드의 변수',state.vars,before.vars,state.types,before.types);
 }
 $('memory').innerHTML=html;
 $('memory').scrollTop=resetScroll?0:previousScroll;
 $('output-lines').innerHTML=state.output.length?state.output.map((line,index)=>`<div class="output-line ${index>=before.output.length?'new-output':''}">${line===''?'<span class="blank-output" aria-label="빈 줄 출력">↵ <small>빈 줄</small></span>':escapeHTML(line)}</div>`).join(''):'<p class="output-placeholder">아직 출력이 없습니다.</p>';
 $('finished-label').hidden=ui.traceIndex!==c.trace.length-1;
 $('finished-label').textContent=lesson().id==='syntax'?'오류 확인 완료':'실행 완료';
 if(state.output.length>before.output.length)$('output-lines').scrollTop=$('output-lines').scrollHeight;
 if(step&&!resetScroll)requestAnimationFrame(()=>{
  const target=$('memory').querySelector('.exception-card,.condition-result,.return-result,.value-changed');
  if(!target)return;
  const box=$('memory').getBoundingClientRect(),rect=target.getBoundingClientRect();
  if(rect.top<box.top||rect.bottom>box.bottom)$('memory').scrollTop+=rect.top-box.top-12;
 });
}


function setPhase(phase){
 ui.phase=phase;
 if(phase==='run')ui.traceIndex=-1;
 render(true);
}

function restartPhase(){
 if(ui.phase==='problem')return;
 if(ui.phase==='build')ui.buildIndex=0;
 else ui.traceIndex=-1;
 render(true);
}

function changeLesson(index){
 if(index<0||index>=lessons.length)return;
 ui.lesson=index;ui.phase='problem';ui.buildIndex=0;ui.traceIndex=-1;ui.caseIndex=0;
 clearTimeout(ui.toastTimer);$('toast').hidden=true;
 renderLesson();
}

function next(){
 let animateLine=false;
 if(ui.phase==='problem'){ui.phase='build';render(true);return}
 if(ui.phase==='build'){
  if(ui.buildIndex<lesson().build.steps.length){ui.buildIndex++;animateLine=true}
  else{ui.phase='run';ui.traceIndex=-1}
 }else if(ui.traceIndex<testCase().trace.length-1)ui.traceIndex++;
 else if(ui.lesson<lessons.length-1){changeLesson(ui.lesson+1);return}
 else{showWrapUp();return}
 render(false,animateLine);
}

function previous(){
 if(ui.phase==='problem'){if(ui.lesson>0)changeLesson(ui.lesson-1);return}
 if(ui.phase==='build'){
  if(ui.buildIndex>0)ui.buildIndex--;else ui.phase='problem';
 }else if(ui.traceIndex>=0)ui.traceIndex--;
 else{ui.phase='build';ui.buildIndex=lesson().build.steps.length}
 render();
}

function toast(text){
 clearTimeout(ui.toastTimer);$('toast').textContent=text;$('toast').hidden=false;
 ui.toastTimer=setTimeout(()=>$('toast').hidden=true,2300);
}

function openModal(title,html,imageMode=false){
 finishTyping();

 if($('modal-backdrop').hidden)ui.modalFocus=document.activeElement;$('modal-title').textContent=title;$('modal-content').innerHTML=html;formatSentences($('modal-content'));
 $('modal-backdrop').hidden=false;$('close-modal').focus();
}
function closeModal(){
 if($('modal-backdrop').hidden)return;
 $('modal-backdrop').hidden=true;document.body.classList.remove('image-popup-open');ui.modalFocus?.focus();
}

 openModal('화면을 넘기며 함께 풀어 보세요',`<p><b>1. 문제 설명</b><br>문제 전문과 그림을 확인합니다. 실제 풀이와 제출은 Elice에서 진행합니다.</p><p><b>2. 코드 구현</b><br>노트북의 학생용 코드에서 시작해 필요한 줄을 채웁니다. 함수는 호출부에서 잠시 이동해 구현하고 돌아옵니다. 완성 코드의 정의 위치는 그대로 유지합니다.</p><p><b>3. 코드 확인</b><br>실제 Python으로 실행해 기록한 예제를 재생합니다. 입력, 변수, 조건 판단, 반환값과 출력을 함께 확인합니다. 예제를 바꾸면 처음부터 시작합니다.</p><div class="shortcut"><span>다음 / 이전</span><span><kbd>→</kbd> <kbd>Space</kbd> / <kbd>←</kbd></span></div><div class="shortcut"><span>문제 이동</span><span><kbd>Page Up</kbd> / <kbd>Page Down</kbd></span></div><div class="shortcut"><span>바로 이동</span><span><kbd>1</kbd> ~ <kbd>${lessons.length}</kbd></span></div><div class="shortcut"><span>전체 화면 / 도움말 / 닫기</span><span><kbd>F</kbd> / <kbd>?</kbd> / <kbd>Esc</kbd></span></div><p style="margin-top:22px">코드 복사 옆 되돌리기는 현재 단계만 처음으로 돌립니다. 목차의 ‘현재 문제 처음부터’는 선택한 문제 전체를 초기화합니다. 이전 버튼은 이전 시점의 값과 출력도 복원합니다.</p><p>코드 복사는 현재 화면에 공개된 코드와 주석을 복사합니다. 실행 화면에서는 완성 코드를 복사합니다.</p><p>실행 화면의 출력은 input()의 안내 문구를 생략합니다. 빈 줄 출력은 ↵로 구분하고, 목록 칸의 작은 숫자는 0부터 시작하는 인덱스입니다. 실제 출력에는 이 표시가 포함되지 않습니다.</p><p>그림과 글꼴이 HTML에 포함되어 인터넷 연결 없이 사용할 수 있습니다. 전체 화면 기능을 사용할 수 없으면 화면을 넓히는 모드로 전환합니다.</p>`);
}

 const recap=WEEK===1?[
  ['입력과 출력','문자열로 받은 입력을 필요에 맞게 변환하고, 정해진 형식으로 출력합니다.'],

 ]:[

function formatSentences(root){
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
 const nodes=[];
 while(walker.nextNode()){
  const node=walker.currentNode,parent=node.parentElement;
  if(parent.closest('p,li,td,th')&&!parent.closest('pre,code,svg'))nodes.push(node);
 }
 for(const node of nodes){
  const lines=node.textContent.replace(/([.!?。！？]["'’”)\]]*)[ \t\r\n]+/g,'$1\n').split('\n');
  if(lines.length<2)continue;
  const fragment=document.createDocumentFragment();
  lines.forEach((line,index)=>{if(index)fragment.append(document.createElement('br'));fragment.append(document.createTextNode(line))});
  node.replaceWith(fragment);
 }
}

function markdown(source){
 const inline=value=>escapeHTML(value).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>');
 const lines=source.split('\n');
 let html='',paragraph=[];
 const flush=()=>{if(paragraph.length){html+=`<p>${inline(paragraph.join(' '))}</p>`;paragraph=[]}};
 for(let index=0;index<lines.length;index++){
  const line=lines[index].trim();
  if(!line){flush();continue}
  if(line.startsWith('```')){
   flush();const code=[];
   while(++index<lines.length&&!lines[index].startsWith('```'))code.push(lines[index]);
   html+=`<pre>${escapeHTML(code.join('\n'))}</pre>`;continue;
  }
  if(line.startsWith('|')){
   flush();const rows=[];
   while(index<lines.length&&lines[index].trim().startsWith('|')){
    const row=lines[index++].trim();
    if(!/^\|[\s:|\-]+\|$/.test(row))rows.push(row.split('|').slice(1,-1));
   }
   index--;html+='<table><thead><tr>'+rows[0].map(cell=>`<th scope="col">${inline(cell.trim())}</th>`).join('')+'</tr></thead><tbody>';
   html+=rows.slice(1).map(row=>'<tr>'+row.map(cell=>`<td>${inline(cell.trim())}</td>`).join('')+'</tr>').join('')+'</tbody></table>';continue;
  }
  const unordered=/^[-*] /.test(line),ordered=/^\d+\. /.test(line);
  if(unordered||ordered){
   flush();const tag=ordered?'ol':'ul',pattern=ordered?/^\d+\. /:/^[-*] /;
   html+='<'+tag+'>';
   while(index<lines.length&&pattern.test(lines[index].trim()))html+=`<li>${inline(lines[index++].trim().replace(pattern,''))}</li>`;
   index--;html+='</'+tag+'>';continue;
  }
  if(/^#{1,6} /.test(line)||/^\*\*.+\*\*$/.test(line)){
   flush();html+=`<h3>${inline(line.replace(/^#+ /,''))}</h3>`;continue;
  }
  if(/^---+$/.test(line)){flush();html+='<hr>';continue}
  paragraph.push(line);
 }
 flush();return html;
}

async function copyCode(){
 finishTyping();
 const source=currentCode();let copied=false;
 if(navigator.clipboard?.writeText){try{await navigator.clipboard.writeText(source);copied=true}catch(error){/* A file URL may require the local fallback. */}}
 if(!copied){
  const area=document.createElement('textarea'),focused=document.activeElement;
  area.value=source;area.setAttribute('readonly','');area.style.cssText='position:fixed;left:-10000px;top:0';
  document.body.append(area);area.select();
  try{copied=document.execCommand('copy')}catch(error){copied=false}
  area.remove();focused?.focus();
 }
 if(copied)toast('화면의 코드와 주석을 복사했습니다.');
 else openModal('코드 직접 복사',`<p>코드를 선택한 뒤 Ctrl+C 또는 ⌘C를 눌러 주세요.</p><textarea aria-label="복사할 코드" readonly>${escapeHTML(source)}</textarea>`);
}

async function toggleFullscreen(){
 try{
  if(document.fullscreenElement){await document.exitFullscreen();return}
  if(document.documentElement.requestFullscreen){await document.documentElement.requestFullscreen();return}
 }catch(error){/* Fall back to a larger presentation area when fullscreen is unavailable. */}
 document.body.classList.toggle('focus-screen');
 toast(document.body.classList.contains('focus-screen')?'F 또는 Esc를 누르면 원래 화면으로 돌아갑니다.':'원래 화면으로 돌아왔습니다.');
}

$('next-button').addEventListener('click',next);
$('previous-button').addEventListener('click',previous);
$('copy-button').addEventListener('click',copyCode);
$('restart-button').addEventListener('click',restartPhase);
$('menu-button').addEventListener('click',showMenu);
$('scene').addEventListener('click',event=>{if(event.target.closest('.scene-trigger'))showPicture()});
$('fullscreen-button').addEventListener('click',toggleFullscreen);
$('close-modal').addEventListener('click',closeModal);
$('modal-backdrop').addEventListener('click',event=>{if(event.target===$('modal-backdrop'))closeModal()});
document.querySelectorAll('[data-phase]').forEach(button=>button.addEventListener('click',()=>setPhase(button.dataset.phase)));
$('case-select').addEventListener('change',event=>{ui.caseIndex=Number(event.target.value);ui.traceIndex=-1;renderIO();render(true)});
$('modal-content').addEventListener('click',event=>{
 const choice=event.target.closest('[data-lesson]');
 if(choice){closeModal();changeLesson(Number(choice.dataset.lesson))}
 if(event.target.closest('#reset-lesson')){closeModal();changeLesson(ui.lesson)}
 if(event.target.closest('#help-button'))showHelp();
});
document.addEventListener('fullscreenchange',()=>$('fullscreen-button').setAttribute('aria-label',document.fullscreenElement?'전체 화면 종료':'전체 화면'));
document.addEventListener('keydown',event=>{
 if(event.key==='Escape'){closeModal();document.body.classList.remove('focus-screen');return}
 if(!$('modal-backdrop').hidden){
  if(event.key==='Tab'){
   const focusable=[...$('modal').querySelectorAll('button,textarea,select,a[href],[tabindex="0"]')].filter(element=>!element.disabled&&!element.hidden);
   const first=focusable[0],last=focusable.at(-1);
   if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus()}
   else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus()}
  }
  return;
 }
 if(event.altKey||event.ctrlKey||event.metaKey||event.isComposing||event.repeat)return;
 if(event.target.closest('select,input,textarea,[contenteditable="true"]'))return;
 if(event.target.closest('button,a[href]')&&[' ','Enter'].includes(event.key))return;
 if(['ArrowRight',' '].includes(event.key)){event.preventDefault();next()}
 else if(event.key==='ArrowLeft'){event.preventDefault();previous()}
 else if(event.key==='PageDown'){event.preventDefault();changeLesson(ui.lesson+1)}
 else if(event.key==='PageUp'){event.preventDefault();changeLesson(ui.lesson-1)}
 else if(/^[1-9]$/.test(event.key)&&Number(event.key)<=lessons.length){event.preventDefault();changeLesson(Number(event.key)-1)}
 else if(event.key.toLowerCase()==='f'){event.preventDefault();toggleFullscreen()}
 else if(event.key==='?'){event.preventDefault();showHelp()}
});
renderLesson();

</script>
