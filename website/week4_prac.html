<!-- Course loading screen: keep before embedded fonts and lesson data. -->
<style id="page-loader-style">
#page-loader{display:none;position:fixed;inset:0;z-index:10000;place-content:center;justify-items:center;gap:24px;background:#fafbf8;color:#245e4f;font:500 16px/1.5 system-ui,sans-serif;letter-spacing:-.3px}
html.page-is-loading #page-loader{display:grid}
html.page-is-loading{overflow:hidden}
#page-loader .loading-mark{display:grid;grid-template-columns:26px 26px;grid-template-rows:26px 26px;gap:8px}
#page-loader .loading-tile{position:relative;border-radius:6px;background:#c4d8b0;overflow:hidden}
#page-loader .loading-tile:nth-child(3){grid-area:2/2;background:#70945b}
#page-loader .loading-tile:nth-child(4){grid-area:2/1}
#page-loader .loading-tile::after{content:"";position:absolute;inset:0;background:#245e4f;opacity:0;animation:loading-clockwise 1.2s linear infinite;will-change:opacity}
#page-loader .loading-tile:nth-child(2)::after{animation-delay:-.9s}
#page-loader .loading-tile:nth-child(3)::after{animation-delay:-.6s}
#page-loader .loading-tile:nth-child(4)::after{animation-delay:-.3s}
#page-loader p{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@keyframes loading-clockwise{0%,20%,100%{opacity:1}25%,95%{opacity:0}}
@media(prefers-reduced-motion:reduce){#page-loader .loading-tile::after{animation:none;will-change:auto}#page-loader .loading-tile:first-child::after{opacity:1}}
</style>
<script>
(() => {
  const root = document.documentElement;
  let navigationTimer;
  let navigating = false;
  const setLoading = active => {
    root.classList.toggle('page-is-loading', active);
    root.setAttribute('aria-busy', String(active));
    document.querySelectorAll('.deck,.container').forEach(el => { el.inert = active; });
  };
  const finish = () => { clearTimeout(navigationTimer); navigating = false; setLoading(false); };
  setLoading(true);
  document.addEventListener('DOMContentLoaded', async () => {
    setLoading(true);
    const assets = [...document.images].map(img => img.decode().catch(() => {}));
    if (document.fonts) assets.push(document.fonts.ready);
    let assetTimer;
    await Promise.race([Promise.allSettled(assets), new Promise(resolve => { assetTimer = setTimeout(resolve, 8000); })]);
    clearTimeout(assetTimer);
    requestAnimationFrame(() => requestAnimationFrame(() => { if (!navigating) finish(); }));
  }, {once:true});
  window.addEventListener('pageshow', event => { if (event.persisted) finish(); });
  window.addEventListener('pagehide', () => clearTimeout(navigationTimer));
  window.navigateWithCourseLoader = (destination, replace = false) => {
    navigating = true;
    setLoading(true);
    clearTimeout(navigationTimer);
    navigationTimer = setTimeout(finish, 15000);
    requestAnimationFrame(() => setTimeout(() => location[replace ? 'replace' : 'assign'](destination), 0));
  };
  document.addEventListener('click', event => {
    const link = event.target.closest('a[href]');
    if (!link || event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey || link.hasAttribute('download') || (link.target && link.target !== '_self')) return;
    const destination = new URL(link.href, location.href);
    if (destination.origin !== location.origin || !/\/(?:main|week\d+_prac)\.html$/.test(destination.pathname)) return;
    event.preventDefault();
    window.navigateWithCourseLoader(destination.href);
  });
})();
</script>

<script id="lesson-data" type="application/json">[{"id":"digits","title":"물품 코드의 확인 숫자","tag":"도전문제 1","problemNumber":1,"statement":"**문제 상황**\n\n교내 장비실에서는 물품 코드가 잘못 입력되었는지 확인하는 데 사용할 숫자를 만듭니다.\n코드의 각 자릿수를 모두 더한 뒤, 그 합의 **일의 자리 숫자**를 확인 숫자로 사용합니다.\n예를 들어 코드가 `5724`이면 자릿수의 합은 18이고 확인 숫자는 8입니다.\n합이 두 자리 이상이어도 자릿수를 다시 더하지 않습니다.\n\n자릿수의 합을 구하는 부분을 재귀함수로 작성해 보세요.\n\n**만들 함수**\n\n| 함수 | 역할 |\n| --- | --- |\n| `digit_sum(n)` | 0 이상의 정수 `n`의 자릿수 합을 정수로 반환합니다. `n`이 0이면 0을 반환합니다. |\n\n**입출력 형식**\n\n- **입력:** 물품 코드 한 줄입니다.\n- **출력:** `확인 숫자: 숫자` 형식으로 한 줄 출력합니다.\n- **조건:** 코드는 0 이상 999999999999 이하의 정수입니다. 0을 제외한 코드의 맨 앞에는 0이 없습니다.\n- `digit_sum()`은 반드시 자기 자신을 호출하는 재귀함수로 작성합니다. 반복문, 문자열 변환, `sum()`은 사용하지 않습니다.\n\n**작성 안내**\n\n아래 `To Do` 셀에서 **함수 정의, 입력, 함수 호출, 출력까지 전체 코드**를 작성하세요.\n입력은 `number`에 저장하고, 입력 안내 문구는 `물품 코드: `를 사용합니다.\n함수가 반환한 자릿수 합으로 확인 숫자를 구해 `check`에 저장한 뒤 출력합니다.\n\n재귀 호출 없이 답을 반환할 수 있는 경우를 먼저 정하고, 호출할 때마다 처리할 자릿수가 줄어들도록 만드세요.\n`digit_sum()` 안에서는 합을 반환하고, 입력과 출력은 함수 밖에서 처리합니다.\n\n**입력 예시**\n```\n5724\n```\n\n**출력 예시**\n```\n물품 코드: 5724\n확인 숫자: 8\n```\n","skeleton":"# To Do\n\n# 자릿수의 합을 반환하는 재귀함수 digit_sum(n)을 정의하세요.\n\n\n# 물품 코드를 입력받아 number에 저장하세요.\n\n\n# 재귀함수의 반환값으로 확인 숫자 check를 구하고 출력하세요.\n","code":"def digit_sum(n):\n    if n < 10:\n        return n\n    return n % 10 + digit_sum(n // 10)\n\nnumber = int(input(\"물품 코드: \"))\n\ncheck = digit_sum(number) % 10\nprint(f\"확인 숫자: {check}\")","image":"assets/illustrations/1d07adf8481bca6f7d24.webp","imageAlt":"대여 물품 상자에 붙은 식별 코드를 확인하는 모습","inputSpec":"물품 코드 한 줄 (0 이상 정수)","outputSpec":"확인 숫자: 숫자","cases":[{"label":"기본 예제","input":["5724"],"expected":"확인 숫자: 8","fullOutput":"물품 코드: 5724\n확인 숫자: 8","trace":[{"line":6,"kind":"line","scope":"<module>","value":null,"before":{"vars":{},"frames":[],"output":[]},"state":{"vars":{"number":5724},"frames":[],"output":[]}},{"line":8,"kind":"call","scope":"digit_sum","value":null,"before":{"vars":{"number":5724},"frames":[],"output":[]},"state":{"vars":{"number":5724},"frames":[{ eck}\")"}},{"id":"returns","title":"대여 물품 반납 안내","tag":"도전문제 2","problemNumber":2,"statement":"**문제 상황**\n\n영상 동아리는 촬영 장비를 빌린 순서대로 기록해 두었습니다.\n촬영이 끝나면 **가장 나중에 빌린 물품부터** 반납하도록 안내하려고 합니다.\n입력된 물품 목록을 재귀함수로 처리해 반납 순서를 출력하세요.\n\n**만들 함수**\n\n| 함수 | 역할 |\n| --- | --- |\n| `print_returns(items)` | 리스트 `items`의 물품을 입력의 역순으로 한 줄씩 출력합니다. 물품이 없으면 아무것도 출력하지 않고 종료합니다. |\n\n이 함수는 계산 결과를 반환하는 대신, 함수 안에서 반납 안내를 직접 출력합니다.\n빈 목록을 알리는 문장은 함수 밖에서 출력합니다.\n\n**입출력 형식**\n\n- **입력:** 물품 이름들을 공백으로 구분한 한 줄입니다. 물품이 없으면 빈 줄을 입력합니다.\n- **출력:** 입력의 역순으로 `반납: 물품이름`을 한 줄씩 출력합니다. 빈 입력이면 `반납할 물품이 없습니다.`를 한 줄 출력합니다.\n- **조건:** 물품 수는 0개 이상 30개 이하입니다. 이름 안에는 공백이 없으며, 같은 이름이 여러 번 나오면 각각 별개의 물품으로 취급합니다.\n- 반복문, `reversed()`, `reverse()`, `[::-1]`은 사용하지 않습니다. 리스트의 순서를 바꾸지 않고 재귀 호출로 처리합니다.\n\n**작성 안내**\n\n함수 선언과 입력 코드가 제공됩니다. **함수 본문과 함수 밖의 빈 목록 처리, 함수 호출**을 작성하세요.\n`pass`는 아무 작업도 하지 않는 문장입니다. `pass`를 지우고 함수 본문을 채우세요.\n\n빈 목록에서 재귀가 멈추도록 하고, **출력과 재귀 호출의 위치**에 따라 출력 순서가 어떻게 달라지는지 생각해 보세요.\n`items[1:]`은 첫 번째 물품을 제외한 나머지 목록입니다.\n`print_returns()`는 직접 출력하므로 함수 호출을 `print()`로 감싸지 않습니다.\n\n**입력 예시**\n```\n카메라 삼각대 조명\n```\n\n**출력 예시**\n```\n대여 물품(공백 구분): 카메라 삼각대 조명\n반납: 조명\n반납: 삼각대\n반납: 카메라\n```\n","skeleton":"# To Do\n\ndef print_returns(items):\n    # 빈 목록에서는 종료하고, 재귀 호출로 반납 순서를 출력하세요.\n    pass\n\n\n# 제공 코드: 입력 부분은 그대로 사용하세요.\nitems = input(\"대여 물품(공백 구분): \").split()\n\n# 빈 목록이면 안내 문장을 출력하고, 그 외에는 재귀함수를 호출하세요.\n","code":"def print_returns(items):\n    if len(items) == 0:\n        return\n    print_returns(items[1:])\n    print(f\"반납: {items[0]}\")\n\nitems = input(\"대여 물품(공백 구분): \").split()\n\nif len(items) == 0:\n    print(\"반납할 물품이 없습니다.\")\nelse:\n    print_returns(items)","image":"assets/illustrations/8e1149fed7dc6df86d3b.webp","imageAlt":"카메라와 삼각대 등 빌린 장비를 대여 창구에 반납하는 모습","inputSpec":"공백으로 구분한 물품 이름 한 줄. 없으면 빈 줄","outputSpec":"나중에 빌린 물품부터 반납 안내","cases":[{"label":"기본 예제","input":["카메라 삼각대 조명"],"expected":"반납: 조명\n반납: 삼각대\n반납: 카메라","fullOutput":"대여 물품(공백 구분): 카메라 삼각대 조명\n반납: 조명\n반납: 삼각대\n반납: 카메라","trac w":16,"source":9,"kind":"write","context":"결과 출력"},{"row":17,"source":10,"kind":"write","context":"결과 출력"},{"row":18,"source":11,"kind":"write","context":"결과 출력"},{"row":19,"source":12,"kind":"write","context":"결과 출력"}],"final":"# To Do\n\ndef print_returns(items):\n    # 빈 목록에서는 종료하고, 재귀 호출로 반납 순서를 출력하세요.\n    if len(items) == 0:\n        return\n    print_returns(items[1:])\n    print(f\"반납: {items[0]}\")\n\n\n# 제공 코드: 입력 부분은 그대로 사용하세요.\nitems = input(\"대여 물품(공백 구분): \").split()\n\n# 빈 목록이면 안내 문장을 출력하고, 그 외에는 재귀함수를 호출하세요.\nif len(items) == 0:\n    print(\"반납할 물품이 없습니다.\")\nelse:\n    print_returns(items)"}},{"id":"palindrome","title":"축제 입장 코드 대칭 검사","tag":"도전문제 3","problemNumber":3,"statement":"**문제 상황**\n\n축제의 특별 체험 부스에서는 앞에서 읽어도 뒤에서 읽어도 같은 코드를 사용합니다.\n이런 코드를 이 문제에서는 **대칭 코드**라고 부릅니다.\n`abccba`와 `abcba`는 대칭 코드이지만, `abca`는 아닙니다.\n입력받은 코드가 대칭인지 재귀함수로 검사하세요.\n\n**만들 함수**\n\n| 함수 | 역할 |\n| --- | --- |\n| `is_palindrome(text)` | 문자열 `text`가 대칭이면 `True`, 그렇지 않으면 `False`를 반환합니다. |\n\n글자가 하나이거나 검사할 글자가 더 이상 남지 않으면 대칭으로 판단합니다.\n검사 도중 서로 대응하는 글자가 다르면 나머지 글자를 더 검사할 필요가 없습니다.\n\n**입출력 형식**\n\n- **입력:** 입장 코드 한 줄입니다.\n- **출력:** 대칭이면 `대칭 코드입니다.`, 그렇지 않으면 `대칭 코드가 아닙니다.`를 한 줄 출력합니다.\n- **조건:** 코드는 영문 소문자와 숫자 `0`부터 `9`로만 이루어진 길이 1 이상 100 이하의 문자열입니다. 공백은 없으며, 맨 앞에 0이 올 수 있습니다.\n- 반복문, `reversed()`, `[::-1]`을 사용하지 않고 재귀 호출로 검사합니다.\n\n**작성 안내**\n\n함수 선언과 입력 코드가 제공됩니다. **함수 본문과 반환값에 따른 출력**을 작성하세요.\n함수는 화면에 출력하지 않고 불리언 값을 반환합니다.\n문자열 인덱스로 글자를 읽기 전에, 더 비교할 글자가 있는지 확인하세요.\n\n문자열에도 인덱스와 슬라이싱을 사용할 수 있습니다.\n`text[0]`은 첫 글자, `text[-1]`은 마지막 글자, `text[1:-1]`은 양 끝 글자를 제외한 부분입니다.\n한 번의 호출에서 처리할 부분과 다음 호출에 맡길 부분을 나누어 보세요.\n\n**입력 예시**\n```\nabccba\n```\n\n**출력 예시**\n```\n입장 코드: abccba\n대칭 코드입니다.\n```\n","skeleton":"# To Do\n\ndef is_palindrome(text):\n    # 종료 조건과 재귀 호출을 사용해 대칭 여부를 반환하세요.\n    pass\n\n\n# 제공 코드: 입력 부분은 그대로 사용하세요.\ncode = input(\"입장 코드: \")\n\n# 재귀함수의 반환값에 따라 대칭 여부를 출력하세요.\n","code":"def is_palindrome(text):\n    if len(text) <= 1:\n        return True\n    if text[0] != text[-1]:\n        return False\n    return is_palindrome(text[1:-1])\n\ncode = input(\"입장 코드: \")\n\nif is_palindrome(code):\n    print(\"대칭 코드입니다.\")\nelse:\n    print(\"대칭 코드가 아닙니다.\")","image":"assets/illustrations/2ffce7fa4d1ef64d7528.webp","imageAlt":"축제 입구에서 입장권에 적힌 코드를 확인하는 모습","inputSpec":"영문 소문자와 숫자로 된 코드 한 줄","outputSpec":"대칭 여부를 한 줄로 출력","cases":[{"label":"짝수 길이 대칭","input":["abccba"],"expected":"대칭 코드입니다.","fullOutput":"입장 코드: abccba\n대칭 코드입니다.","trace":[{"line":8,"kind":"line","scope":"<module>","value":null,"before":{"vars":{},"frames":[],"output":[]},"state":{"vars":{"code":"abccba"},"frames":[],"output":[]}},{"line":10,"kind":"call","scope":"is_palindrome","value":null,"before":{"vars":{"code":"abccba"},"frames":[],"output":[]},"state":{"vars":{"code":"abccba"},"frames":[{"id":1,"name":"is_palindrome","line":1,"vars":{"text":"abccba"}}],"output":[]},"callId":1},{"line":2,"kind":"condition","scope":"is_palindrome","value":false,"before":{"vars":{"code":"abccba"},"frames":[{"id":1,"name":"is_palindrome","line":1,"vars":{"text":"abccba"}}],"output":[]},"state":{"vars":{"code":"abccba"},"frames":[{"id":1,"name":"is_palindrome","line":4,"vars":{"text":"abccba"}}],"output":[]}},{"line":4,"kind":"condition","scope":"is_palindrome","value":false,"before":{"vars":{"code":"abccba"},"frames":[{"id":1,"name":"is_palindrome","line":4,"vars":{"text":"abccba"}}],"output":[]},"state":{"vars":{"code":"abccba"},"frames":[{"id":1,"name":"is_palindrome","line":6,"vars":{"text":"abccba"}}],"output":[]}},{"line":6,"kind":"call","scope":"is_palindrome","value":null,"before":{"vars":{"code":"abccba"},"frames":[{"id":1,"name":"is_palindrome","line":6,"vars":{"text":"abccba"}}],"output":[]},"state":{"vars":{"code":"abccba"},"frames":[{"id":1,"name":"is_palindrome","line":6,"vars":{"text":"abccba"}},{"id":2,"name":"is_palindrome","line":1,"vars":{"text":"bccb"}}],"output":[]},"callId":2},{"line":2,"kind":"condition","scope":"is_palindrome","value":false,"before":{"vars":{"code":"a :10,"kind":"resume","context":"입력과 호출부"},{"row":18,"source":11,"kind":"write","context":"결과 출력"},{"row":19,"source":12,"kind":"write","context":"결과 출력"},{"row":20,"source":13,"kind":"write","context":"결과 출력"}],"final":"# To Do\n\ndef is_palindrome(text):\n    # 종료 조건과 재귀 호출을 사용해 대칭 여부를 반환하세요.\n    if len(text) <= 1:\n        return True\n    if text[0] != text[-1]:\n        return False\n    return is_palindrome(text[1:-1])\n\n\n# 제공 코드: 입력 부분은 그대로 사용하세요.\ncode = input(\"입장 코드: \")\n\n# 재귀함수의 반환값에 따라 대칭 여부를 출력하세요.\nif is_palindrome(code):\n    print(\"대칭 코드입니다.\")\nelse:\n    print(\"대칭 코드가 아닙니다.\")"}},{"id":"ribbon","title":"체험용 리본 나누기","tag":"도전문제 4","problemNumber":4,"statement":"**문제 상황**\n\n공예 체험 부스에서 긴 리본 한 줄을 여러 참가자에게 나누어 주려고 합니다.\n리본을 아래 규칙대로 잘라, 모든 조각이 정해진 최대 길이 이하가 되도록 만드세요.\n\n1. 현재 리본이 최대 길이 이하이면 더 자르지 않고 최종 조각으로 사용합니다.\n2. 최대 길이보다 길면 길이가 정수인 두 조각으로 최대한 똑같이 나눕니다. 홀수 길이는 앞쪽 조각이 뒤쪽보다 1cm 짧습니다.\n3. **앞쪽 조각의 처리를 모두 끝낸 뒤 뒤쪽 조각을 처리**합니다. 각 조각에도 같은 규칙을 적용합니다.\n\n자를 때 줄어드는 길이는 없다고 가정합니다.\n완성된 조각의 길이를 처리 순서대로 출력하고, 마지막에 총 조각 수를 출력하세요.\n\n**만들 함수**\n\n| 함수 | 역할 |\n| --- | --- |\n| `split_ribbon(length, limit)` | 길이 `length`인 리본을 규칙에 따라 처리합니다. 최종 조각이 나올 때마다 그 길이를 출력하고, 만들어진 최종 조각 수를 정수로 반환합니다. |\n\n함수 안에서는 최종 조각의 길이만 출력합니다. 총 조각 수는 함수가 반환한 값을 사용해 함수 밖에서 출력합니다.\n\n**입출력 형식**\n\n- **입력:** 처음 리본 길이, 조각의 최대 길이를 한 줄씩 입력합니다. 총 2줄입니다.\n- **출력:** 최종 조각마다 `조각: 길이cm`를 한 줄 출력하고, 마지막 줄에 `총 조각: 개수개`를 출력합니다.\n- **조건:** 두 입력은 모두 1 이상 100 이하의 정수입니다. 처음 길이가 최대 길이 이하이면 자르지 않은 리본 한 줄이 최종 조각입니다.\n- 반복문을 사용하지 않고 재귀함수로 처리합니다. 같은 길이의 조각도 서로 다른 실물이므로 각각 출력합니다.\n\n**작성 안내**\n\n함수 선언과 입력 코드가 제공됩니다. **함수 본문, 함수 호출, 총 조각 수 출력**을 작성하세요.\n문제 2의 출력 순서와 문제 3의 종료 조건을 활용하되, 이번에는 두 조각에 같은 함수를 각각 적용해야 합니다.\n\n각 재귀 호출의 반환값을 변수에 저장해 사용하세요.\n이미 처리한 조각에 대해 개수만 다시 알아내려고 함수를 또 호출하면, 같은 안내가 중복 출력됩니다.\n\n**입력 예시**\n```\n10\n3\n```\n\n**출력 예시**\n```\n리본 길이(cm): 10\n최대 조각 길이(cm): 3\n조각: 2cm\n조각: 3cm\n조각: 2cm\n조각: 3cm\n총 조각: 4개\n```\n","skeleton":"# To Do\n\ndef split_ribbon(length, limit):\n    # 재귀 호출로 최종 조각의 길이를 출력하고 조각 수를 반환하세요.\n    pass\n\n\n# 제공 코드: 입력 부분은 그대로 사용하세요.\nlength = int(input(\"리본 길이(cm): \"))\nlimit = int(input(\"최대 조각 길이(cm): \"))\n\n# 재귀함수를 호출해 반환값을 count에 저장하고 총 조각 수를 출력하세요.\n","code":"def split_ribbon(length, limit):\n    if length <= limit:\n        print(f\"조각: {length}cm\")\n        return 1\n\n    front = length // 2\n    back = length - front\n\n    front_count = split_ribbon(front, limit)\n    back_count = split_ribbon(back, limit)\n\n    return front_count + back_count\n\nlength = int(input(\"리본 길이(cm): \"))\nlimit = int(input(\"최대 조각 길이(cm): \"))\n\ncount = split_ribbon(length, limit)\nprint(f\"총 조각: {count}개\")","image":"assets/illustrations/925a5467c28d679fff62.webp","imageAlt":"공예 체험에 사용할 긴 리본과 가위, 자가 놓인 작업대","inputSpec":"처음 길이와 최대 길이를 두 줄에 입력","outputSpec":"최종 조각들의 길이와 총 조각 수","cases":[{"label":"기본 예제","input":["10","3"],"expected":"조각: 2cm\n조각: 3cm\n조각: 2cm\n조각: 3cm\n총 조각: 4개","fullOutput":"리본 길이(cm): 10\n최대 조각 길이(cm): 3\n조각: 2cm\n조각: 3cm\n조각: 2cm\n조각: 3cm\n총 조각: 4개","trace":[{"line":14,"kind":"line","scope":"<module>","value":null,"before":{"vars":{},"frames":[],"output":[]},"state":{"vars":{"length":10},"frames":[],"output":[]}},{"line":15,"kind":"line","scope":"<module>","value":null,"before":{"vars":{"length":10},"frames":[],"output":[]},"state":{"vars":{"length":10,"limit":3},"frames":[],"output":[]}},{"line":17,"kind":"call","scope":"split_ribbon","value":null,"before":{"vars":{"length":10,"limit":3},"frames":[],"output":[]},"state":{"vars":{"length":10,"limit":3},"frames":[{"id":1,"name":"split_ribbon","line":1,"vars":{"length":10,"limit":3}}],"output":[]},"callId":1},{"line":2,"kind":"condition","scope":"split_ribbon","value":false,"before":{"vars":{"length":10,"limit":3},"frames":[{"id":1,"name":"split_ribbon","line":1,"vars":{"length":10,"limit":3}}],"output":[]},"state":{"vars":{"length":10,"limit":3},"frames":[{"id":1,"name":"split_ribbon","line":6,"vars":{"length":10,"limit":3}}],"output":[]}},{"line":6,"kind":"line","scope w":6,"source":2,"kind":"write","context":"split_ribbon()"},{"row":7,"source":3,"kind":"write","context":"split_ribbon()"},{"row":8,"source":4,"kind":"write","context":"split_ribbon()"},{"row":10,"source":6,"kind":"write","context":"split_ribbon()"},{"row":11,"source":7,"kind":"write","context":"split_ribbon()"},{"row":13,"source":9,"kind":"write","context":"split_ribbon()"},{"row":14,"source":10,"kind":"write","context":"split_ribbon()"},{"row":16,"source":12,"kind":"write","context":"split_ribbon()"},{"row":24,"source":17,"kind":"resume","context":"입력과 호출부"},{"row":25,"source":18,"kind":"write","context":"결과 출력"}],"final":"# To Do\n\ndef split_ribbon(length, limit):\n    # 재귀 호출로 최종 조각의 길이를 출력하고 조각 수를 반환하세요.\n    if length <= limit:\n        print(f\"조각: {length}cm\")\n        return 1\n\n    front = length // 2\n    back = length - front\n\n    front_count = split_ribbon(front, limit)\n    back_count = split_ribbon(back, limit)\n\n    return front_count + back_count\n\n\n# 제공 코드: 입력 부분은 그대로 사용하세요.\nlength = int(input(\"리본 길이(cm): \"))\nlimit = int(input(\"최대 조각 길이(cm): \"))\n\n# 재귀함수를 호출해 반환값을 count에 저장하고 총 조각 수를 출력하세요.\ncount = split_ribbon(length, limit)\nprint(f\"총 조각: {count}개\")"}},{"id":"ticket","title":"특별 체험 부스 입장권 확인","tag":"추가문제","problemNumber":5,"statement":"**문제 상황**\n\n특별 체험 부스의 입장권에는 숫자로 된 코드와 확인 숫자가 적혀 있습니다.\n다음 두 조건을 **모두** 만족하면 입장을 승인합니다.\n\n- 코드가 앞에서 읽어도 뒤에서 읽어도 같은 대칭 코드입니다.\n- 코드의 각 자릿수를 더한 합의 일의 자리와 입장권에 적힌 확인 숫자가 같습니다.\n\n도전문제 1의 자릿수 합과 도전문제 3의 대칭 검사를 조합해 입장권 확인 프로그램을 작성하세요.\n대칭 여부와 직접 계산한 확인 숫자를 먼저 보여 준 뒤, 입장 승인 여부를 출력합니다.\n\n**만들 함수**\n\n| 함수 | 역할 |\n| --- | --- |\n| `digit_sum(n)` | 0 이상의 정수 `n`의 자릿수 합을 재귀적으로 구해 반환합니다. |\n| `is_palindrome(text)` | 문자열 `text`의 대칭 여부를 재귀적으로 검사해 불리언 값으로 반환합니다. |\n\n두 함수는 도전문제 1과 3에서 구현한 것과 같은 역할을 하며, 함수 안에서는 출력하지 않습니다.\n\n**입출력 형식**\n\n- **입력:** 입장 코드, 입장권에 적힌 확인 숫자를 한 줄씩 입력합니다. 총 2줄입니다.\n- **출력:** 첫 줄은 `대칭 여부: 예` 또는 `대칭 여부: 아니요`, 둘째 줄은 `계산한 확인 숫자: 숫자`, 셋째 줄은 `입장: 승인` 또는 `입장: 거절`입니다.\n- **조건:** 코드는 숫자 `0`부터 `9`로만 이루어진 길이 1 이상 12 이하의 문자열입니다. 확인 숫자는 0 이상 9 이하의 정수입니다.\n- **맨 앞의 0도 대칭 검사에 포함합니다.** 코드는 문자열로 보관하고, 자릿수 합을 구하는 함수에 전달할 때만 정수로 변환합니다. 앞의 0이 사라져도 자릿수 합에는 영향이 없습니다.\n- 반복문, `sum()`, `reversed()`, `[::-1]`은 사용하지 않습니다. 두 계산 모두 재귀함수로 구현합니다.\n\n**작성 안내**\n\n함수 선언과 입력 코드가 제공됩니다. **두 함수의 본문, 함수 호출, 승인 여부 판단과 출력**을 작성하세요.\n대칭 검사 결과는 `symmetric`, 계산한 확인 숫자는 `check`에 저장합니다.\n대칭이 아니어도 계산한 확인 숫자는 출력해야 합니다.\n입력 조건은 항상 지켜지므로 별도의 잘못된 입력 처리는 필요하지 않습니다.\n\n**입력 예시**\n```\n01210\n4\n```\n\n**출력 예시**\n```\n입장 코드: 01210\n입장권 확인 숫자: 4\n대칭 여부: 예\n계산한 확인 숫자: 4\n입장: 승인\n```\n","skeleton":"# To Do\n\ndef digit_sum(n):\n    # 자릿수의 합을 재귀적으로 구해 반환하세요.\n    pass\n\n\ndef is_palindrome(text):\n    # 대칭 여부를 재귀적으로 검사해 반환하세요.\n    pass\n\n\n# 제공 코드: 입력 부분은 그대로 사용하세요.\ncode = input(\"입장 코드: \")\nexpected = int(input(\"입장권 확인 숫자: \"))\n\n# 두 재귀함수로 symmetric과 check를 구하세요.\n\n\n# 대칭 여부, 계산한 확인 숫자, 입장 승인 여부를 출력하세요.\n","code":"def digit_sum(n):\n    if n < 10:\n        return n\n    return n % 10 + digit_sum(n // 10)\n\ndef is_palindrome(text):\n    if len(text) <= 1:\n        return True\n    if text[0] != text[-1]:\n        return False\n    return is_palindrome(text[1:-1])\n\ncode = input(\"입장 코드: \")\nexpected = int(input(\"입장권 확인 숫자: \"))\n\nsymmetric = is_palindrome(code)\ncheck = digit_sum(int(code)) % 10\n\nif symmetric:\n    print(\"대칭 여부: 예\")\nelse:\n    print(\"대칭 여부: 아니요\")\nprint(f\"계산한 확인 숫자: {check}\")\n\nif symmetric and check == expected:\n    print(\"입장: 승인\")\nelse:\n    print(\"입장: 거절\")","image":"assets/illustrations/a9781c6398eb81d658af.webp","imageAlt":"체험 부스 접수대에서 숫자 코드가 있는 입장권을 확인하는 모습","inputSpec":"숫자 코드와 확인 숫자를 두 줄에 입력","outputSpec":"대칭 여부, 확인 숫자, 입장 결과","cases":[{"label":"앞의 0 포함 승인","input":["01210","4"],"expected":"대칭 여부: 예\n계산한 확인 숫자: 4\n입장: 승인","fullOutput":"입장 코드: 01210\n입장권 확인 숫자: 4\n대칭 여부: 예\n계산한 확인 숫자: 4\n입장: 승인","trace":[{"line":13,"kind":"line","scope":"<module>","value":null,"before":{"vars":{},"frames":[],"output":[]},"state":{"vars":{"code":"01210"},"frames":[]," <script>
'use strict';
const lessons = JSON.parse(document.getElementById('lesson-data').textContent);
const $ = id => document.getElementById(id);
const escapeHTML = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
let typing = null;
const ui = {lesson:0,phase:'problem',buildIndex:0,traceIndex:-1,caseIndex:0,toastTimer:null,modalFocus:null};
const lesson = () => lessons[ui.lesson];
const testCase = () => lesson().cases[ui.caseIndex];
const buildStep = () => lesson().build.steps[ui.buildIndex-1] || null;
const traceStep = () => testCase().trace[ui.traceIndex] || null;
const emptyState = () => ({objects:[],frames:[],vars:{},output:[]});
const same = (a,b) => JSON.stringify(a) === JSON.stringify(b);
const pyValue = value => value && typeof value==='object' && 'ref' in value ? `객체 #${Number(value.ref)}` : value===true ? 'True' : value===false ? 'False' : value===null ? 'None' : typeof value==='string' ? `"${value}"` : Array.isArray(value) ? `[${value.map(pyValue).join(', ')}]` : String(value);
const currentRows = () => {
 const index = ui.phase==='run' ? lesson().build.steps.length : ui.buildIndex;
 return lesson().build.rows.filter(row=>row.show<=index && (row.until===undefined || index<row.until));
};
const currentCode = () => currentRows().map(row=>row.text).join('\n');

function highlight(code){
 const token=/(#[^\n]*|f?"(?:\\.|[^"\\])*"|f?'(?:\\.|[^'\\])*'|\b(?:class|def|return|if|else|for|in|and|or|not|True|False|None|pass)\b|\bself\b|\b(?:print|input|int|list|map|len)\b|\b\d+\b)/g;
 let html='',last=0;
 for(const match of code.matchAll(token)){
  html+=escapeHTML(code.slice(last,match.index));const value=match[0];
  const type=value.startsWith('#')?'comment':/^(f?["'])/.test(value)?'str':/^\d/.test(value)?'num':value==='self'?'self':/^(print|input|int|list|map|len)$/.test(value)?'fn':'kw';
  html+=`<span class="${type}">${escapeHTML(value)}</span>`;last=match.index+value.length;
 }
 return html+escapeHTML(code.slice(last));
}


function introPicture(){return "";}

function renderLesson(){
 const l=lesson();
 $('lesson-title').textContent=l.title;
 $('lesson-badge').textContent=ui.lesson===4?'추가':String(ui.lesson+1).padStart(2,'0');
 $('problem-copy').innerHTML=markdown(l.statement);
 formatSentences($('problem-copy'));
 $('scene').innerHTML=`<button class="scene-trigger" type="button" aria-haspopup="dialog" aria-label="${escapeHTML(l.title)} 그림 크게 보기" title="그림 크게 보기"><img src="${l.image}" alt="${escapeHTML(l.imageAlt)}"><span class="scene-zoom" aria-hidden="true">＋</span></button>`;
 $('case-select').innerHTML=l.cases.map((c,index)=>`<option value="${index}">예제 ${index+1} / ${escapeHTML(c.label)}</option>`).join('');
 $('case-select').value=String(ui.caseIndex);
 $('problem-copy').scrollTop=0;
 renderIO();render(true);
}

function renderIO(){
 const l=lesson(),example=l.example;
 $('io-panel').innerHTML=`<p class="example-label">기본 예제 1</p><section class="io-section"><h2>입력</h2><p class="io-spec">${escapeHTML(l.inputSpec)}</p><pre class="io-example" id="input-example">${escapeHTML(example.input||'(빈 줄 입력)')}</pre></section><section class="io-section"><h2>실행 화면</h2><p class="io-spec">${escapeHTML(l.outputSpec)}</p><pre class="io-example" id="output-example">${escapeHTML(example.output)}</pre></section>`;
}

function revealExplanation(lineNumber){
 const code=lesson().code.split('\n')[lineNumber-1].trim();
 if(code.includes('input('))return ['입력을 준비합니다',code.includes('.split()')?'공백으로 나누어 물품 목록을 만듭니다. 빈 줄을 입력하면 빈 리스트가 됩니다.':code.includes('int(')?'계산에 사용할 숫자는 int()로 정수로 바꿉니다.':'코드를 문자열로 저장하므로 맨 앞의 0도 보존됩니다.'];
 if(code.startsWith('def '))return ['재귀함수를 정의합니다','호출할 때마다 매개변수에 새 인수를 받습니다. 함수 본문은 정의할 때가 아니라 호출할 때 실행됩니다.'];
 if(code==='if n < 10:')return ['종료 조건: 한 자리 수','0을 포함한 한 자리 수는 그 값 자체가 자릿수의 합입니다. 이때는 다시 호출하지 않습니다.'];
 if(code==='return n')return ['가장 작은 문제의 답을 반환합니다','현재 숫자를 호출한 곳으로 돌려줍니다. return은 화면에 값을 출력하지 않습니다.'];
 if(code==='return n % 10 + digit_sum(n // 10)')return ['한 자릿수를 떼어내고 나머지를 맡깁니다','n // 10으로 자릿수를 줄여 호출합니다. 돌아온 합에 현재 일의 자리 n % 10을 더해 반환합니다.'];
 if(code==='if len(items) == 0:')return ['빈 목록인지 먼저 확인합니다','함수 안에서는 재귀를 멈추는 조건입니다. 함수 밖에서는 빈 입력을 안내하는 조건입니다.'];
 if(code==='return')return ['아무것도 출력하지 않고 종료합니다','빈 목록에는 반납할 물품이 없습니다. 이 호출의 반환값은 None이며 호출한 곳으로 돌아갑니다.'];
 if(code==='print_returns(items[1:])')return ['나머지 물품을 먼저 처리합니다','첫 물품을 제외한 더 짧은 목록을 넘깁니다. 이 호출이 모두 끝나야 다음 출력문으로 이동합니다.'];
 if(code.includes('print(f"반납:'))return ['재귀 호출이 끝난 뒤 현재 물품을 출력합니다','나중에 빌린 물품의 안내가 먼저 끝났습니다. 현재 호출의 첫 물품을 출력하면 역순이 됩니다.'];
 if(code==='if len(text) <= 1:')return ['종료 조건: 비교할 쌍이 없습니다','빈 문자열과 한 글자는 대칭입니다. 인덱스로 글자를 읽기 전에 이 조건부터 검사합니다.'];
 if(code==='if text[0] != text[-1]:')return ['양 끝 글자를 비교합니다','다르면 즉시 False를 반환합니다. 같으면 양 끝을 제외한 부분을 더 검사합니다.'];
 if(code==='return True')return ['대칭임을 반환합니다','더 비교할 쌍이 없으므로 True를 호출한 곳에 돌려줍니다.'];
 if(code==='return False')return ['불일치를 발견해 검사를 끝냅니다','False를 반환하면 이 호출에서는 더 재귀 호출하지 않습니다. 기다리던 호출들도 이 결과를 전달합니다.'];
 if(code==='return is_palindrome(text[1:-1])')return ['양 끝을 제외한 부분을 검사합니다','문자열이 두 글자씩 줄어듭니다. 안쪽에서 돌아온 불리언 값을 그대로 반환합니다.'];
 if(code==='if length <= limit:')return ['종료 조건: 더 자르지 않아도 됩니다','현재 길이가 최대 길이 이하이면 이 리본 한 줄이 최종 조각입니다.'];
 if(code.includes('print(f"조각:'))return ['최종 조각의 길이를 출력합니다','최대 길이 이하인 조각에서만 출력합니다. 앞쪽 처리가 끝난 뒤 뒤쪽으로 진행합니다.'];
 if(code==='return 1')return ['최종 조각 한 개를 반환합니다','길이가 아니라 조각 수 1을 반환합니다. 이 값은 호출한 곳에서 합산합니다.'];
 if(code==='front = length // 2')return ['앞쪽 조각의 길이를 구합니다','정수 나눗셈을 사용하므로 홀수 길이에서는 앞쪽 조각이 1cm 짧습니다.'];
 if(code==='back = length - front')return ['남은 길이를 뒤쪽 조각에 배정합니다','앞쪽과 뒤쪽 길이의 합은 현재 리본 길이와 같습니다.'];
 if(code==='front_count = split_ribbon(front, limit)')return ['앞쪽 조각을 모두 처리합니다','앞쪽에 같은 함수를 적용하고 반환된 최종 조각 수를 저장합니다. 이 호출이 끝나야 뒤쪽을 처리합니다.'];
 if(code==='back_count = split_ribbon(back, limit)')return ['뒤쪽 조각을 처리합니다','뒤쪽의 최종 조각 수를 따로 저장합니다. 같은 길이라도 서로 다른 조각입니다.'];
 if(code==='return front_count + back_count')return ['두 호출의 조각 수를 합쳐 반환합니다','이미 받은 반환값을 더합니다. 개수를 알아내기 위해 함수를 다시 호출하지 않습니다.'];
 if(code.startsWith('symmetric ='))return ['원래 문자열로 대칭을 검사합니다','맨 앞의 0도 포함한 문자열 전체를 넘기고 반환값을 symmetric에 저장합니다.'];
 if(code.startsWith('check ='))return ['자릿수 합의 일의 자리를 구합니다','재귀함수가 반환한 합에 % 10을 적용합니다. 합의 자릿수를 다시 더하는 방식이 아닙니다.'];
 if(code.startsWith('count ='))return ['전체 리본의 최종 조각 수를 받습니다','함수가 최종 조각의 길이를 순서대로 출력합니다. 반환된 총 개수는 count에 저장합니다.'];
 if(code==='if symmetric and check == expected:')return ['두 조건을 모두 만족해야 승인합니다','대칭이어야 하고 계산한 확인 숫자도 입장권의 숫자와 같아야 합니다.'];
 if(code.startsWith('if '))return ['반환된 결과에 따라 분기합니다','재귀함수의 답으로 어떤 출력문을 실행할지 정합니다.'];
 if(code==='else:')return ['조건이 거짓일 때의 동작을 작성합니다','바로 앞 if의 조건을 만족하지 않았을 때 이 부분을 실행합니다.'];
 if(code.startsWith('print_returns('))return ['반납 안내를 시작합니다','이 함수는 직접 출력합니다. 함수 호출을 print()로 감싸지 않습니다.'];
 if(code.startsWith('print('))return ['요구한 형식으로 결과를 출력합니다','문구와 공백을 기본 예제와 맞춥니다. 반환값을 사용하는 일과 출력하는 일을 구분하세요.'];
 return ['현재 줄을 앞뒤 코드와 연결합니다','이 줄이 사용하는 값과 다음 줄에 전달하는 값을 확인하세요.'];
}

function buildExplanation(){
 const step=buildStep();
 if(!step)return ['학생용 코드에서 시작합니다','제공된 코드와 주석을 유지하며 한 줄씩 완성합니다. 이 화면의 작성 순서는 다음 화면의 실제 실행 순서와 다릅니다.'];
 if(step.kind==='resume')return ['함수 구현을 마치고 호출부로 돌아왔습니다','이 호출에서 사용할 재귀함수가 준비되었습니다. 이어서 반환값 처리와 출력을 확인합니다.'];
 const explanation=revealExplanation(step.source);
 if(step.kind==='given')explanation[0]='제공된 코드를 확인합니다';
 return explanation;
}

function traceExplanation(step){
 const state=step.state,before=step.before,frame=state.frames.at(-1);
 if(step.kind==='call')return ['새 호출로 들어갑니다',`호출 #${frame.id}의 ${frame.name}()에 인수가 전달되었습니다. ${state.frames.length>1?'앞선 호출은 이 결과를 기다립니다.':'함수 본문 실행을 시작합니다.'}`];
 if(step.kind==='return')return ['호출한 곳으로 값을 돌려줍니다',`호출 #${step.returnId}의 반환값은 ${pyValue(step.value)}입니다. ${frame?`호출 #${frame.id}로 돌아가 기다리던 계산을 이어갑니다.`:'함수 밖의 호출부로 돌아갑니다.'}${step.implicit?' return 문 없이 끝나도 None을 반환합니다.':''}`];
 if(step.kind==='condition')return [step.value?'조건이 참입니다':'조건이 거짓입니다',`${lesson().code.split('\n')[step.line-1].trim().replace(/^if /,'').replace(/:$/,'')} → ${step.value?'True. 바로 아래 문장을 실행합니다.':'False. 이 분기를 건너뜁니다.'}`];
 if(state.output.length>before.output.length)return ['출력이 한 줄 늘어납니다',state.frames.length?'현재 호출의 값으로 출력했습니다. 출력 후에는 그 호출의 다음 문장으로 진행합니다.':'함수 밖에서 결과를 출력했습니다.'];
 const current=frame?.vars||state.vars,old=frame?before.frames.find(f=>f.id===frame.id)?.vars||{}:before.vars;
 const changes=Object.entries(current).filter(([key,value])=>!same(value,old[key]));
 if(changes.length)return ['값을 변수에 저장합니다',changes.map(([key,value])=>`${key} = ${pyValue(value)}`).join(', ')];
 return revealExplanation(step.line);
}

function keepCodeLineVisible(line){
 const container=$('code-scroll');
 if(!line?.isConnected||!container.contains(line))return;
 const top=line.offsetTop,bottom=top+line.offsetHeight;
 if(top<container.scrollTop+16||bottom>container.scrollTop+container.clientHeight-16)container.scrollTop=Math.max(0,top-Math.min(container.clientHeight*.27,70));
}

function finishTyping(){
 if(!typing)return;
 const animation=typing;typing=null;
 cancelAnimationFrame(animation.frame);
 animation.text.innerHTML=highlight(animation.fullText);
 animation.text.classList.remove('typing');
 animation.text.style.minHeight='';
 $('code-scroll').setAttribute('aria-busy','false');
 keepCodeLineVisible(animation.line);
}

function typeCodeLine(line,fullText){
 if(!line||window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const text=line.querySelector('.line-text');
 const indent=fullText.match(/^\s*/)[0],characters=Array.from(fullText.slice(indent.length));
 if(!characters.length)return;
 // Reserve the wrapped line's height so following code stays in place.
 text.style.minHeight=text.getBoundingClientRect().height+'px';
 text.innerHTML=highlight(indent);text.classList.add('typing');
 $('code-scroll').setAttribute('aria-busy','true');
 const animation={line,text,fullText,frame:0,count:0,started:performance.now()};
 typing=animation;
 const duration=Math.min(1100,Math.max(250,characters.length*18));
 function tick(now){
  if(typing!==animation)return;
  const count=Math.min(characters.length,Math.floor((now-animation.started)/duration*characters.length)+1);
  if(count!==animation.count){
   animation.count=count;text.innerHTML=highlight(indent+characters.slice(0,count).join(''));
   keepCodeLineVisible(line);
  }
  if(count===characters.length)finishTyping();
  else animation.frame=requestAnimationFrame(tick);
 }
 animation.frame=requestAnimationFrame(tick);
}

function renderCode(resetScroll=false,animateLine=false){
 const rows=currentRows(),running=ui.phase==='run';
 const step=running?traceStep():buildStep();
 const target=running?rows.find(row=>row.source===step?.line)?.id:step?.row;
 $('code-scroll').innerHTML=rows.map(row=>`<div class="code-line ${!row.text.trim()?'blank':''} ${row.id===target?'active':''}" id="code-row-${row.id}" data-source="${row.source||''}" ${row.id===target?'aria-current="step"':''}><span class="line-text">${highlight(row.text)}</span></div>`).join('');
 $('code-context').textContent=running?step?.state.frames.at(-1)?.name?step.state.frames.at(-1).name+'()':'완성 코드':step?.context||'Python';
 const explanation=running?(step?traceExplanation(step):['완성한 코드가 움직이는 순서','함수 정의가 준비되어 있습니다. 다음 버튼으로 입력부터 재귀 호출과 복귀를 따라갑니다.']):buildExplanation();
 $('explanation').hidden=!explanation;
 $('explanation-title').textContent=explanation?.[0]||'';$('explanation-body').textContent=explanation?.[1]||'';
 formatSentences($('explanation'));
 if(resetScroll||!target)$('code-scroll').scrollTop=0;
 if(target){
  const line=$('code-row-'+target);
  if(animateLine&&!running&&step?.kind==='write')typeCodeLine(line,rows.find(row=>row.id===target).text);
  requestAnimationFrame(()=>keepCodeLineVisible(line));
 }
}

function renderRuntime(resetScroll=false){
 const step=traceStep(),state=step?.state||emptyState(),before=step?.before||emptyState(),scroll=$('memory').scrollTop;
 const variableRows=(values,previous={})=>Object.entries(values).map(([key,value])=>`<div class="variable ${!same(value,previous[key])?'changed':''}"><span>${escapeHTML(key)}</span><span class="variable-value">${key in previous&&!same(value,previous[key])?`<span class="previous-value">${escapeHTML(pyValue(previous[key]))}</span> → `:''}${escapeHTML(pyValue(value))}</span></div>`).join('');
 let content='';
 if(!step)content='<div class="empty-state"><div class="empty-mark">f( )</div><p>아직 재귀 호출 전입니다.<br>입력을 읽고 호출을 시작해 봅시다.</p></div>';
 else{
  content=`<div class="recursion-status"><b>현재 호출 깊이 ${state.frames.length}</b><span>함수 밖은 깊이 0</span></div>`;
  if(step.kind==='call')content+=`<div class="return-message">↓ 호출 #${step.callId} 시작</div>`;
  if(step.kind==='return'){
   const target=state.frames.at(-1);
   content+=`<div class="return-message">↑ 호출 #${step.returnId} → ${target?'호출 #'+target.id:'함수 밖'}<strong>반환값: ${escapeHTML(pyValue(step.value))}</strong></div>`;
   const v=step.returnVars;
   if(step.scope==='digit_sum'&&v.n>=10)content+=`<div class="calculation">${v.n%10} + ${step.value-v.n%10} = ${step.value}</div>`;
   if(step.scope==='split_ribbon'&&'front_count' in v)content+=`<div class="calculation">앞 ${v.front_count}개 + 뒤 ${v.back_count}개 = ${step.value}개</div>`;
  }
  content+='<div class="recursive-frames">'+state.frames.map((frame,index)=>{
   const active=index===state.frames.length-1,old=before.frames.find(f=>f.id===frame.id);
   return `<section class="recursive-frame ${active?'active':''}" data-call-id="${frame.id}" ${active?'aria-current="step"':''}><div class="frame-heading"><strong>#${frame.id} ${escapeHTML(frame.name)}()</strong><span>${active?'현재 호출':'복귀 대기'} / 깊이 ${index+1}</span></div><div class="variables">${variableRows(frame.vars,old?.vars)}</div></section>`;
  }).join('')+'</div>';
  if(Object.keys(state.vars).length)content+=`<section class="global-variables"><h3>함수 밖의 변수</h3><div class="variables">${variableRows(state.vars,before.vars)}</div></section>`;
  if(!state.frames.length&&!Object.keys(state.vars).length)content+='<p class="frame-note">함수 밖에서 실행 중입니다.</p>';
 }
 $('memory').innerHTML=content;$('memory').scrollTop=resetScroll?0:scroll;
 $('output-lines').innerHTML=state.output.length?state.output.map((line,index)=>`<div class="output-line ${index>=before.output.length?'new-output':''}">${escapeHTML(line)}</div>`).join(''):'<p class="output-placeholder">아직 출력이 없습니다.</p>';
 $('finished-label').hidden=ui.traceIndex!==testCase().trace.length-1;
 if(state.output.length>before.output.length)$('output-lines').scrollTop=$('output-lines').scrollHeight;
 if(step?.kind==='return'||step?.kind==='call')$('memory').scrollTop=0;
 else if(state.frames.length){
  const element=$('memory').querySelector('.recursive-frame.active');
  if(element){const outer=$('memory').getBoundingClientRect(),inner=element.getBoundingClientRect();if(inner.top<outer.top||inner.bottom>outer.bottom)$('memory').scrollTop+=inner.top-outer.top-8;}
 }
}

function next(){

function formatSentences(root){
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
 const nodes=[];
 while(walker.nextNode()){
  const node=walker.currentNode,parent=node.parentElement;
  if(parent.closest('p,li,td,th')&&!parent.closest('pre,code,svg'))nodes.push(node);
 }
 for(const node of nodes){
  const lines=node.textContent.replace(/([.!?。！？]["'’”)\]]*)[ \t\r\n]+/g,'$1\n').split('\n');
  if(lines.length<2)continue;
  const fragment=document.createDocumentFragment();
  lines.forEach((line,index)=>{if(index)fragment.append(document.createElement('br'));fragment.append(document.createTextNode(line))});
  node.replaceWith(fragment);
 }
}

function markdown(source){
 const inline=value=>escapeHTML(value).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>');
 const lines=source.split('\n');
 let html='',paragraph=[];
 const flush=()=>{if(paragraph.length){html+=`<p>${inline(paragraph.join(' '))}</p>`;paragraph=[]}};
 for(let index=0;index<lines.length;index++){
  const line=lines[index].trim();
  if(!line){flush();continue}
  if(line.startsWith('```')){
   flush();const code=[];
   while(++index<lines.length&&!lines[index].startsWith('```'))code.push(lines[index]);
   html+=`<pre>${escapeHTML(code.join('\n'))}</pre>`;continue;
  }
  if(line.startsWith('|')){
   flush();const rows=[];
   while(index<lines.length&&lines[index].trim().startsWith('|')){
    const row=lines[index++].trim();
    if(!/^\|[\s:|\-]+\|$/.test(row))rows.push(row.split('|').slice(1,-1));
   }
   index--;
   html+='<table><thead><tr>'+rows[0].map(cell=>`<th scope="col">${inline(cell.trim())}</th>`).join('')+'</tr></thead><tbody>';
   html+=rows.slice(1).map(row=>'<tr>'+row.map(cell=>`<td>${inline(cell.trim())}</td>`).join('')+'</tr>').join('')+'</tbody></table>';continue;
  }
  if(/^\d+\. /.test(line)){
   flush();html+='<ol>';
   while(index<lines.length&&/^\d+\. /.test(lines[index].trim()))html+=`<li>${inline(lines[index++].trim().replace(/^\d+\. /,''))}</li>`;
   index--;html+='</ol>';continue;
  }
  if(line.startsWith('- ')){
   flush();html+='<ul>';
   while(index<lines.length&&lines[index].trim().startsWith('- '))html+=`<li>${inline(lines[index++].trim().slice(2))}</li>`;
   index--;html+='</ul>';continue;
  }
  if(/^#{1,3} /.test(line)||/^\*\*.+\*\*$/.test(line)){
   flush();html+=`<h3>${inline(line.replace(/^#+ /,''))}</h3>`;continue;
  }
  paragraph.push(line);
 }
 flush();return html;
}

async function copyCode(){
 finishTyping();
 const source=currentCode();let copied=false;
 if(navigator.clipboard?.writeText){try{await navigator.clipboard.writeText(source);copied=true}catch(error){/* A file URL may require the local fallback. */}}
 if(!copied){
  const area=document.createElement('textarea'),focused=document.activeElement;
  area.value=source;area.setAttribute('readonly','');area.style.cssText='position:fixed;left:-10000px;top:0';
  document.body.append(area);area.select();
  try{copied=document.execCommand('copy')}catch(error){copied=false}
  area.remove();focused?.focus();
 }
 if(copied)toast('화면의 코드와 주석을 복사했습니다.');
 else openModal('코드 직접 복사',`<p>코드를 선택한 뒤 Ctrl+C 또는 ⌘C를 눌러 주세요.</p><textarea aria-label="복사할 코드" readonly>${escapeHTML(source)}</textarea>`);
}

async function toggleFullscreen(){
 try{
  if(document.fullscreenElement){await document.exitFullscreen();return}
  if(document.documentElement.requestFullscreen){await document.documentElement.requestFullscreen();return}
 }catch(error){/* Fall back to a larger presentation area when fullscreen is unavailable. */}
 document.body.classList.toggle('focus-screen');
 toast(document.body.classList.contains('focus-screen')?'F 또는 Esc를 누르면 원래 화면으로 돌아갑니다.':'원래 화면으로 돌아왔습니다.');
}

$('next-button').addEventListener('click',next);
$('previous-button').addEventListener('click',previous);
$('copy-button').addEventListener('click',copyCode);
$('restart-button').addEventListener('click',restartPhase);
$('menu-button').addEventListener('click',showMenu);
$('scene').addEventListener('click',event=>{if(event.target.closest('.scene-trigger'))showPicture()});
$('fullscreen-button').addEventListener('click',toggleFullscreen);
$('close-modal').addEventListener('click',closeModal);
$('modal-backdrop').addEventListener('click',event=>{if(event.target===$('modal-backdrop'))closeModal()});
document.querySelectorAll('[data-phase]').forEach(button=>button.addEventListener('click',()=>setPhase(button.dataset.phase)));
$('case-select').addEventListener('change',event=>{ui.caseIndex=Number(event.target.value);ui.traceIndex=-1;renderIO();render(true)});
$('modal-content').addEventListener('click',event=>{
 const choice=event.target.closest('[data-lesson]');
 if(choice){closeModal();changeLesson(Number(choice.dataset.lesson))}
 if(event.target.closest('#reset-lesson')){closeModal();changeLesson(ui.lesson)}
 if(event.target.closest('#help-button'))showHelp();
});
document.addEventListener('fullscreenchange',()=>$('fullscreen-button').setAttribute('aria-label',document.fullscreenElement?'전체 화면 종료':'전체 화면'));
document.addEventListener('keydown',event=>{
 if(event.key==='Escape'){closeModal();document.body.classList.remove('focus-screen');return}
 if(!$('modal-backdrop').hidden){
  if(event.key==='Tab'){
   const focusable=[...$('modal').querySelectorAll('button,textarea,select,a[href],[tabindex="0"]')].filter(element=>!element.disabled&&!element.hidden);
   const first=focusable[0],last=focusable.at(-1);
   if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus()}
   else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus()}
  }
  return;
 }
 if(event.altKey||event.ctrlKey||event.metaKey||event.isComposing||event.repeat)return;
 if(event.target.closest('select,input,textarea,[contenteditable="true"]'))return;
 if(event.target.closest('button,a[href]')&&[' ','Enter'].includes(event.key))return;
 if(['ArrowRight',' '].includes(event.key)){event.preventDefault();next()}
 else if(event.key==='ArrowLeft'){event.preventDefault();previous()}
 else if(event.key==='PageDown'){event.preventDefault();changeLesson(ui.lesson+1)}
 else if(event.key==='PageUp'){event.preventDefault();changeLesson(ui.lesson-1)}
 else if(/^[1-5]$/.test(event.key)){event.preventDefault();changeLesson(Number(event.key)-1)}
 else if(event.key.toLowerCase()==='f'){event.preventDefault();toggleFullscreen()}
 else if(event.key==='?'){event.preventDefault();showHelp()}
});
renderLesson();

</script>
</body>
</html>
